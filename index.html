<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Your Universe Awaits</title>
  <meta name="description" content="GAIVEX — more than a social network. Connect, create, explore, belong." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* Splash-only styles — kept local so style.css stays page-agnostic */
    body, html { height: 100%; }

    .splash {
      height: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 48px 24px calc(40px + var(--safe-bottom));
      position: relative;
    }

    /* Drifting nebula blobs behind the mark */
    .splash::before,
    .splash::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      z-index: -1;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .splash::before {
      top: 8%;
      left: -10%;
      background: var(--violet);
    }
    .splash::after {
      bottom: 12%;
      right: -12%;
      background: var(--blue);
      animation-delay: 2s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(20px, -16px) scale(1.08); }
    }

    .splash-mark {
      margin-top: 14vh;
    }

    .orbit {
      position: relative;
      width: 132px;
      height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
    }
    .orbit-ring.r2 { inset: -18px; border-color: var(--line-soft); animation: spin 14s linear infinite; }
    .orbit-ring.r3 { inset: -36px; border-color: rgba(124,58,237,0.18); animation: spin 22s linear infinite reverse; }

    .orbit-ring.r2::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px 2px var(--cyan);
      transform: translateX(-50%);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .orbit-core {
      width: 84px;
      height: 84px;
      border-radius: 28px;
      background: var(--grad-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 36px;
      color: #fff;
      box-shadow: var(--shadow-glow);
    }

    .splash-word {
      margin-top: 22px;
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 0.02em;
      background: var(--grad-brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .splash-tag {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 13.5px;
      letter-spacing: 0.03em;
    }

    .splash-tag .dot {
      margin: 0 6px;
      color: var(--text-muted);
    }

    .splash-foot {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .splash-loader {
      width: 100%;
      max-width: 180px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .splash-loader::after {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: var(--grad-brand);
      animation: loadbar 1.1s ease-in-out infinite;
    }
    @keyframes loadbar {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    .splash-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    .splash-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <main class="splash">
    <div class="splash-mark center-col">
      <div class="orbit">
        <div class="orbit-ring r3"></div>
        <div class="orbit-ring r2"></div>
        <div class="orbit-core">G</div>
      </div>
      <div class="splash-word">GAIVEX</div>
      <p class="splash-tag">
        <span>Your World</span><span class="dot">·</span><span>Your People</span><span class="dot">·</span><span>Your Space</span>
      </p>
    </div>

    <div class="splash-foot">
      <div class="splash-loader" id="loader"></div>
      <p class="splash-status" id="status">Entering your universe…</p>

      <!-- Shown only if redirect takes unusually long (offline, blocked script, etc.) -->
      <div class="splash-fallback" id="fallback">
        <a href="onboarding.html" class="btn btn-primary btn-block">Get Started</a>
        <a href="auth.html" class="btn btn-outline btn-block">I already have an account</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { getAuthState, hasOnboarded, HOME_PAGE, AUTH_PAGE, ONBOARDING_PAGE } from './js/app.js';

    const statusEl = document.getElementById('status');
    const fallbackEl = document.getElementById('fallback');
    const loaderEl = document.getElementById('loader');

    // If something goes wrong (offline / blocked network), stop the spinner
    // and offer manual entry points instead of a dead splash screen.
    const safety = setTimeout(() => {
      loaderEl.style.display = 'none';
      statusEl.textContent = "Couldn't reach GAIVEX — check your connection.";
      fallbackEl.style.display = 'flex';
    }, 6000);

    (async () => {
      // Small minimum splash time so the animation isn't a flash-cut.
      const minDelay = new Promise((r) => setTimeout(r, 1100));
      const [user] = await Promise.all([getAuthState(), minDelay]);

      clearTimeout(safety);

      if (user) {
        window.location.replace(HOME_PAGE);
      } else if (hasOnboarded()) {
        window.location.replace(AUTH_PAGE);
      } else {
        window.location.replace(ONBOARDING_PAGE);
      }
    })().catch(() => {
      clearTimeout(safety);
      loaderEl.style.display = 'none';
      statusEl.textContent = "Couldn't reach GAIVEX — check your connection.";
      fallbackEl.style.display = 'flex';
    });
  </script>
</body>
</html>
