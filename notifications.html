<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Notifications</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .nt-top { justify-content: flex-start; gap: 14px; }
    .nt-top a { font-size: 18px; color: var(--text-secondary); }
    .nt-top span { font-size: 16px; font-weight: 700; }

    .nt-body { padding: 16px; max-width: 560px; margin: 0 auto; }
    .nt-section-title {
      font-size: 12.5px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin: 4px 0 12px;
    }

    .nt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

    .nt-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
    }
    .nt-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; flex: 0 0 auto;
      overflow: hidden;
    }
    .nt-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .nt-info { flex: 1; min-width: 0; }
    .nt-info b { font-size: 14px; font-weight: 600; display: block; }
    .nt-info span { font-size: 12px; color: var(--text-muted); }

    .nt-actions { display: flex; gap: 8px; flex: 0 0 auto; }
    .nt-btn {
      height: 34px; padding: 0 14px; border-radius: var(--radius-pill);
      font-size: 12.5px; font-weight: 700;
    }
    .nt-accept { background: var(--grad-brand); color: #fff; }
    .nt-decline { background: rgba(255,255,255,0.05); border: 1px solid var(--line-strong); color: var(--text-secondary); }
    .nt-btn[disabled] { opacity: 0.5; pointer-events: none; }

    .nt-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 0; }

    .activity-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
    }
    .activity-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(124,58,237,0.15);
      display: flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    .activity-icon svg { width: 16px; height: 16px; stroke: var(--cyan); }
    .activity-text { font-size: 13px; color: var(--text-secondary); }
    .activity-text b { color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar nt-top">
    <a href="home.html" aria-label="Back">←</a>
    <span>Notifications</span>
  </header>

  <main class="page">
    <div class="nt-body">
      <div class="nt-section-title">Friend Requests</div>
      <div class="nt-list" id="requestList"></div>
      <p class="nt-empty" id="requestEmpty" style="display:none;">No pending friend requests.</p>

      <div class="nt-section-title">Activity</div>
      <div class="nt-list" id="activityList">
        <div class="card activity-item">
          <div class="activity-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </div>
          <p class="activity-text">Likes and comments on your pulses will show up here.</p>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="explore.html" data-page="explore">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Explore
    </a>
    <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="spaces.html" data-page="spaces">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Spaces
    </a>
    <a href="profile.html" data-page="profile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script type="module">
    import {
      db,
      doc, getDoc, updateDoc, arrayUnion, arrayRemove,
      onSnapshot,
    } from './js/firebase-init.js';
    import { requireAuth, setActiveNav, showToast } from './js/app.js';

    setActiveNav('home'); // notifications lives off the home tab's bell icon

    function initialsOf(name) {
      return (name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function avatarInner(photoURL, name) {
      return photoURL ? `<img src="${photoURL}" alt="" />` : initialsOf(name);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    (async () => {
      const currentUser = await requireAuth();
      if (!currentUser) return;

      const myRef = doc(db, 'users', currentUser.uid);

      onSnapshot(myRef, async (snap) => {
        if (!snap.exists()) return;
        const data = snap.data();
        const requestUids = Array.isArray(data.friendRequests) ? data.friendRequests : [];

        const listEl = document.getElementById('requestList');
        const emptyEl = document.getElementById('requestEmpty');

        if (requestUids.length === 0) {
          listEl.innerHTML = '';
          emptyEl.style.display = 'block';
          return;
        }
        emptyEl.style.display = 'none';

        // Fetch each requester's profile to show name/avatar.
        const profiles = await Promise.all(requestUids.map(async (uid) => {
          try {
            const s = await getDoc(doc(db, 'users', uid));
            return { uid, ...(s.exists() ? s.data() : { username: 'GAIVEX user' }) };
          } catch {
            return { uid, username: 'GAIVEX user' };
          }
        }));

        listEl.innerHTML = '';
        profiles.forEach((p) => {
          const item = document.createElement('div');
          item.className = 'card nt-item';
          item.innerHTML = `
            <div class="nt-avatar">${avatarInner(p.photoURL, p.username)}</div>
            <div class="nt-info">
              <b>${escapeHtml(p.username || 'GAIVEX user')}</b>
              <span>wants to be your friend</span>
            </div>
            <div class="nt-actions">
              <button class="nt-btn nt-decline" data-action="decline" data-uid="${p.uid}">Decline</button>
              <button class="nt-btn nt-accept" data-action="accept" data-uid="${p.uid}">Accept</button>
            </div>
          `;
          listEl.appendChild(item);
        });
      });

      document.getElementById('requestList').addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const { action, uid } = btn.dataset;
        const parent = btn.closest('.nt-item');
        parent.querySelectorAll('button').forEach((b) => (b.disabled = true));

        try {
          if (action === 'accept') {
            await updateDoc(myRef, {
              friends: arrayUnion(uid),
              friendRequests: arrayRemove(uid),
            });
            await updateDoc(doc(db, 'users', uid), {
              friends: arrayUnion(currentUser.uid),
            });
            showToast('Friend added ✦');
          } else {
            await updateDoc(myRef, { friendRequests: arrayRemove(uid) });
          }
          parent.remove();
        } catch (err) {
          console.error(err);
          showToast('Something went wrong. Please try again.');
          parent.querySelectorAll('button').forEach((b) => (b.disabled = false));
        }
      });
    })();
  </script>
</body>
</html>
