<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Pulse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    html, body { height: 100%; }
    .pd-top { justify-content: flex-start; gap: 12px; }
    .pd-top a { font-size: 18px; color: var(--text-secondary); }
    .pd-top span { font-size: 16px; font-weight: 700; }

    .pd-body { padding: 16px; max-width: 560px; margin: 0 auto; padding-bottom: 90px; }

    .pd-post { padding: 16px; margin-bottom: 18px; }
    .pd-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .pd-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; flex: 0 0 auto; overflow: hidden;
    }
    .pd-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pd-name { font-size: 14px; font-weight: 600; }
    .pd-sub { font-size: 12px; color: var(--text-muted); }

    .pd-text { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
    .pd-media { width: 100%; border-radius: var(--radius-md); max-height: 360px; object-fit: cover; margin-bottom: 12px; }

    .pd-actions { display: flex; gap: 20px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
    .pd-actions button { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }
    .pd-actions svg { width: 17px; height: 17px; stroke: currentColor; }
    .pd-actions button.liked { color: var(--magenta); }

    .pd-comments-title {
      font-size: 12.5px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    .comment { display: flex; gap: 10px; margin-bottom: 16px; }
    .comment-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; flex: 0 0 auto; overflow: hidden;
    }
    .comment-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .comment-bubble { flex: 1; }
    .comment-bubble .card { padding: 10px 14px; }
    .comment-name { font-size: 13px; font-weight: 600; }
    .comment-text { font-size: 13.5px; line-height: 1.45; margin-top: 2px; }
    .comment-time { font-size: 11px; color: var(--text-muted); margin: 4px 0 0 4px; }

    .pd-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }

    .comment-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px calc(10px + var(--safe-bottom));
      background: rgba(10,14,34,0.9);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--line-soft);
    }
    .comment-bar input {
      flex: 1; height: 42px; border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.05); border: 1px solid var(--line-soft);
      color: var(--text-primary); padding: 0 16px; font-size: 14px; outline: none;
    }
    .comment-send {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
    }
    .comment-send svg { width: 18px; height: 18px; stroke: #fff; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar pd-top">
    <a href="home.html" aria-label="Back">←</a>
    <span>Pulse</span>
  </header>

  <main class="page">
    <div class="pd-body">
      <p class="pd-empty" id="loadingHint">Loading pulse…</p>

      <article class="pd-post card" id="postCard" style="display:none;">
        <div class="pd-head">
          <div class="pd-avatar" id="postAvatar">?</div>
          <div style="flex:1;">
            <div class="pd-name" id="postName">…</div>
            <div class="pd-sub" id="postTime"></div>
          </div>
          <button id="deleteBtn" style="display:none; color:var(--text-muted); font-size:18px;" title="Delete pulse">🗑</button>
        </div>
        <p class="pd-text" id="postText"></p>
        <img class="pd-media" id="postMedia" style="display:none;" alt="" />
        <div class="pd-actions">
          <button class="like-btn" id="likeBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            <span id="likeCount">0</span>
          </button>
          <button>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span id="commentCount">0</span>
          </button>
          <button id="shareBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>
            Share
          </button>
        </div>
      </article>

      <div class="pd-comments-title">Comments</div>
      <div id="commentsList"></div>
      <p class="pd-empty" id="commentsEmpty" style="display:none;">No comments yet — start the conversation.</p>
    </div>
  </main>

  <div class="comment-bar">
    <input type="text" id="commentInput" placeholder="Add a comment…" maxlength="500" />
    <button type="button" class="comment-send" id="commentSend" aria-label="Send comment">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
    </button>
  </div>

  <script type="module">
    import {
      db,
      doc, getDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove, increment,
      collection, addDoc, query, orderBy, onSnapshot, serverTimestamp,
    } from './js/firebase-init.js';
    import { requireAuth, showToast } from './js/app.js';

    const postId = new URLSearchParams(window.location.search).get('id');

    function initialsOf(name) {
      return (name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    }
    function avatarInner(photoURL, name) {
      return photoURL ? `<img src="${photoURL}" alt="" />` : initialsOf(name);
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
    function timeAgo(ts) {
      if (!ts || !ts.toDate) return 'just now';
      const mins = Math.floor((Date.now() - ts.toDate().getTime()) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    let currentUser = null;

    function renderPost(post) {
      document.getElementById('loadingHint').style.display = 'none';
      const card = document.getElementById('postCard');
      card.style.display = 'block';

      document.getElementById('postAvatar').innerHTML = avatarInner(post.authorPhoto, post.authorName);
      document.getElementById('postName').textContent = post.authorName || 'GAIVEX user';
      document.getElementById('postTime').textContent = timeAgo(post.createdAt);
      document.getElementById('postText').textContent = post.text || '';

      const mediaEl = document.getElementById('postMedia');
      if (post.mediaURL) {
        mediaEl.src = post.mediaURL;
        mediaEl.style.display = 'block';
      }

      const likes = Array.isArray(post.likes) ? post.likes : [];
      const liked = currentUser && likes.includes(currentUser.uid);
      document.getElementById('likeBtn').classList.toggle('liked', liked);
      document.getElementById('likeCount').textContent = likes.length;
      document.getElementById('commentCount').textContent = post.commentsCount || 0;

      const deleteBtn = document.getElementById('deleteBtn');
      deleteBtn.style.display = (currentUser && post.uid === currentUser.uid) ? 'block' : 'none';
    }

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!postId) return;
      if (!window.confirm('Delete this pulse? This cannot be undone.')) return;
      try {
        await deleteDoc(doc(db, 'posts', postId));
        showToast('Pulse deleted');
        window.location.href = 'home.html';
      } catch (err) {
        console.error(err);
        showToast('Could not delete. Please try again.');
      }
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const shareUrl = window.location.href;
      const textEl = document.getElementById('postText');
      const shareData = {
        title: 'GAIVEX Pulse',
        text: textEl.textContent ? textEl.textContent.slice(0, 80) : 'Check out this pulse on GAIVEX',
        url: shareUrl,
      };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(shareUrl);
          showToast('Link copied to clipboard ✦');
        }
      } catch (err) {
        if (err.name !== 'AbortError') console.warn('Share failed:', err);
      }
    });

    document.getElementById('likeBtn').addEventListener('click', async () => {
      if (!currentUser || !postId) return;
      const btn = document.getElementById('likeBtn');
      const nowLiked = btn.classList.contains('liked');
      try {
        await updateDoc(doc(db, 'posts', postId), {
          likes: nowLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
        });
      } catch (err) {
        console.warn('Could not update like:', err);
      }
    });

    function renderComment(c) {
      const div = document.createElement('div');
      div.className = 'comment';
      div.innerHTML = `
        <div class="comment-avatar">${avatarInner(c.photoURL, c.name)}</div>
        <div class="comment-bubble">
          <div class="card">
            <div class="comment-name">${escapeHtml(c.name || 'GAIVEX user')}</div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
          <div class="comment-time">${timeAgo(c.createdAt)}</div>
        </div>
      `;
      return div;
    }

    function subscribeComments() {
      const q = query(collection(db, 'posts', postId, 'comments'), orderBy('createdAt', 'asc'));
      onSnapshot(q, (snap) => {
        const listEl = document.getElementById('commentsList');
        const emptyEl = document.getElementById('commentsEmpty');
        listEl.innerHTML = '';
        if (snap.empty) {
          emptyEl.style.display = 'block';
        } else {
          emptyEl.style.display = 'none';
          snap.forEach((d) => listEl.appendChild(renderComment(d.data())));
        }
      });
    }

    async function sendComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text || !currentUser || !postId) return;
      input.value = '';
      try {
        await addDoc(collection(db, 'posts', postId, 'comments'), {
          uid: currentUser.uid,
          name: currentUser.displayName || currentUser.email.split('@')[0],
          photoURL: currentUser.photoURL || '',
          text,
          createdAt: serverTimestamp(),
        });
        await updateDoc(doc(db, 'posts', postId), { commentsCount: increment(1) });
      } catch (err) {
        console.error(err);
        input.value = text;
        showToast(err.code === 'permission-denied'
          ? 'Comments are blocked by Firestore rules — see the setup note.'
          : 'Could not post comment. Please try again.');
      }
    }

    document.getElementById('commentSend').addEventListener('click', sendComment);
    document.getElementById('commentInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendComment();
    });

    (async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;

      if (!postId) {
        document.getElementById('loadingHint').textContent = 'Pulse not found.';
        return;
      }

      onSnapshot(doc(db, 'posts', postId), (snap) => {
        if (!snap.exists()) {
          document.getElementById('loadingHint').textContent = 'This pulse was removed.';
          document.getElementById('postCard').style.display = 'none';
          return;
        }
        renderPost(snap.data());
      });

      subscribeComments();
    })();
  </script>
</body>
</html>
