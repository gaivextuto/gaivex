<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Events</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .ev-top { justify-content: space-between; }
    .ev-top-left { display: flex; align-items: center; gap: 12px; }
    .ev-top-left a { font-size: 18px; color: var(--text-secondary); }
    .ev-top-left span { font-size: 16px; font-weight: 700; }
    .ev-create-btn {
      height: 34px; padding: 0 16px; border-radius: var(--radius-pill);
      background: var(--grad-brand); color: #fff; font-size: 12.5px; font-weight: 700;
    }

    .ev-body { padding: 16px; max-width: 560px; margin: 0 auto; }

    .ev-tabs {
      display: flex; gap: 8px; margin-bottom: 18px;
      padding: 4px; border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.04); border: 1px solid var(--line-soft);
    }
    .ev-tabs button {
      flex: 1; height: 38px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
    }
    .ev-tabs button.active { background: var(--grad-brand); color: #fff; }

    .ev-card { padding: 0; overflow: hidden; margin-bottom: 14px; }
    .ev-cover {
      height: 86px;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .ev-cover .date-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(5,6,15,0.55);
      backdrop-filter: blur(6px);
      border-radius: var(--radius-sm);
      padding: 4px 9px;
      text-align: center;
      color: #fff;
    }
    .ev-cover .date-badge .d-month { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
    .ev-cover .date-badge .d-day { font-size: 15px; font-weight: 800; display: block; line-height: 1.1; }
    .ev-cover svg { width: 30px; height: 30px; stroke: rgba(255,255,255,0.85); }

    .ev-info { padding: 14px; }
    .ev-title { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
    .ev-meta { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .ev-meta svg { width: 13px; height: 13px; stroke: var(--text-muted); flex: 0 0 auto; }

    .ev-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .ev-attendees { font-size: 11.5px; color: var(--text-muted); }
    .ev-rsvp {
      height: 32px; padding: 0 16px; border-radius: var(--radius-pill);
      font-size: 12px; font-weight: 700;
    }
    .ev-rsvp.going { background: var(--grad-brand); color: #fff; }
    .ev-rsvp.not-going { background: rgba(255,255,255,0.05); border: 1px solid var(--line-strong); color: var(--text-secondary); }

    .ev-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 20px; }

    /* Create-event sheet */
    .ev-sheet-backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(5,6,15,0.7); backdrop-filter: blur(4px);
      display: none; align-items: flex-end;
    }
    .ev-sheet-backdrop.show { display: flex; }
    .ev-sheet {
      width: 100%; max-height: 85vh; overflow-y: auto;
      background: var(--bg-surface); border: 1px solid var(--line-soft);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(24px + var(--safe-bottom));
    }
    .ev-sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
    .ev-sheet .field { margin-bottom: 12px; }
    .ev-sheet label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .ev-sheet input, .ev-sheet textarea {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft); border-radius: var(--radius-md);
      color: var(--text-primary); font-size: 14px; padding: 12px 14px;
      font-family: inherit; outline: none;
    }
    .ev-sheet textarea { min-height: 64px; resize: vertical; }
    .ev-sheet .two-col { display: flex; gap: 10px; }
    .ev-sheet .two-col .field { flex: 1; }
    .ev-sheet .row { display: flex; gap: 10px; margin-top: 16px; }
    .ev-sheet .row .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar ev-top">
    <div class="ev-top-left">
      <a href="home.html" aria-label="Back">←</a>
      <span>Events</span>
    </div>
    <button type="button" class="ev-create-btn" id="openCreate">+ Create</button>
  </header>

  <main class="page">
    <div class="ev-body">
      <div class="ev-tabs">
        <button type="button" class="active" data-tab="upcoming">Upcoming</button>
        <button type="button" data-tab="mine">My Events</button>
      </div>

      <p class="ev-empty" id="loadingHint">Loading events…</p>
      <div id="eventList"></div>
      <p class="ev-empty" id="emptyHint" style="display:none;"></p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="pulse.html" data-page="pulse">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>
      Pulse
    </a>
    <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="spaces.html" data-page="spaces">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Spaces
    </a>
    <a href="profile.html" data-page="profile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <div class="ev-sheet-backdrop" id="sheetBackdrop">
    <div class="ev-sheet">
      <h3>Create an Event</h3>
      <div class="field">
        <label for="evTitle">Title</label>
        <input type="text" id="evTitle" placeholder="e.g. Travel Summit 2026" maxlength="60" />
      </div>
      <div class="two-col">
        <div class="field">
          <label for="evDate">Date</label>
          <input type="date" id="evDate" />
        </div>
        <div class="field">
          <label for="evTime">Time</label>
          <input type="time" id="evTime" />
        </div>
      </div>
      <div class="field">
        <label for="evLocation">Location</label>
        <input type="text" id="evLocation" placeholder="e.g. Dhaka, or an online link" maxlength="80" />
      </div>
      <div class="field">
        <label for="evDesc">Description</label>
        <textarea id="evDesc" placeholder="What's this event about?" maxlength="400"></textarea>
      </div>
      <div class="row">
        <button type="button" class="btn btn-outline" id="cancelCreate">Cancel</button>
        <button type="button" class="btn btn-primary" id="submitCreate">Create</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      db,
      doc, updateDoc, arrayUnion, arrayRemove,
      collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc,
    } from './js/firebase-init.js';
    import { requireAuth, showToast, postMenuHTML, wirePostMenu } from './js/app.js';

    let currentUser = null;
    let allEvents = [];
    let activeTab = 'upcoming';

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function formatDateBadge(startAt) {
      if (!startAt?.toDate) return { month: '—', day: '—' };
      const d = startAt.toDate();
      return {
        month: d.toLocaleString('en-US', { month: 'short' }),
        day: d.getDate(),
      };
    }

    function formatFullDate(startAt) {
      if (!startAt?.toDate) return 'Date TBA';
      const d = startAt.toDate();
      return d.toLocaleString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit',
      });
    }

    function renderCard(id, ev) {
      const attendees = Array.isArray(ev.attendees) ? ev.attendees : [];
      const going = currentUser && attendees.includes(currentUser.uid);
      const badge = formatDateBadge(ev.startAt);
      const isOwn = currentUser && ev.createdBy === currentUser.uid;

      const card = document.createElement('div');
      card.className = 'card ev-card';
      card.innerHTML = `
        <div class="ev-cover">
          <div class="date-badge"><span class="d-month">${badge.month}</span><span class="d-day">${badge.day}</span></div>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <div style="position:absolute; top:8px; right:8px;" class="menu-host"></div>
        </div>
        <div class="ev-info">
          <div class="ev-title">${escapeHtml(ev.title || 'Untitled Event')}</div>
          <div class="ev-meta">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            ${formatFullDate(ev.startAt)}
          </div>
          ${ev.location ? `
          <div class="ev-meta">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            ${escapeHtml(ev.location)}
          </div>` : ''}
          ${ev.description ? `<p style="font-size:12.5px; color:var(--text-secondary); margin-top:8px; line-height:1.5;">${escapeHtml(ev.description)}</p>` : ''}
          <div class="ev-foot">
            <span class="ev-attendees">${attendees.length} going</span>
            <button class="ev-rsvp ${going ? 'going' : 'not-going'}" data-id="${id}" data-going="${going}">
              ${going ? 'Going ✓' : 'RSVP'}
            </button>
          </div>
        </div>
      `;

      const menuHost = card.querySelector('.menu-host');
      menuHost.innerHTML = postMenuHTML(isOwn);
      menuHost.addEventListener('click', (e) => e.stopPropagation());
      wirePostMenu(menuHost, {
        copyUrl: `${window.location.origin}${window.location.pathname.replace('events.html', '')}events.html`,
        onDelete: async () => {
          if (!window.confirm('Delete this event? This cannot be undone.')) return;
          try {
            await deleteDoc(doc(db, 'events', id));
            showToast('Event deleted');
          } catch (err) {
            console.error(err);
            showToast('Could not delete. Please try again.');
          }
        },
        onReport: () => { window.location.href = 'safety.html'; },
      });

      return card;
    }

    function render() {
      const listEl = document.getElementById('eventList');
      const emptyEl = document.getElementById('emptyHint');
      listEl.innerHTML = '';

      const now = Date.now();
      let visible = allEvents.filter((e) => {
        const t = e.startAt?.toDate ? e.startAt.toDate().getTime() : 0;
        return t >= now - 3 * 60 * 60 * 1000; // keep events up to 3h after start
      });

      if (activeTab === 'mine') {
        visible = visible.filter((e) =>
          e.createdBy === currentUser.uid ||
          (Array.isArray(e.attendees) && e.attendees.includes(currentUser.uid))
        );
      }

      if (visible.length === 0) {
        emptyEl.style.display = 'block';
        emptyEl.textContent = activeTab === 'mine'
          ? "You haven't RSVP'd to or created any events yet."
          : 'No upcoming events — be the first to create one!';
        return;
      }
      emptyEl.style.display = 'none';
      visible.forEach((e) => listEl.appendChild(renderCard(e.id, e)));
    }

    document.querySelectorAll('.ev-tabs button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ev-tabs button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById('eventList').addEventListener('click', async (e) => {
      const btn = e.target.closest('.ev-rsvp');
      if (!btn) return;
      const id = btn.dataset.id;
      const going = btn.dataset.going === 'true';
      btn.disabled = true;
      try {
        await updateDoc(doc(db, 'events', id), {
          attendees: going ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
        });
      } catch (err) {
        console.error(err);
        showToast('Could not update RSVP.');
      } finally {
        btn.disabled = false;
      }
    });

    // Create-event sheet
    const backdrop = document.getElementById('sheetBackdrop');
    document.getElementById('openCreate').addEventListener('click', () => backdrop.classList.add('show'));
    document.getElementById('cancelCreate').addEventListener('click', () => backdrop.classList.remove('show'));
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.classList.remove('show'); });

    document.getElementById('submitCreate').addEventListener('click', async () => {
      const title = document.getElementById('evTitle').value.trim();
      const dateVal = document.getElementById('evDate').value;
      const timeVal = document.getElementById('evTime').value || '19:00';
      const location = document.getElementById('evLocation').value.trim();
      const description = document.getElementById('evDesc').value.trim();

      if (title.length < 2) { showToast('Please give your event a title.'); return; }
      if (!dateVal) { showToast('Please pick a date.'); return; }

      const startAt = new Date(`${dateVal}T${timeVal}`);
      if (Number.isNaN(startAt.getTime())) { showToast('Please check the date and time.'); return; }

      const submitBtn = document.getElementById('submitCreate');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating…';

      try {
        await addDoc(collection(db, 'events'), {
          title, description, location,
          startAt,
          attendees: [currentUser.uid],
          createdBy: currentUser.uid,
          createdAt: serverTimestamp(),
        });
        ['evTitle', 'evDate', 'evTime', 'evLocation', 'evDesc'].forEach((id) => {
          document.getElementById(id).value = '';
        });
        backdrop.classList.remove('show');
        showToast('Event created ✦');
      } catch (err) {
        console.error(err);
        showToast('Could not create event. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create';
      }
    });

    (async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;

      const q = query(collection(db, 'events'), orderBy('startAt', 'asc'));
      onSnapshot(q, (snap) => {
        document.getElementById('loadingHint').style.display = 'none';
        allEvents = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        render();
      }, (err) => {
        console.error(err);
        document.getElementById('loadingHint').textContent = 'Could not load events right now.';
      });
    })();
  </script>
</body>
</html>
