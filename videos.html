<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Videos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/video.css" />
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar">
    <a href="home.html" aria-label="Back" style="font-size:18px;color:var(--text-secondary)">←</a>
    <span class="brand-logo" style="font-size:20px">Videos</span>
    <a href="upload-video.html" class="btn btn-primary btn-sm">+ Upload</a>
  </header>

  <main class="page">
    <div class="vd-wrap">
      <div class="vd-bar"><label class="search-box"><input id="q" type="search" placeholder="Search videos…" /></label></div>
      <div class="vd-tabs">
        <button class="vd-tab on" data-s="createdAt">Latest</button>
        <button class="vd-tab" data-s="views">Popular</button>
        <button class="vd-tab" data-s="orbit">🪐 Orbit</button>
        <button class="vd-tab" data-s="pl">Playlists</button>
      </div>
      <div id="plbox" style="display:none">
        <div class="pl-new"><input class="input" id="npn" maxlength="60" placeholder="New playlist name" /><button class="btn btn-primary btn-sm" id="npb" style="height:44px">Create</button></div>
        <div id="pll"></div>
      </div>
      <div class="vd-grid" id="grid"></div>
      <p class="vd-empty" id="empty" style="display:none">No videos yet. Be the first to upload one.</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home">Home</a>
    <a href="explore.html" data-page="explore">Explore</a>
    <a href="create-pulse.html" class="nav-fab" aria-label="Create">+</a>
    <a href="spaces.html" data-page="spaces">Spaces</a>
    <a href="profile.html" data-page="profile">Profile</a>
  </nav>

  <script type="module">
    import { db, collection, query, orderBy, limit, where, onSnapshot, addDoc, serverTimestamp } from './js/firebase-init.js';
    import { requireAuth, showToast } from './js/app.js';
    import { cardHtml, esc } from './js/video-utils.js';

    const $ = (i) => document.getElementById(i);
    let items = [], unsub = null, sort = 'createdAt', tab = 'createdAt', orbits = new Set(), pls = [], me = null;

    function draw() {
      const isPl = tab === 'pl';
      $('plbox').style.display = isPl ? 'block' : 'none';
      $('grid').style.display = isPl ? 'none' : '';
      $('empty').style.display = 'none';
      if (isPl) {
        $('pll').innerHTML = pls.length ? pls.map((d) => { const p = d.data(), n = (p.videoIds || []).length;
          return `<a class="pl-card" href="playlist.html?id=${d.id}"><span class="ic">🎞️</span><div><b>${esc(p.name)}</b><span class="s">${n} video${n === 1 ? '' : 's'}</span></div></a>`; }).join('')
          : '<p class="vd-empty" style="padding:30px 0">No playlists yet. Create your first one above.</p>';
        return;
      }
      const t = $('q').value.trim().toLowerCase();
      let list = items.filter(([, v]) => !t || (v.title || '').toLowerCase().includes(t) || (v.authorName || '').toLowerCase().includes(t));
      if (tab === 'orbit') list = list.filter(([, v]) => orbits.has(v.uid));
      $('grid').innerHTML = list.map(([id, v]) => cardHtml(id, v)).join('');
      $('empty').textContent = tab === 'orbit' ? 'Join a creator\'s Orbit to see their videos here.' : 'No videos yet. Be the first to upload one.';
      $('empty').style.display = list.length ? 'none' : 'block';
    }
    function load() {
      unsub?.();
      unsub = onSnapshot(query(collection(db, 'videos'), orderBy(sort, 'desc'), limit(40)), (s) => {
        items = s.docs.map((d) => [d.id, d.data()]); draw();
      }, (e) => { console.error(e); $('empty').textContent = 'Could not load videos.'; $('empty').style.display = 'block'; });
    }
    document.querySelectorAll('.vd-tab').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('.vd-tab').forEach((x) => x.classList.toggle('on', x === b));
      tab = b.dataset.s;
      const ns = tab === 'views' ? 'views' : 'createdAt';
      if (ns !== sort) { sort = ns; load(); } else draw();
    }));
    $('q').addEventListener('input', draw);
    $('npb').addEventListener('click', async () => {
      const name = $('npn').value.trim(); if (!name) return;
      try {
        await addDoc(collection(db, 'playlists'), { uid: me.uid, ownerName: me.displayName || me.email.split('@')[0], name, videoIds: [], createdAt: serverTimestamp() });
        $('npn').value = '';
      } catch (e) { console.error(e); showToast('Could not create playlist.'); }
    });
    (async () => {
      me = await requireAuth(); if (!me) return;
      load();
      onSnapshot(query(collection(db, 'orbits'), where('member', '==', me.uid)), (s) => { orbits = new Set(s.docs.map((d) => d.data().creator)); draw(); });
      onSnapshot(query(collection(db, 'playlists'), where('uid', '==', me.uid)), (s) => { pls = s.docs; draw(); });
    })();
  </script>
</body>
</html>
