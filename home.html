<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Home</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* কপি করা ব্লক করার জন্য CSS */
    .no-select {
      -webkit-user-select: none; /* Safari */
      -moz-user-select: none;    /* Firefox */
      -ms-user-select: none;     /* IE / Edge */
      user-select: none;        /* Standard */
    }
    
    .pulse-media {
      pointer-events: none; /* ছবিতে রাইট ক্লিক বা ড্র্যাগ করে সেভ করা বন্ধ করতে */
    }

    .top-bar .brand-logo { font-size: 19px; }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .icon-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      position: relative;
    }
    .icon-btn svg { width: 18px; height: 18px; stroke: var(--text-primary); }
    .icon-btn .dot {
      position: absolute; top: 6px; right: 6px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--magenta);
      box-shadow: 0 0 6px var(--magenta);
      display: none;
    }

    .home-content { padding: 16px; max-width: 560px; margin: 0 auto; }

    /* Stories / Spaces row */
    .stories {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .stories::-webkit-scrollbar { display: none; }
    .story {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 66px;
    }
    .story-ring {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--grad-brand);
      padding: 2.5px;
      display: flex; align-items: center; justify-content: center;
    }
    .story-ring.seen { background: var(--line-strong); }
    .story-ring .story-avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      color: var(--text-primary);
      overflow: hidden;
      border: 2px solid var(--bg-void);
    }
    .story-name {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .story.add .story-ring {
      background: rgba(255,255,255,0.06);
      border: 1px dashed var(--line-strong);
    }

    /* Composer teaser */
    .composer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .composer .story-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--grad-warm);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex: 0 0 auto;
      overflow: hidden;
    }
    .composer .composer-text {
      flex: 1;
      color: var(--text-muted);
      font-size: 13.5px;
    }

    /* Feed */
    .feed { display: flex; flex-direction: column; gap: 16px; }

    .pulse { padding: 16px; }
    .pulse-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .pulse-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; flex: 0 0 auto;
      overflow: hidden;
    }
    .pulse-avatar img, .story-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pulse-meta { flex: 1; min-width: 0; }
    .pulse-name { font-size: 14px; font-weight: 600; }
    .pulse-sub { font-size: 12px; color: var(--text-muted); }
    .pulse-more { color: var(--text-muted); font-size: 18px; padding: 4px; }

    .pulse-body { font-size: 14px; line-height: 1.55; color: var(--text-primary); margin-bottom: 12px; }

    .pulse-media {
      width: 100%;
      border-radius: var(--radius-md);
      aspect-ratio: 16/10;
      background: var(--grad-brand);
      opacity: 0.85;
      margin-bottom: 12px;
    }

    .pulse-actions {
      display: flex;
      gap: 20px;
      padding-top: 10px;
      border-top: 1px solid var(--line-soft);
    }
    .pulse-actions button {
      display: flex; align-items: center; gap: 6px;
      font-size: 12.5px; color: var(--text-secondary); font-weight: 500;
    }
    .pulse-actions svg { width: 17px; height: 17px; stroke: currentColor; }
    .pulse-actions button.liked { color: var(--magenta); }

    .empty-hint {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body class="no-select">
  <div class="bg-cosmic"></div>

  <header class="top-bar">
    <span class="brand-logo">GAIVEX</span>
    <div class="top-actions">
      <a href="search.html" class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </a>
      <a href="notifications.html" class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot" id="notifDot"></span>
      </a>
      <a href="messages.html" class="icon-btn" aria-label="Messages">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </a>
    </div>
  </header>

  <main class="page">
    <div class="home-content">

      <div class="stories" id="stories">
        <a href="profile.html" class="story add">
          <div class="story-ring"><div class="story-avatar" id="myAvatar">＋</div></div>
          <span class="story-name">Your Space</span>
        </a>
      </div>

      <a href="create-pulse.html" class="composer card">
        <span class="story-avatar" id="composerAvatar">?</span>
        <span class="composer-text">Share a pulse with your universe…</span>
      </a>

      <div class="feed" id="feed">
        <!-- Feed Content -->
      </div>

      <p class="empty-hint" id="emptyHint" style="display:none;">
        No pulses yet ✦ be the first to share something in your universe
      </p>
      <p class="empty-hint" id="loadingHint">Loading your feed…</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home" class="active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="pulse.html" data-page="pulse">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>
      Pulse
    </a>
    <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="spaces.html" data-page="spaces">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Spaces
    </a>
    <a href="profile.html" data-page="profile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script type="module">
    import {
      doc, getDoc, db,
      collection, query, orderBy, limit, onSnapshot,
      updateDoc, arrayUnion, arrayRemove, deleteDoc,
    } from './js/firebase-init.js';
    import { requireAuth, setActiveNav, showToast } from './js/app.js';

    setActiveNav('home');

    // কপি এবং রাইট-ক্লিক পুরোপুরি ডিজেবল করার ইভেন্ট
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('copy', (e) => e.preventDefault());

    const feedEl = document.getElementById('feed');
    const emptyHint = document.getElementById('emptyHint');
    const loadingHint = document.getElementById('loadingHint');
    const storiesEl = document.getElementById('stories');

    let currentUser = null;
    const seenAuthors = new Set();

    function initialsOf(name) {
      return (name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function avatarInner(photoURL, name) {
      return photoURL
        ? `<img src="${photoURL}" alt="" />`
        : initialsOf(name);
    }

    function timeAgo(ts) {
      if (!ts || !ts.toDate) return 'just now';
      const diffMs = Date.now() - ts.toDate().getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    function renderPost(id, post) {
      const liked = currentUser && Array.isArray(post.likes) && post.likes.includes(currentUser.uid);
      const likeCount = Array.isArray(post.likes) ? post.likes.length : 0;

      const article = document.createElement('article');
      article.className = 'pulse card';
      article.dataset.id = id;
      article.innerHTML = `
        <div class="pulse-head">
          <div class="pulse-avatar">${avatarInner(post.authorPhoto, post.authorName)}</div>
          <div class="pulse-meta">
            <div class="pulse-name">${escapeHtml(post.authorName || 'GAIVEX user')}</div>
            <div class="pulse-sub">${timeAgo(post.createdAt)}</div>
          </div>
          ${currentUser && post.uid === currentUser.uid ? '<button class="pulse-more" title="Delete pulse">🗑</button>' : ''}
        </div>
        ${post.text ? `<p class="pulse-body">${escapeHtml(post.text)}</p>` : ''}
        ${post.mediaURL ? `<img class="pulse-media" style="object-fit:cover;" src="${post.mediaURL}" alt="" draggable="false" />` : ''}
        <div class="pulse-actions">
          <button class="like-btn ${liked ? 'liked' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            <span class="like-count">${likeCount}</span>
          </button>
          <button class="comment-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>${post.commentsCount || 0}</span>
          </button>
          <button class="share-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>
            Share
          </button>
        </div>
      `;

      // শুধুমাত্র কমেন্ট বাটনে ক্লিক করলেই কমেন্ট পেজে যাবে
      article.querySelector('.comment-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        window.location.href = `post-detail.html?id=${id}`;
      });

      // লাইক অ্যাকশন
      article.querySelector('.like-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!currentUser) return;
        const nowLiked = article.querySelector('.like-btn').classList.contains('liked');
        try {
          await updateDoc(doc(db, 'posts', id), {
            likes: nowLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
          });
        } catch (err) {
          console.warn('Could not update like:', err);
        }
      });

      // ডিলিট অপশন
      const moreBtn = article.querySelector('.pulse-more');
      if (moreBtn) {
        moreBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!window.confirm('Delete this pulse? This cannot be undone.')) return;
          try {
            await deleteDoc(doc(db, 'posts', id));
            showToast('Pulse deleted');
          } catch (err) {
            console.error(err);
            showToast('Could not delete. Please try again.');
          }
        });
      }

      // শেয়ার বাটন
      article.querySelector('.share-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const shareUrl = `${window.location.origin}${window.location.pathname.replace('home.html', '')}post-detail.html?id=${id}`;
        const shareData = {
          title: 'GAIVEX Pulse',
          text: post.text ? post.text.slice(0, 80) : 'Check out this pulse on GAIVEX',
          url: shareUrl,
        };
        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else {
            await navigator.clipboard.writeText(shareUrl);
            showToast('Link copied to clipboard ✦');
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.warn('Share failed:', err);
          }
        }
      });

      return article;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function addStoryFor(post) {
      if (!post.uid || seenAuthors.has(post.uid) || seenAuthors.size >= 8) return;
      seenAuthors.add(post.uid);
      const a = document.createElement('a');
      a.href = `profile.html?uid=${post.uid}`;
      a.className = 'story';
      a.innerHTML = `
        <div class="story-ring"><div class="story-avatar">${avatarInner(post.authorPhoto, post.authorName)}</div></div>
        <span class="story-name">${escapeHtml(post.authorName || 'User')}</span>
      `;
      storiesEl.appendChild(a);
    }

    let blockedUids = [];

    function subscribeToFeed() {
      const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(30));
      onSnapshot(q, (snap) => {
        loadingHint.style.display = 'none';
        feedEl.innerHTML = '';
        seenAuthors.clear();
        Array.from(storiesEl.querySelectorAll('.story:not(.add)')).forEach((el) => el.remove());

        const visibleDocs = snap.docs.filter((d) => !blockedUids.includes(d.data().uid));

        if (visibleDocs.length === 0) {
          emptyHint.style.display = 'block';
          return;
        }
        emptyHint.style.display = 'none';

        visibleDocs.forEach((docSnap) => {
          const post = docSnap.data();
          feedEl.appendChild(renderPost(docSnap.id, post));
          addStoryFor(post);
        });
      }, (err) => {
        console.error('Feed error:', err);
        loadingHint.textContent = 'Could not load the feed right now.';
      });
    }

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      currentUser = user;

      document.getElementById('composerAvatar').innerHTML = avatarInner(user.photoURL, user.displayName || user.email);

      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (snap.exists()) {
          const profile = snap.data();
          if (Array.isArray(profile.friendRequests) && profile.friendRequests.length > 0) {
            document.getElementById('notifDot').style.display = 'block';
          }
          if (Array.isArray(profile.blocked)) {
            blockedUids = profile.blocked;
          }
        }
      } catch (err) {
        console.warn('Could not load profile:', err);
      }

      subscribeToFeed();
    })();
  </script>
</body>
</html>
