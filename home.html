<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Home</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧿</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* কপি করা ব্লক করার জন্য CSS */
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .top-bar .brand-logo { font-size: 19px; }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .icon-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      position: relative;
    }
    .icon-btn svg { width: 18px; height: 18px; stroke: var(--text-primary); }
    .icon-btn .dot {
      position: absolute; top: 6px; right: 6px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--magenta);
      box-shadow: 0 0 6px var(--magenta);
      display: none;
    }

    .home-content { padding: 16px; max-width: 560px; margin: 0 auto; }

    /* Stories / Spaces row */
    .stories {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .stories::-webkit-scrollbar { display: none; }
    .story {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 66px;
    }
    .story-ring {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--grad-brand);
      padding: 2.5px;
      display: flex; align-items: center; justify-content: center;
    }
    .story-ring.seen { background: var(--line-strong); }
    .story-ring .story-avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      color: var(--text-primary);
      overflow: hidden;
      border: 2px solid var(--bg-void);
    }
    .story-name {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .story.add .story-ring {
      background: rgba(255,255,255,0.06);
      border: 1px dashed var(--line-strong);
    }

    /* Composer teaser */
    .composer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .composer .story-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--grad-warm);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex: 0 0 auto;
      overflow: hidden;
    }
    .composer .composer-text {
      flex: 1;
      color: var(--text-muted);
      font-size: 13.5px;
    }

    /* Feed */
    .feed { display: flex; flex-direction: column; gap: 16px; }

    .pulse { padding: 16px; }
    .pulse-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .pulse-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; flex: 0 0 auto;
      overflow: hidden;
      color: inherit; text-decoration: none;
    }
    .pulse-avatar img, .story-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pulse-meta { flex: 1; min-width: 0; }
    .pulse-name {
      display: inline-block;
      font-size: 14px; font-weight: 600;
      color: inherit; text-decoration: none;
      cursor: pointer;
    }
    .pulse-name:hover { text-decoration: underline; }
    .pulse-sub { font-size: 12px; color: var(--text-muted); }
    .pulse-more {
      color: var(--text-secondary);
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }
    .pulse-more:active { background: rgba(255,255,255,0.08); }
    .pulse-more svg { width: 20px; height: 20px; fill: currentColor; }

    .pulse-body { font-size: 14px; line-height: 1.55; color: var(--text-primary); margin-bottom: 12px; }

    /* Image */
    .pulse-media {
      display: block;
      width: 100%;
      border-radius: var(--radius-md);
      aspect-ratio: 16/10;
      object-fit: cover;
      background: var(--grad-brand);
      margin-bottom: 12px;
      cursor: pointer;
      -webkit-touch-callout: none;
    }

    /* Video */
    .pulse-video-wrap {
      position: relative;
      width: 100%;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .pulse-video-wrap video {
      display: block;
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      background: #000;
      -webkit-touch-callout: none;
    }
    .mute-btn {
      position: absolute; right: 10px; bottom: 10px;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .mute-btn svg { width: 16px; height: 16px; stroke: #fff; fill: none; }
    .video-badge {
      position: absolute; left: 10px; top: 10px;
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
      background: rgba(0,0,0,0.55); color: #fff;
    }

    .pulse-actions {
      display: flex;
      gap: 20px;
      padding-top: 10px;
      border-top: 1px solid var(--line-soft);
    }
    .pulse-actions button {
      display: flex; align-items: center; gap: 6px;
      font-size: 12.5px; color: var(--text-secondary); font-weight: 500;
    }
    .pulse-actions svg { width: 17px; height: 17px; stroke: currentColor; }
    .pulse-actions button.liked { color: var(--magenta); }

    .empty-hint {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Bottom sheet (3-dots menu) */
    .sheet-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      display: none;
    }
    .sheet-backdrop.open { display: block; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      max-width: 560px; margin: 0 auto;
      background: var(--bg-surface, #14121f);
      border: 1px solid var(--line-soft);
      border-radius: 18px 18px 0 0;
      padding: 10px 10px calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 1001;
      transform: translateY(100%);
      transition: transform .22s ease;
    }
    .sheet-backdrop.open .sheet { transform: translateY(0); }
    .sheet-grip {
      width: 40px; height: 4px; border-radius: 4px;
      background: var(--line-strong); margin: 0 auto 8px;
    }
    .sheet-item {
      width: 100%;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 12px;
      border-radius: 12px;
      font-size: 14.5px; font-weight: 500;
      color: var(--text-primary);
      text-align: left;
    }
    .sheet-item:active { background: rgba(255,255,255,0.06); }
    .sheet-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; flex: 0 0 auto; }
    .sheet-item.danger { color: #ff5d6c; }

    /* Image lightbox */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 2000;
      display: none;
      align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      -webkit-touch-callout: none;
    }
    .lightbox-close {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: #fff; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body class="no-select">
  <div class="bg-cosmic"></div>

  <header class="top-bar">
    <span class="brand-logo">GAIVEX</span>
    <div class="top-actions">
      <a href="search.html" class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </a>
      <a href="notifications.html" class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot" id="notifDot"></span>
      </a>
      <a href="messages.html" class="icon-btn" aria-label="Messages">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </a>
    </div>
  </header>

  <main class="page">
    <div class="home-content">

      <div class="stories" id="stories">
        <a href="profile.html" class="story add">
          <div class="story-ring"><div class="story-avatar" id="myAvatar">＋</div></div>
          <span class="story-name">Your Space</span>
        </a>
      </div>

      <a href="create-pulse.html" class="composer card">
        <span class="story-avatar" id="composerAvatar">?</span>
        <span class="composer-text">Share a pulse with your universe…</span>
      </a>

      <div class="feed" id="feed">
        <!-- Feed Content -->
      </div>

      <p class="empty-hint" id="emptyHint" style="display:none;">
        No pulses yet ✦ be the first to share something in your universe
      </p>
      <p class="empty-hint" id="loadingHint">Loading your feed…</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home" class="active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="pulse.html" data-page="pulse">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>
      Pulse
    </a>
    <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="spaces.html" data-page="spaces">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Spaces
    </a>
    <a href="profile.html" data-page="profile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <!-- 3-dots bottom sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet" id="sheet" role="menu"></div>
  </div>

  <!-- Full image viewer -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <img id="lightboxImg" alt="" draggable="false" />
  </div>

  <script type="module">
    import {
      doc, getDoc, db,
      collection, query, orderBy, limit, onSnapshot,
      updateDoc, arrayUnion, arrayRemove, deleteDoc,
    } from './js/firebase-init.js';
    import { requireAuth, setActiveNav, showToast } from './js/app.js';

    setActiveNav('home');

    // কপি এবং রাইট-ক্লিক পুরোপুরি ডিজেবল
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('copy', (e) => e.preventDefault());

    const feedEl = document.getElementById('feed');
    const emptyHint = document.getElementById('emptyHint');
    const loadingHint = document.getElementById('loadingHint');
    const storiesEl = document.getElementById('stories');

    let currentUser = null;
    const seenAuthors = new Set();

    /* ---------- Helpers ---------- */
    function initialsOf(name) {
      return (name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function avatarInner(photoURL, name) {
      return photoURL ? `<img src="${photoURL}" alt="" draggable="false" />` : initialsOf(name);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Facebook-এর মতো: just now / 5m / 3h / 2d / তারপর তারিখ
    function timeAgo(ts) {
      if (!ts || !ts.toDate) return 'just now';
      const d = ts.toDate();
      const diffMs = Date.now() - d.getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h`;
      const days = Math.floor(hrs / 24);
      if (days < 7) return `${days}d`;
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return d.toLocaleDateString('en-GB', sameYear
        ? { day: 'numeric', month: 'long' }
        : { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function fullDate(ts) {
      if (!ts || !ts.toDate) return '';
      return ts.toDate().toLocaleString('en-GB', {
        day: 'numeric', month: 'long', year: 'numeric',
        hour: 'numeric', minute: '2-digit', hour12: true,
      });
    }

    function isVideoPost(post) {
      if (post.mediaType) return String(post.mediaType).toLowerCase().startsWith('video');
      if (post.type === 'video') return true;
      const u = (post.mediaURL || '').split('?')[0].toLowerCase();
      return /\.(mp4|webm|mov|m4v|ogv|3gp)$/.test(u) || u.includes('/video/upload/');
    }

    function profileLink(uid) {
      return uid ? `profile.html?uid=${encodeURIComponent(uid)}` : 'profile.html';
    }

    function postLink(id, post) {
      const page = post && post._col === 'reels' ? 'pulse.html' : 'post-detail.html';
      return `${window.location.origin}${window.location.pathname.replace('home.html', '')}${page}?id=${id}`;
    }

    // লুকানো পোস্ট (Hide post)
    function getHidden() {
      try { return JSON.parse(localStorage.getItem('gaivex_hidden') || '[]'); } catch { return []; }
    }
    function addHidden(id) {
      try {
        const list = getHidden();
        if (!list.includes(id)) list.push(id);
        localStorage.setItem('gaivex_hidden', JSON.stringify(list));
      } catch {}
    }

    /* ---------- Video autoplay (Facebook/Instagram style) ---------- */
    let videoObserver = null;
    function resetVideoObserver() {
      if (videoObserver) videoObserver.disconnect();
      videoObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          const v = entry.target;
          if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
            v.play().catch(() => {});
          } else {
            v.pause();
          }
        });
      }, { threshold: [0, 0.6, 1] });
    }

    /* ---------- Image lightbox ---------- */
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
      document.body.style.overflow = '';
    }
    lightbox.addEventListener('click', closeLightbox);
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeLightbox(); closeSheet(); }
    });

    /* ---------- 3-dots bottom sheet ---------- */
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const sheetEl = document.getElementById('sheet');

    const ICONS = {
      link: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
      hide: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/></svg>',
      user: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
      trash: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
      profile: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    };

    function openSheet(items) {
      sheetEl.innerHTML = '<div class="sheet-grip"></div>';
      items.forEach((it) => {
        const btn = document.createElement('button');
        btn.className = 'sheet-item' + (it.danger ? ' danger' : '');
        btn.innerHTML = `${it.icon}<span>${it.label}</span>`;
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          closeSheet();
          await it.action();
        });
        sheetEl.appendChild(btn);
      });
      sheetBackdrop.classList.add('open');
    }
    function closeSheet() { sheetBackdrop.classList.remove('open'); }
    sheetBackdrop.addEventListener('click', (e) => {
      if (e.target === sheetBackdrop) closeSheet();
    });

    function openPostMenu(id, post, article) {
      const own = currentUser && post.uid === currentUser.uid;
      const items = [];

      items.push({
        icon: ICONS.link, label: 'Copy link',
        action: async () => {
          try {
            await navigator.clipboard.writeText(postLink(id, post));
            showToast('Link copied ✦');
          } catch { showToast('Could not copy link'); }
        },
      });

      if (!own) {
        items.push({
          icon: ICONS.profile, label: `View ${escapeHtml(post.authorName || 'user')}'s profile`,
          action: () => { window.location.href = profileLink(post.uid); },
        });
        items.push({
          icon: ICONS.hide, label: 'Hide post',
          action: () => {
            addHidden(id);
            article.remove();
            showToast('Post hidden');
          },
        });
        items.push({
          icon: ICONS.user, label: `Block ${escapeHtml(post.authorName || 'user')}`, danger: true,
          action: async () => {
            if (!window.confirm('Block this user? Their posts will no longer appear in your feed.')) return;
            try {
              await updateDoc(doc(db, 'users', currentUser.uid), { blocked: arrayUnion(post.uid) });
              blockedUids.push(post.uid);
              showToast('User blocked');
            } catch (err) {
              console.error(err);
              showToast('Could not block. Please try again.');
            }
          },
        });
      } else {
        items.push({
          icon: ICONS.trash, label: 'Delete post', danger: true,
          action: async () => {
            if (!window.confirm('Delete this pulse? This cannot be undone.')) return;
            try {
              await deleteDoc(doc(db, post._col || 'posts', id));
              showToast('Pulse deleted');
            } catch (err) {
              console.error(err);
              showToast('Could not delete. Please try again.');
            }
          },
        });
      }

      openSheet(items);
    }

    /* ---------- Render post ---------- */
    function renderPost(id, post) {
      const liked = currentUser && Array.isArray(post.likes) && post.likes.includes(currentUser.uid);
      const likeCount = Array.isArray(post.likes) ? post.likes.length : 0;
      const video = post.mediaURL && isVideoPost(post);
      const pLink = profileLink(post.uid);

      let mediaHtml = '';
      if (post.mediaURL && video) {
        mediaHtml = `
          <div class="pulse-video-wrap">
            <video src="${post.mediaURL}" muted loop playsinline webkit-playsinline preload="metadata" controlsList="nodownload noplaybackrate" disablePictureInPicture></video>
            <span class="video-badge">▶ Pulse</span>
            <button class="mute-btn" type="button" aria-label="Toggle sound">
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>
            </button>
          </div>`;
      } else if (post.mediaURL) {
        mediaHtml = `<img class="pulse-media" src="${post.mediaURL}" alt="" draggable="false" />`;
      }

      const article = document.createElement('article');
      article.className = 'pulse card';
      article.dataset.id = id;
      article.innerHTML = `
        <div class="pulse-head">
          <a class="pulse-avatar" href="${pLink}">${avatarInner(post.authorPhoto, post.authorName)}</a>
          <div class="pulse-meta">
            <a class="pulse-name" href="${pLink}">${escapeHtml(post.authorName || 'GAIVEX user')}</a>
            <div class="pulse-sub" title="${escapeHtml(fullDate(post.createdAt))}">${timeAgo(post.createdAt)}</div>
          </div>
          <button class="pulse-more" type="button" aria-label="More options">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
        ${post.text ? `<p class="pulse-body">${escapeHtml(post.text)}</p>` : ''}
        ${mediaHtml}
        <div class="pulse-actions">
          <button class="like-btn ${liked ? 'liked' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            <span class="like-count">${likeCount}</span>
          </button>
          <button class="comment-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>${post.commentsCount || 0}</span>
          </button>
          <button class="share-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>
            Share
          </button>
        </div>
      `;

      // ছবিতে ক্লিক → ফুল ছবি
      const imgEl = article.querySelector('img.pulse-media');
      if (imgEl) {
        imgEl.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(post.mediaURL);
        });
      }

      // ভিডিও: অটোপ্লে + ক্লিক করলে Pulse পেজে যাবে
      const wrap = article.querySelector('.pulse-video-wrap');
      if (wrap) {
        const v = wrap.querySelector('video');
        videoObserver.observe(v);

        wrap.addEventListener('click', () => {
          window.location.href = `pulse.html?id=${id}`;
        });

        const muteBtn = wrap.querySelector('.mute-btn');
        muteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          v.muted = !v.muted;
          muteBtn.innerHTML = v.muted
            ? '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>'
            : '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
        });
      }

      // ৩ ডটস মেনু
      article.querySelector('.pulse-more').addEventListener('click', (e) => {
        e.stopPropagation();
        openPostMenu(id, post, article);
      });

      // কমেন্ট বাটন
      article.querySelector('.comment-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        window.location.href = `${post._col === 'reels' ? 'pulse' : 'post-detail'}.html?id=${id}`;
      });

      // লাইক অ্যাকশন
      article.querySelector('.like-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!currentUser) return;
        const nowLiked = article.querySelector('.like-btn').classList.contains('liked');
        try {
          await updateDoc(doc(db, post._col || 'posts', id), {
            likes: nowLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
          });
        } catch (err) {
          console.warn('Could not update like:', err);
        }
      });

      // শেয়ার বাটন
      article.querySelector('.share-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const shareData = {
          title: 'GAIVEX Pulse',
          text: post.text ? post.text.slice(0, 80) : 'Check out this pulse on GAIVEX',
          url: postLink(id, post),
        };
        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else {
            await navigator.clipboard.writeText(shareData.url);
            showToast('Link copied to clipboard ✦');
          }
        } catch (err) {
          if (err.name !== 'AbortError') console.warn('Share failed:', err);
        }
      });

      return article;
    }

    function addStoryFor(post) {
      if (!post.uid || seenAuthors.has(post.uid) || seenAuthors.size >= 8) return;
      seenAuthors.add(post.uid);
      const a = document.createElement('a');
      a.href = profileLink(post.uid);
      a.className = 'story';
      a.innerHTML = `
        <div class="story-ring"><div class="story-avatar">${avatarInner(post.authorPhoto, post.authorName)}</div></div>
        <span class="story-name">${escapeHtml(post.authorName || 'User')}</span>
      `;
      storiesEl.appendChild(a);
    }

    let blockedUids = [];

    let postsList = [];
    let reelsList = [];

    function tsMillis(d) {
      const t = d.data.createdAt;
      return t && t.toMillis ? t.toMillis() : Date.now();
    }

    function renderFeed() {
      loadingHint.style.display = 'none';
      resetVideoObserver();
      feedEl.innerHTML = '';
      seenAuthors.clear();
      Array.from(storiesEl.querySelectorAll('.story:not(.add)')).forEach((el) => el.remove());

      const hidden = getHidden();
      const all = [...postsList, ...reelsList]
        .filter((d) => !blockedUids.includes(d.data.uid) && !hidden.includes(d.id))
        .sort((a, b) => tsMillis(b) - tsMillis(a));

      if (all.length === 0) {
        emptyHint.style.display = 'block';
        return;
      }
      emptyHint.style.display = 'none';

      all.forEach((d) => {
        feedEl.appendChild(renderPost(d.id, d.data));
        addStoryFor(d.data);
      });
    }

    function subscribeToFeed() {
      // সাধারণ পোস্ট
      onSnapshot(query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(30)), (snap) => {
        postsList = snap.docs.map((d) => ({ id: d.id, data: { ...d.data(), _col: 'posts' } }));
        renderFeed();
      }, (err) => {
        console.error('Feed error:', err);
        loadingHint.textContent = 'Could not load the feed right now.';
      });

      // Pulse ভিডিও (reels)
      onSnapshot(query(collection(db, 'reels'), orderBy('createdAt', 'desc'), limit(30)), (snap) => {
        reelsList = snap.docs.map((d) => {
          const r = d.data();
          return { id: d.id, data: { ...r, text: r.caption || '', mediaURL: r.videoURL, mediaType: 'video', _col: 'reels' } };
        });
        renderFeed();
      }, (err) => console.warn('Reels error:', err));
    }

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      currentUser = user;

      document.getElementById('composerAvatar').innerHTML = avatarInner(user.photoURL, user.displayName || user.email);

      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (snap.exists()) {
          const profile = snap.data();
          if (Array.isArray(profile.friendRequests) && profile.friendRequests.length > 0) {
            document.getElementById('notifDot').style.display = 'block';
          }
          if (Array.isArray(profile.blocked)) {
            blockedUids = profile.blocked;
          }
        }
      } catch (err) {
        console.warn('Could not load profile:', err);
      }

      subscribeToFeed();
    })();
  </script>
</body>
</html>
