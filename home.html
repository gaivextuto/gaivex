<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GAIVEX — Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧿</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
.no-select{-webkit-user-select:none;user-select:none}
.top-bar .brand-logo{font-size:19px}
.top-actions{display:flex;align-items:center;gap:14px}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--line-soft);position:relative}
.icon-btn svg{width:18px;height:18px;stroke:var(--text-primary)}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--magenta);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 0 6px var(--magenta)}
.home-content{padding:16px;max-width:560px;margin:0 auto}
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.stories::-webkit-scrollbar,.hrow::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px}
.story-ring{width:60px;height:60px;border-radius:50%;background:var(--grad-brand);padding:2.5px;display:flex;align-items:center;justify-content:center}
.story-ring .story-avatar{width:100%;height:100%;border-radius:50%;background:var(--bg-surface);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--text-primary);overflow:hidden;border:2px solid var(--bg-void)}
.story-name{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
.story.add .story-ring{background:rgba(255,255,255,.06);border:1px dashed var(--line-strong)}
.sec-title{font:700 14px Sora,sans-serif;margin:0 0 10px;color:var(--text-primary)}
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.hrow:empty{display:none}
.tcard{flex:0 0 140px;height:180px;border-radius:var(--radius-md);position:relative;overflow:hidden;background:var(--grad-brand);color:#fff;text-decoration:none}
.tcard img,.tcard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcard .tc-info{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:11.5px}
.tcard .tc-info b{display:block;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tcard .tc-txt{position:absolute;inset:0;padding:10px;font-size:12.5px;line-height:1.4;overflow:hidden}
.mini{flex:0 0 auto;min-width:200px;padding:12px;font-size:12.5px;color:var(--text-primary);text-decoration:none}
.mini b{display:block;font-size:13px}
.mini span{color:var(--text-muted);font-size:11.5px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b5c;margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.composer{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px}
.composer .story-avatar{width:38px;height:38px;border-radius:50%;background:var(--grad-warm);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:0 0 auto;overflow:hidden}
.composer-text{flex:1;color:var(--text-muted);font-size:13.5px}
.modes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;border-bottom:1px solid var(--line-soft)}
.mode{flex:0 0 auto;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent}
.mode.active{color:var(--text-primary);border-color:var(--magenta)}
.feed{display:flex;flex-direction:column;gap:16px}
.pulse{padding:16px}
.pulse-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pulse-avatar{width:40px;height:40px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto;overflow:hidden;color:inherit;text-decoration:none}
.pulse-avatar img,.story-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pulse-meta{flex:1;min-width:0}
.pulse-name{font-size:14px;font-weight:600;color:inherit;text-decoration:none}
.pulse-sub{font-size:12px;color:var(--text-muted)}
.pulse-more{color:var(--text-secondary);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.pulse-more svg{width:20px;height:20px;fill:currentColor}
.pulse-body{font-size:14px;line-height:1.55;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.pulse-body a{color:var(--magenta);text-decoration:none;font-weight:600}
.pulse-beamed{padding:10px 12px;margin-bottom:12px}
.pulse-beamed b{font-size:12px;display:block}
.pulse-beamed span{font-size:12.5px;color:var(--text-secondary);display:block;margin-top:4px}
.mwrap{position:relative;border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px;background:#000;cursor:pointer}
.pulse-media{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--grad-brand);-webkit-touch-callout:none}
.mwrap video{display:block;width:100%;max-height:480px;object-fit:contain;background:#000}
.mute-btn{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.mute-btn svg{width:16px;height:16px;stroke:#fff;fill:none}
.video-badge{position:absolute;left:10px;top:10px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.vbar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--grad-brand)}
.skel{position:absolute;inset:0;background:linear-gradient(90deg,#15121f,#241f36,#15121f);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
.burst{position:absolute;left:50%;top:50%;font-size:84px;transform:translate(-50%,-50%) scale(0);pointer-events:none;filter:drop-shadow(0 0 18px var(--magenta));animation:pop .8s ease-out forwards}
@keyframes pop{30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.pulse-actions{display:flex;gap:18px;padding-top:10px;border-top:1px solid var(--line-soft);align-items:center}
.pulse-actions button{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);font-weight:500}
.pulse-actions svg{width:17px;height:17px;stroke:currentColor;fill:none}
.pulse-actions .liked{color:var(--magenta)}.pulse-actions .liked svg{fill:var(--magenta)}
.pulse-actions .saved{color:#ffc857}.pulse-actions .saved svg{fill:#ffc857}
.pulse-actions .save-btn{margin-left:auto}
.edited{font-size:11px;color:var(--text-muted)}
.empty-hint{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px}
.more-btn{display:block;margin:16px auto;padding:10px 22px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:600;color:var(--text-primary)}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:none}
.sheet-backdrop.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg-surface,#14121f);border:1px solid var(--line-soft);border-radius:18px 18px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px));z-index:1001;transform:translateY(100%);transition:transform .22s ease;max-height:80vh;overflow:auto}
.sheet-backdrop.open .sheet{transform:none}
.sheet-grip{width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 8px}
.sheet-head{padding:6px 12px 10px;font:700 14px Sora,sans-serif}
.sheet-item{width:100%;display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:12px;font-size:14.5px;font-weight:500;color:var(--text-primary);text-align:left}
.sheet-item:active{background:rgba(255,255,255,.06)}
.sheet-item svg{width:20px;height:20px;stroke:currentColor;fill:none;flex:0 0 auto}
.sheet-item.danger{color:#ff5d6c}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:2000;display:none;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){.burst,.skel,.live-dot{animation:none}}
</style>
</head>
<body class="no-select">

  <div class="top-actions">
    <a href="search.html" class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></a>

<script type="module">
import {
  doc, getDoc, db, collection, query, orderBy, where, limit, onSnapshot,
  updateDoc, arrayUnion, arrayRemove, deleteDoc, addDoc, serverTimestamp,
} from './js/firebase-init.js';
import { requireAuth, setActiveNav, showToast } from './js/app.js';

setActiveNav('home');
// UI-level only. Real protection = Firestore Security Rules.
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('copy', (e) => e.preventDefault());

const $ = (id) => document.getElementById(id);
const feedEl = $('feed'), storiesEl = $('stories'), emptyHint = $('emptyHint'), loadingHint = $('loadingHint'), moreBtn = $('moreBtn');
const PAGE = 10;
let currentUser = null, me = {}, mode = 'foryou', shown = PAGE;
let blockedUids = [], postsList = [], reelsList = [];
const nodes = new Map(); // id -> {el, sig}

/* ---------- Helpers ---------- */
const initialsOf = (n) => (n || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const avatarInner = (u, n) => u ? `<img src="${esc(u)}" alt="" loading="lazy" decoding="async" draggable="false" />` : initialsOf(n);
const ms = (ts) => (ts && ts.toMillis ? ts.toMillis() : Date.now());

function timeAgo(ts) {
  if (!ts || !ts.toDate) return 'just now';
  const d = ts.toDate(), m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + 'm';
  const h = Math.floor(m / 60); if (h < 24) return h + 'h';
  const dd = Math.floor(h / 24); if (dd < 7) return dd + 'd';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', ...(d.getFullYear() === new Date().getFullYear() ? {} : { year: 'numeric' }) });
}
const isVideoPost = (p) => {
  if (p.mediaType) return String(p.mediaType).toLowerCase().startsWith('video');
  const u = (p.mediaURL || '').split('?')[0].toLowerCase();
  return /\.(mp4|webm|mov|m4v|ogv|3gp)$/.test(u) || u.includes('/video/upload/');
};
const profileLink = (uid) => uid ? `profile.html?uid=${encodeURIComponent(uid)}` : 'profile.html';
const pageOf = (p) => p._col === 'reels' ? 'pulse' : 'post-detail';
const postLink = (id, p) => `${location.origin}${location.pathname.replace('home.html', '')}${pageOf(p)}.html?id=${id}`;

// Cloudinary optimisation (no-op for other hosts)
const cld = (url, t) => url && url.includes('res.cloudinary.com') && url.includes('/upload/') && !url.includes('/upload/' + t)
  ? url.replace('/upload/', '/upload/' + t + '/') : url;
const imgFeed = (u) => cld(u, 'f_auto,q_auto,w_700');
const vidFeed = (u) => cld(u, 'f_auto,q_auto:eco,w_720');
const vidPoster = (u) => u && u.includes('/video/upload/') ? cld(u, 'f_jpg,so_0,w_700').replace(/\.(mp4|webm|mov|m4v)(\?.*)?$/i, '.jpg') : '';

// #hashtags → links (escaped first, so safe)
const linkify = (t) => esc(t).replace(/(^|\s)#([\p{L}\p{N}_]+)/gu, (_, s, tag) => `${s}<a href="hashtag.html?tag=${encodeURIComponent(tag)}">#${tag}</a>`);

const getHidden = () => { try { return JSON.parse(localStorage.getItem('gaivex_hidden') || '[]'); } catch { return []; } };
const addHidden = (id) => { try { const l = getHidden(); if (!l.includes(id)) l.push(id); localStorage.setItem('gaivex_hidden', JSON.stringify(l)); } catch {} };
const getMuted = () => { try { return localStorage.getItem('gaivex_muted') !== 'false'; } catch { return true; } };
const setMuted = (m) => { try { localStorage.setItem('gaivex_muted', String(m)); } catch {} };

const ICON_MUTE = '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>';
const ICON_SOUND = '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const svg = (d) => `<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const ICONS = {
  link: svg('M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7'),
  hide: svg('M17.9 17.9A10.1 10.1 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22'),
  block: svg('M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM5.6 5.6l12.8 12.8'),
  trash: svg('M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6'),
  user: svg('M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'),
  edit: svg('M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'),
  flag: svg('M4 22V4M4 4h13l-2 4 2 4H4'),
  save: svg('M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z'),
};

/* ---------- Video: autoplay in view, lazy src ---------- */
const videoObserver = new IntersectionObserver((entries) => {
  entries.forEach(({ target: v, isIntersecting, intersectionRatio }) => {
    if (isIntersecting && !v.src && v.dataset.src) { v.src = v.dataset.src; }
    if (isIntersecting && intersectionRatio >= 0.6) {
      v.muted = getMuted();
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
    } else v.pause();
  });
}, { threshold: [0, 0.6, 1], rootMargin: '300px 0px' });

/* ---------- Lightbox ---------- */
const lightbox = $('lightbox'), lightboxImg = $('lightboxImg');
const openLightbox = (src) => { lightboxImg.src = src; lightbox.classList.add('open'); document.body.style.overflow = 'hidden'; };
const closeLightbox = () => { lightbox.classList.remove('open'); lightboxImg.src = ''; document.body.style.overflow = ''; };
lightbox.addEventListener('click', closeLightbox);
$('lightboxClose').addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeLightbox(); closeSheet(); } });

/* ---------- Bottom sheet ---------- */
const sheetBackdrop = $('sheetBackdrop'), sheetEl = $('sheet');
function openSheet(items, title) {
  sheetEl.innerHTML = '<div class="sheet-grip"></div>' + (title ? `<div class="sheet-head">${esc(title)}</div>` : '');
  items.forEach((it) => {
    const b = document.createElement('button');
    b.className = 'sheet-item' + (it.danger ? ' danger' : '');
    b.innerHTML = `${it.icon || ''}<span>${it.label}</span>`;
    b.addEventListener('click', async (e) => { e.stopPropagation(); closeSheet(); await it.action(); });
    sheetEl.appendChild(b);
  });
  sheetBackdrop.classList.add('open');
}
function closeSheet() { sheetBackdrop.classList.remove('open'); }
sheetBackdrop.addEventListener('click', (e) => { if (e.target === sheetBackdrop) closeSheet(); });

/* ---------- Actions ---------- */
const colOf = (p) => p._col || 'posts';
const isSaved = (id) => Array.isArray(me.saved) && me.saved.includes(id);

async function toggleSave(id, btn) {
  const on = !isSaved(id);
  me.saved = on ? [...(me.saved || []), id] : (me.saved || []).filter((x) => x !== id);
  btn.classList.toggle('saved', on);
  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { saved: on ? arrayUnion(id) : arrayRemove(id) });
    showToast(on ? 'Pulse saved ✦' : 'Removed from Saved');
    if (mode === 'saved') renderFeed();
  } catch (err) { console.warn(err); showToast('Could not save. Try again.'); }
}

function reportPost(id, post) {
  const reasons = ['Spam', 'Harassment', 'Hate', 'Violence', 'Nudity', 'Fake account', 'Copyright', 'Other'];
  openSheet(reasons.map((r) => ({
    icon: ICONS.flag, label: r,
    action: async () => {
      try {
        await addDoc(collection(db, 'reports'), {
          postId: id, col: colOf(post), authorUid: post.uid, reporterUid: currentUser.uid,
          reason: r, status: 'pending', createdAt: serverTimestamp(),
        });
        addHidden(id); nodes.get(id)?.el.remove(); nodes.delete(id);
        showToast('Thanks — we will review it');
      } catch (err) { console.error(err); showToast('Could not send report'); }
    },
  })), 'Why are you reporting this?');
}

function openPostMenu(id, post, article) {
  const own = currentUser && post.uid === currentUser.uid;
  const items = [
    { icon: ICONS.save, label: isSaved(id) ? 'Unsave Pulse' : 'Save Pulse', action: () => toggleSave(id, article.querySelector('.save-btn')) },
    { icon: ICONS.link, label: 'Copy link', action: async () => {
      try { await navigator.clipboard.writeText(postLink(id, post)); showToast('Link copied ✦'); } catch { showToast('Could not copy link'); } } },
  ];
  if (!own) {
    items.push(
      { icon: ICONS.user, label: `View ${esc(post.authorName || 'user')}'s profile`, action: () => { location.href = profileLink(post.uid); } },
      { icon: ICONS.hide, label: 'Hide post', action: () => { addHidden(id); article.remove(); nodes.delete(id); showToast('Post hidden'); } },
      { icon: ICONS.flag, label: 'Report', danger: true, action: () => setTimeout(() => reportPost(id, post), 260) },
      { icon: ICONS.block, label: `Block ${esc(post.authorName || 'user')}`, danger: true, action: async () => {
        if (!confirm('Block this user? Their posts will no longer appear in your feed.')) return;
        try {
          await updateDoc(doc(db, 'users', currentUser.uid), { blocked: arrayUnion(post.uid) });
          blockedUids.push(post.uid); renderFeed(); showToast('User blocked');
        } catch (err) { console.error(err); showToast('Could not block. Try again.'); } } },
    );
  } else {
    items.push(
      { icon: ICONS.edit, label: 'Edit Pulse', action: async () => {
        const t = prompt('Edit your pulse', post.text || post.caption || '');
        if (t === null) return;
        try {
          await updateDoc(doc(db, colOf(post), id), colOf(post) === 'reels' ? { caption: t.trim(), edited: true } : { text: t.trim(), edited: true });
          showToast('Pulse updated');
        } catch (err) { console.error(err); showToast('Could not edit. Try again.'); } } },
      { icon: ICONS.trash, label: 'Delete post', danger: true, action: async () => {
        if (!confirm('Delete this pulse? This cannot be undone.')) return;
        try { await deleteDoc(doc(db, colOf(post), id)); showToast('Pulse deleted'); }
        catch (err) { console.error(err); showToast('Could not delete. Try again.'); } } },
    );
  }
  openSheet(items);
}

async function toggleLike(id, post, article) {
  if (!currentUser) return;
  const btn = article.querySelector('.like-btn'), cnt = btn.querySelector('.like-count');
  const was = btn.classList.contains('liked');
  btn.classList.toggle('liked', !was);              // optimistic
  cnt.textContent = Math.max(0, +cnt.textContent + (was ? -1 : 1));
  try {
    await updateDoc(doc(db, colOf(post), id), { likes: was ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
  } catch (err) {
    btn.classList.toggle('liked', was); cnt.textContent = Math.max(0, +cnt.textContent + (was ? 1 : -1));
    console.warn('Like failed:', err);
  }
}

// single tap vs double tap
function tapHandler(el, onSingle, onDouble) {
  let t = 0, timer = null;
  el.addEventListener('click', (e) => {
    const now = Date.now();
    if (now - t < 280) { clearTimeout(timer); t = 0; onDouble(e); }
    else { t = now; timer = setTimeout(() => { t = 0; onSingle(e); }, 280); }
  });
}
function burst(wrap) {
  const h = document.createElement('div'); h.className = 'burst'; h.textContent = '❤️';
  wrap.appendChild(h); setTimeout(() => h.remove(), 800);
}

/* ---------- Render post ---------- */
function visibleTo(p) {
  const v = p.visibility || 'everyone';
  if (v === 'everyone' || p.uid === currentUser.uid) return true;
  if (v === 'friends') return (me.friends || []).includes(p.uid);
  if (v === 'followers') return (me.following || []).includes(p.uid) || (me.friends || []).includes(p.uid);
  return false; // only me / custom
}

function renderPost(id, post) {
  const liked = Array.isArray(post.likes) && post.likes.includes(currentUser.uid);
  const likeCount = Array.isArray(post.likes) ? post.likes.length : 0;
  const video = post.mediaURL && isVideoPost(post);
  const pLink = profileLink(post.uid);
  const beams = post.beamsCount || 0;

  let media = '';
  if (video) media = `<div class="mwrap vwrap"><div class="skel"></div>
      <video data-src="${esc(vidFeed(post.mediaURL))}" poster="${esc(post.thumbnailURL || vidPoster(post.mediaURL))}" muted loop playsinline webkit-playsinline preload="none" disablePictureInPicture></video>
      <span class="video-badge">▶ Pulse</span><i class="vbar"></i>
      <button class="mute-btn" type="button" aria-label="Toggle sound"></button></div>`;
  else if (post.mediaURL) media = `<div class="mwrap"><img class="pulse-media" src="${esc(imgFeed(post.mediaURL))}" alt="" loading="lazy" decoding="async" draggable="false" /></div>`;

  const beamed = post.beamedFrom ? `<div class="card pulse-beamed"><b>🔁 Beamed from ${esc(post.beamedFrom.authorName || 'GAIVEX user')}</b><span>${esc(post.beamedFrom.text || '')}</span></div>` : '';

  const a = document.createElement('article');
  a.className = 'pulse card'; a.dataset.id = id;
  a.innerHTML = `
    <div class="pulse-head">
      <a class="pulse-avatar" href="${pLink}">${avatarInner(post.authorPhoto, post.authorName)}</a>
      <div class="pulse-meta">
        <a class="pulse-name" href="${pLink}">${esc(post.authorName || 'GAIVEX user')}</a>
        <div class="pulse-sub">${timeAgo(post.createdAt)}${post.edited ? ' <span class="edited">· edited</span>' : ''}</div>
      </div>
      <button class="pulse-more" type="button" aria-label="More options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    ${post.text ? `<p class="pulse-body">${linkify(post.text)}</p>` : ''}
    ${beamed}${media}
    <div class="pulse-actions">
      <button class="like-btn ${liked ? 'liked' : ''}"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg><span class="like-count">${likeCount}</span></button>
      <button class="comment-btn"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="cm-count">${post.commentsCount || 0}</span></button>
      <button class="share-btn"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>Beam${beams ? ' ' + beams : ''}</button>
      <button class="save-btn ${isSaved(id) ? 'saved' : ''}" aria-label="Save"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
    </div>`;

  const go = () => { location.href = `${pageOf(post)}.html?id=${id}`; };
  const img = a.querySelector('img.pulse-media');
  if (img) tapHandler(img.parentElement, () => openLightbox(post.mediaURL), (e) => { burst(img.parentElement); if (!a.querySelector('.like-btn').classList.contains('liked')) toggleLike(id, post, a); });

  const vw = a.querySelector('.vwrap');
  if (vw) {
    const v = vw.querySelector('video'), mb = vw.querySelector('.mute-btn'), bar = vw.querySelector('.vbar'), sk = vw.querySelector('.skel');
    const paintMute = () => { mb.innerHTML = v.muted ? ICON_MUTE : ICON_SOUND; };
    paintMute();
    v.addEventListener('playing', () => { sk.remove(); }, { once: true });
    v.addEventListener('loadeddata', () => sk.remove(), { once: true });
    v.addEventListener('timeupdate', () => { if (v.duration) bar.style.width = (v.currentTime / v.duration * 100) + '%'; });
    v.addEventListener('volumechange', paintMute);
    mb.addEventListener('click', (e) => { e.stopPropagation(); v.muted = !v.muted; setMuted(v.muted); });
    tapHandler(vw, go, () => { burst(vw); if (!a.querySelector('.like-btn').classList.contains('liked')) toggleLike(id, post, a); });
    videoObserver.observe(v);
  }

  a.querySelector('.pulse-more').addEventListener('click', (e) => { e.stopPropagation(); openPostMenu(id, post, a); });
  a.querySelector('.comment-btn').addEventListener('click', go);
  a.querySelector('.like-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleLike(id, post, a); });
  a.querySelector('.save-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleSave(id, e.currentTarget); });
  a.querySelector('.share-btn').addEventListener('click', () => { location.href = `beam.html?id=${id}&type=${post._col === 'reels' ? 'reel' : 'post'}`; });
  return a;
}

// Update only what changes (likes / comments / edits) instead of rebuilding
function patchPost(el, post) {
  const likes = Array.isArray(post.likes) ? post.likes : [];
  const lb = el.querySelector('.like-btn');
  lb.classList.toggle('liked', likes.includes(currentUser.uid));
  lb.querySelector('.like-count').textContent = likes.length;
  el.querySelector('.cm-count').textContent = post.commentsCount || 0;
  const body = el.querySelector('.pulse-body');
  if (body && body.dataset.raw !== post.text) { body.innerHTML = linkify(post.text || ''); body.dataset.raw = post.text; }
}

/* ---------- Feed logic ---------- */
function score(d) {
  const p = d.data, age = (Date.now() - ms(p.createdAt)) / 36e5;
  const eng = (p.likes?.length || 0) + 2 * (p.commentsCount || 0) + 3 * (p.beamsCount || 0);
  const rel = (me.following || []).includes(p.uid) || (me.friends || []).includes(p.uid) ? 4 : 0;
  return (eng + rel + 1) / Math.pow(age + 2, 1.3);
}

function currentList() {
  const hidden = getHidden();
  let all = [...postsList, ...reelsList].filter((d) =>
    !blockedUids.includes(d.data.uid) && !hidden.includes(d.id) && visibleTo(d.data));
  if (mode === 'friends') all = all.filter((d) => (me.friends || []).includes(d.data.uid) || d.data.uid === currentUser.uid);
  else if (mode === 'following') all = all.filter((d) => (me.following || []).includes(d.data.uid));
  else if (mode === 'saved') all = all.filter((d) => isSaved(d.id));
  return mode === 'foryou' ? all.sort((a, b) => score(b) - score(a)) : all.sort((a, b) => ms(b.data.createdAt) - ms(a.data.createdAt));
}

const EMPTY = {
  foryou: 'No pulses yet ✦ be the first to share something in your universe',
  latest: 'No pulses yet ✦ be the first to share something in your universe',
  friends: 'Nothing from friends yet. Add friends in Spaces.',
  following: 'Nothing from people you follow yet. Find creators in Spaces.',
  saved: 'Nothing saved yet. Tap the bookmark on a pulse to keep it here.',
};

function renderFeed() {
  if (!currentUser) return;
  loadingHint.style.display = 'none';
  const all = currentList(), list = all.slice(0, shown), keep = new Set(list.map((d) => d.id));

  for (const [id, n] of nodes) if (!keep.has(id)) { n.el.remove(); nodes.delete(id); }
  list.forEach((d, i) => {
    let n = nodes.get(d.id);
    if (!n) { n = { el: renderPost(d.id, d.data) }; nodes.set(d.id, n); }
    else patchPost(n.el, d.data);
    if (feedEl.children[i] !== n.el) feedEl.insertBefore(n.el, feedEl.children[i] || null);
  });

  moreBtn.style.display = all.length > shown ? 'block' : 'none';
  emptyHint.textContent = EMPTY[mode];
  emptyHint.style.display = all.length ? 'none' : 'block';
  renderStories(all); renderTrending();
}

function renderStories(all) {
  storiesEl.querySelectorAll('.story:not(.add)').forEach((el) => el.remove());
  const seen = new Set();
  for (const d of all) {
    const p = d.data;
    if (!p.uid || seen.has(p.uid) || p.uid === currentUser.uid) continue;
    seen.add(p.uid);
    const a = document.createElement('a');
    a.href = profileLink(p.uid); a.className = 'story';
    a.innerHTML = `<div class="story-ring"><div class="story-avatar">${avatarInner(p.authorPhoto, p.authorName)}</div></div><span class="story-name">${esc(p.authorName || 'User')}</span>`;
    storiesEl.appendChild(a);
    if (seen.size >= 8) break;
  }
}

function renderTrending() {
  const cutoff = Date.now() - 48 * 36e5, hidden = getHidden();
  const top = [...postsList, ...reelsList]
    .filter((d) => ms(d.data.createdAt) > cutoff && !blockedUids.includes(d.data.uid) && !hidden.includes(d.id) && visibleTo(d.data) && (d.data.visibility || 'everyone') === 'everyone')
    .map((d) => ({ d, s: (d.data.likes?.length || 0) + 2 * (d.data.commentsCount || 0) + 3 * (d.data.beamsCount || 0) + (d.data.views || 0) / 20 }))
    .filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 6);
  $('trendWrap').style.display = top.length ? 'block' : 'none';
  $('trending').innerHTML = top.map(({ d }) => {
    const p = d.data, v = p.mediaURL && isVideoPost(p);
    const bg = v ? (p.thumbnailURL || vidPoster(p.mediaURL)) : p.mediaURL ? imgFeed(p.mediaURL) : '';
    return `<a class="tcard" href="${pageOf(p)}.html?id=${d.id}">
      ${bg ? `<img src="${esc(bg)}" alt="" loading="lazy" decoding="async" draggable="false" />` : `<div class="tc-txt">${esc((p.text || '').slice(0, 110))}</div>`}
      <div class="tc-info"><b>${esc(p.authorName || 'GAIVEX user')}</b>♥ ${p.likes?.length || 0} · 💬 ${p.commentsCount || 0}</div></a>`;
  }).join('');
}

/* ---------- Mode switcher + pagination ---------- */
$('modes').addEventListener('click', (e) => {
  const b = e.target.closest('.mode'); if (!b) return;
  mode = b.dataset.mode; shown = PAGE;
  document.querySelectorAll('.mode').forEach((m) => m.classList.toggle('active', m === b));
  try { localStorage.setItem('gaivex_mode', mode); } catch {}
  nodes.forEach((n) => n.el.remove()); nodes.clear();
  renderFeed();
});
moreBtn.addEventListener('click', () => { shown += PAGE; renderFeed(); });
new IntersectionObserver((en) => { if (en[0].isIntersecting && moreBtn.style.display !== 'none') { shown += PAGE; renderFeed(); } }, { rootMargin: '600px' }).observe(moreBtn);

/* ---------- Data ---------- */
function subscribeToFeed() {
  onSnapshot(query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(40)), (snap) => {
    postsList = snap.docs.map((d) => ({ id: d.id, data: { ...d.data(), _col: 'posts' } })); renderFeed();
  }, (err) => { console.error(err); loadingHint.textContent = 'Could not load the feed. Check your connection and refresh.'; });

  onSnapshot(query(collection(db, 'reels'), orderBy('createdAt', 'desc'), limit(40)), (snap) => {
    reelsList = snap.docs.map((d) => { const r = d.data();
      return { id: d.id, data: { ...r, text: r.caption || '', mediaURL: r.videoURL, mediaType: 'video', _col: 'reels' } }; });
    renderFeed();
  }, (err) => console.warn('Reels error:', err));
}

// Live + Events cards (optional collections; hidden when empty)
function subscribeLiveEvents() {
  onSnapshot(query(collection(db, 'lives'), where('active', '==', true), limit(8)), (snap) => {
    const row = $('liveRow');
    row.innerHTML = snap.empty
      ? `<a href="live.html" class="card mini"><b><span class="live-dot"></span>Start a Live ✦</b><span>Go live with your universe</span></a>`
      : snap.docs.map((d) => { const l = d.data();
          return `<a href="live.html?id=${d.id}" class="card mini"><b><span class="live-dot"></span>LIVE NOW · ${esc(l.hostName || 'GAIVEX user')}</b><span>${l.viewersCount || 0} watching</span></a>`; }).join('');
  }, () => { $('liveRow').innerHTML = `<a href="live.html" class="card mini"><b>🔴 Live</b><span>Watch or start a live</span></a>`; });

  onSnapshot(query(collection(db, 'events'), orderBy('startAt', 'asc'), where('startAt', '>=', new Date()), limit(5)), (snap) => {
    $('eventRow').innerHTML = snap.docs.map((d) => { const e = d.data();
      const when = e.startAt?.toDate ? e.startAt.toDate().toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
      return `<a href="events.html?id=${d.id}" class="card mini"><b>📅 ${esc(e.title || 'Event')}</b><span>${esc(when)} · ${e.goingCount || (e.going?.length || 0)} going</span></a>`; }).join('')
      || `<a href="events.html" class="card mini"><b>📅 Events</b><span>Discover what is happening</span></a>`;
  }, () => { $('eventRow').innerHTML = `<a href="events.html" class="card mini"><b>📅 Events</b><span>Discover what is happening</span></a>`; });
}

function setBadge(el, n) { el.textContent = n > 99 ? '99+' : n; el.style.display = n > 0 ? 'flex' : 'none'; }

(async () => {
  const user = await requireAuth();
  if (!user) return;
  currentUser = user;
  $('composerAvatar').innerHTML = avatarInner(user.photoURL, user.displayName || user.email);
  $('myAvatar').innerHTML = user.photoURL ? avatarInner(user.photoURL, '') : '＋';

  try { const m = localStorage.getItem('gaivex_mode'); if (m && EMPTY[m]) { mode = m;
    document.querySelectorAll('.mode').forEach((b) => b.classList.toggle('active', b.dataset.mode === m)); } } catch {}

  // Live profile: friends / following / saved / blocked / request count
  onSnapshot(doc(db, 'users', user.uid), (snap) => {
    me = snap.exists() ? snap.data() : {};
    blockedUids = Array.isArray(me.blocked) ? me.blocked : [];
    setBadge($('notifBadge'), (me.unreadNotifications ?? 0) + (Array.isArray(me.friendRequests) ? me.friendRequests.length : 0));
    setBadge($('msgBadge'), me.unreadMessages || 0);
    renderFeed();
  }, (err) => console.warn('Profile error:', err));

  subscribeToFeed();
  subscribeLiveEvents();
})();
</script>
