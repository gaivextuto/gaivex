<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Playlist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/video.css" />
</head>
<body>
  <div class="bg-cosmic"></div>
  <header class="top-bar">
    <a href="videos.html" aria-label="Back" style="font-size:18px;color:var(--text-secondary)">←</a>
    <span class="brand-logo" style="font-size:18px">Playlist</span>
    <span style="width:18px"></span>
  </header>
  <main class="page">
    <div class="ul">
      <h1 class="wt-title" id="name" style="margin-top:4px">Loading…</h1>
      <p class="wt-sub" id="sub"></p>
      <div style="display:flex;gap:8px;margin:14px 0 18px">
        <a class="btn btn-primary" id="play" style="display:none">▶ Play all</a>
        <button class="btn btn-danger btn-sm" id="del" style="display:none;align-self:center">Delete playlist</button>
      </div>
      <div id="list"></div>
      <p class="vd-empty" id="empty" style="display:none">No videos yet. Use “Save” on a video to add it here.</p>
    </div>
  </main>
  <script type="module">
    import { db, doc, getDoc, updateDoc, deleteDoc, arrayRemove, onSnapshot } from './js/firebase-init.js';
    import { requireAuth, showToast } from './js/app.js';
    import { esc, thumbOf, fmtDur, fmtNum } from './js/video-utils.js';

    const pid = new URLSearchParams(location.search).get('id');
    if (!pid) location.replace('videos.html');
    const $ = (i) => document.getElementById(i);
    let me = null, pl = null;

    async function draw() {
      const ids = pl.videoIds || [];
      const vs = (await Promise.all(ids.map((i) => getDoc(doc(db, 'videos', i))))).filter((x) => x.exists());
      $('name').textContent = pl.name;
      $('sub').textContent = `${vs.length} video${vs.length === 1 ? '' : 's'} · by ${pl.ownerName || 'GAIVEX user'}`;
      $('empty').style.display = vs.length ? 'none' : 'block';
      $('play').style.display = vs.length ? 'inline-flex' : 'none';
      if (vs.length) $('play').href = `watch.html?id=${vs[0].id}&list=${pid}`;
      const mine = pl.uid === me.uid;
      $('del').style.display = mine ? 'inline-flex' : 'none';
      $('list').innerHTML = vs.map((d) => { const x = d.data();
        return `<div class="up"><a href="watch.html?id=${d.id}&list=${pid}"><img src="${esc(thumbOf(x))}" alt="" loading="lazy" /></a>
          <div style="flex:1;min-width:0"><a href="watch.html?id=${d.id}&list=${pid}"><b>${esc(x.title)}</b></a><span>${esc(x.authorName || '')}</span><span>${fmtNum(x.views)} views · ${fmtDur(x.duration)}</span>
          ${mine ? `<button class="cm-act" data-rm="${d.id}" style="color:var(--text-muted);font-size:12px;font-weight:700;margin-top:4px">Remove</button>` : ''}</div></div>`; }).join('');
    }
    $('list').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-rm]'); if (!b) return;
      try { await updateDoc(doc(db, 'playlists', pid), { videoIds: arrayRemove(b.dataset.rm) }); }
      catch (err) { console.error(err); showToast('Could not remove.'); }
    });
    $('del').addEventListener('click', async () => {
      if (!confirm('Delete this playlist?')) return;
      try { await deleteDoc(doc(db, 'playlists', pid)); location.replace('videos.html'); }
      catch (e) { console.error(e); showToast('Could not delete.'); }
    });
    (async () => {
      me = await requireAuth(); if (!me) return;
      onSnapshot(doc(db, 'playlists', pid), (s) => {
        if (!s.exists()) { $('name').textContent = 'Playlist not found'; return; }
        pl = s.data(); draw();
      });
    })();
  </script>
</body>
</html>
