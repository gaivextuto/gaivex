<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Sign Up / Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    body, html { height: 100%; }

    .auth-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 20px 24px calc(32px + var(--safe-bottom));
    }

    .auth-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-secondary);
      align-self: flex-start;
    }

    .auth-head {
      margin-top: 28px;
      margin-bottom: 28px;
    }
    .auth-head h1 {
      font-size: 26px;
      font-weight: 800;
    }
    .auth-head p {
      margin-top: 6px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Mode switch: Sign Up / Log In */
    .mode-switch {
      display: flex;
      padding: 4px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      margin-bottom: 24px;
    }
    .mode-switch button {
      flex: 1;
      height: 40px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .mode-switch button.active {
      background: var(--grad-brand);
      color: #fff;
    }

    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 50px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      color: var(--text-primary);
      font-size: 14.5px;
      padding: 0 16px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .field input::placeholder { color: var(--text-muted); }
    .field input:focus { border-color: var(--violet); }

    .field-row {
      display: flex;
      justify-content: flex-end;
      margin: -6px 0 18px;
    }
    .field-row button {
      font-size: 12.5px;
      color: var(--cyan);
      font-weight: 600;
    }

    .auth-error {
      display: none;
      font-size: 12.5px;
      color: #fda4af;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 18px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line-soft);
    }

    .social-row {
      display: flex;
      gap: 12px;
    }
    .social-btn {
      flex: 1;
      height: 48px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .auth-foot {
      margin-top: auto;
      padding-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .auth-foot button {
      color: var(--cyan);
      font-weight: 600;
    }

    .btn[disabled] { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <main class="auth-page">
    <a href="onboarding.html" class="auth-close" aria-label="Back">←</a>

    <div class="auth-head">
      <div class="brand-logo" style="font-size:20px;">GAIVEX</div>
      <h1 id="headline">Welcome to GAIVEX</h1>
      <p id="subhead">Your universe begins here.</p>
    </div>

    <div class="mode-switch" role="tablist">
      <button type="button" id="tab-login" class="active" role="tab" aria-selected="true">Log In</button>
      <button type="button" id="tab-signup" role="tab" aria-selected="false">Sign Up</button>
    </div>

    <p class="auth-error" id="authError"></p>

    <form id="authForm" novalidate>
      <div class="field" id="fieldUsername" style="display:none;">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="yourdisplayname" autocomplete="nickname" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password" required minlength="6" />
      </div>

      <div class="field-row" id="forgotRow">
        <button type="button" id="forgotBtn">Forgot password?</button>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Continue →</button>
    </form>

    <div class="divider">Or continue with</div>
    <div class="social-row">
      <button class="social-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Google
      </button>
      <button class="social-btn" id="appleBtn">
         Apple
      </button>
    </div>

    <p class="auth-foot">
      <span id="footText">Don't have an account?</span>
      <button type="button" id="footSwitch">Sign Up</button>
    </p>
  </main>

  <script type="module">
    import {
      auth, googleProvider, db,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signInWithPopup, updateProfile, doc, setDoc, getDoc,
    } from './js/firebase-init.js';
    import { redirectIfLoggedIn, markOnboarded, showToast, HOME_PAGE } from './js/app.js';

    redirectIfLoggedIn();

    const els = {
      tabLogin: document.getElementById('tab-login'),
      tabSignup: document.getElementById('tab-signup'),
      headline: document.getElementById('headline'),
      subhead: document.getElementById('subhead'),
      fieldUsername: document.getElementById('fieldUsername'),
      username: document.getElementById('username'),
      email: document.getElementById('email'),
      password: document.getElementById('password'),
      form: document.getElementById('authForm'),
      submitBtn: document.getElementById('submitBtn'),
      error: document.getElementById('authError'),
      footText: document.getElementById('footText'),
      footSwitch: document.getElementById('footSwitch'),
      forgotRow: document.getElementById('forgotRow'),
      forgotBtn: document.getElementById('forgotBtn'),
      googleBtn: document.getElementById('googleBtn'),
      appleBtn: document.getElementById('appleBtn'),
    };

    let mode = 'login'; // or 'signup'

    function setMode(next) {
      mode = next;
      const isSignup = mode === 'signup';
      els.tabLogin.classList.toggle('active', !isSignup);
      els.tabSignup.classList.toggle('active', isSignup);
      els.tabLogin.setAttribute('aria-selected', String(!isSignup));
      els.tabSignup.setAttribute('aria-selected', String(isSignup));
      els.fieldUsername.style.display = isSignup ? 'block' : 'none';
      els.username.required = isSignup;
      els.forgotRow.style.display = isSignup ? 'none' : 'flex';
      els.headline.textContent = isSignup ? 'Create your account' : 'Welcome to GAIVEX';
      els.subhead.textContent = isSignup ? 'Join the universe — it takes a minute.' : 'Your universe begins here.';
      els.submitBtn.textContent = isSignup ? 'Create account →' : 'Continue →';
      els.footText.textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
      els.footSwitch.textContent = isSignup ? 'Log In' : 'Sign Up';
      hideError();
    }

    els.tabLogin.addEventListener('click', () => setMode('login'));
    els.tabSignup.addEventListener('click', () => setMode('signup'));
    els.footSwitch.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));

    function showError(msg) {
      els.error.textContent = msg;
      els.error.style.display = 'block';
    }
    function hideError() {
      els.error.style.display = 'none';
    }

    function friendlyAuthError(err) {
      const code = err?.code || '';
      const map = {
        'auth/invalid-email': 'That email address looks invalid.',
        'auth/user-not-found': 'No account found with that email.',
        'auth/wrong-password': 'Incorrect password. Try again.',
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/email-already-in-use': 'That email is already registered — try logging in instead.',
        'auth/weak-password': 'Password should be at least 6 characters.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
        'auth/network-request-failed': 'Network error — check your connection.',
        'auth/popup-closed-by-user': 'Sign-in was cancelled.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    /** Ensures a users/{uid} Firestore profile exists (created on first sign-in). */
    async function ensureUserProfile(user, extra = {}) {
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid: user.uid,
          username: extra.username || user.displayName || user.email.split('@')[0],
          email: user.email,
          photoURL: user.photoURL || '',
          bio: '',
          createdAt: Date.now(),
          followers: [],
          following: [],
          friends: [],
          friendRequests: [],
        });
      }
    }

    els.form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = els.email.value.trim();
      const password = els.password.value;
      const username = els.username.value.trim();

      if (mode === 'signup' && username.length < 2) {
        showError('Please choose a username with at least 2 characters.');
        return;
      }

      els.submitBtn.disabled = true;
      const originalLabel = els.submitBtn.textContent;
      els.submitBtn.textContent = 'Please wait…';

      try {
        if (mode === 'signup') {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(cred.user, { displayName: username });
          await ensureUserProfile(cred.user, { username });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        markOnboarded();
        window.location.replace(HOME_PAGE);
      } catch (err) {
        showError(friendlyAuthError(err));
        els.submitBtn.disabled = false;
        els.submitBtn.textContent = originalLabel;
      }
    });

    els.googleBtn.addEventListener('click', async () => {
      try {
        const cred = await signInWithPopup(auth, googleProvider);
        await ensureUserProfile(cred.user);
        markOnboarded();
        window.location.replace(HOME_PAGE);
      } catch (err) {
        showError(friendlyAuthError(err));
      }
    });

    els.appleBtn.addEventListener('click', () => {
      showToast('Apple sign-in is coming soon.');
    });

    els.forgotBtn.addEventListener('click', () => {
      showToast('Password reset is coming soon — use Google sign-in for now.');
    });
  </script>
</body>
</html>
