<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Sign Up / Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    body, html { height: 100%; }

    .auth-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 20px 24px calc(32px + var(--safe-bottom));
    }
    .auth-close {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--text-secondary);
      align-self: flex-start;
    }
    .auth-head { margin-top: 28px; margin-bottom: 28px; }
    .auth-head h1 { font-size: 26px; font-weight: 800; }
    .auth-head p { margin-top: 6px; color: var(--text-secondary); font-size: 14px; }

    .mode-switch {
      display: flex; padding: 4px; border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      margin-bottom: 24px;
    }
    .mode-switch button {
      flex: 1; height: 40px; border-radius: var(--radius-pill);
      font-size: 13.5px; font-weight: 600; color: var(--text-secondary);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .mode-switch button.active { background: var(--grad-brand); color: #fff; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; height: 50px; border-radius: var(--radius-md);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      color: var(--text-primary);
      font-size: 14.5px; padding: 0 16px; outline: none;
      transition: border-color 0.15s ease;
      font-family: inherit;
    }
    .field select option { background: #10142c; color: #f4f5ff; }
    .field input::placeholder { color: var(--text-muted); }
    .field input:focus, .field select:focus { border-color: var(--violet); }
    .field-2 { display: flex; gap: 12px; }
    .field-2 .field { flex: 1; min-width: 0; }
    .hint { font-size: 11.5px; margin-top: 5px; min-height: 14px; color: var(--text-muted); }
    .hint.ok { color: #4ade80; }
    .hint.bad { color: #fda4af; }
    .handle-wrap { position: relative; }
    .handle-wrap span {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 14.5px;
    }
    .handle-wrap input { padding-left: 32px; }

    .field-row { display: flex; justify-content: flex-end; margin: -6px 0 18px; }
    .field-row button { font-size: 12.5px; color: var(--cyan); font-weight: 600; }

    .auth-error {
      display: none; font-size: 12.5px; color: #fda4af;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 16px;
    }
    .auth-error button { color: var(--cyan); font-weight: 600; margin-left: 6px; }
    .auth-info {
      display: none; font-size: 13px; color: #86efac;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 16px; line-height: 1.5;
    }

    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0 18px; color: var(--text-muted); font-size: 12px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

    .social-row { display: flex; gap: 12px; }
    .social-btn {
      flex: 1; height: 48px; border-radius: var(--radius-md);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13.5px; font-weight: 600; color: var(--text-primary);
    }

    .auth-foot { margin-top: auto; padding-top: 24px; text-align: center; font-size: 13px; color: var(--text-secondary); }
    .auth-foot button { color: var(--cyan); font-weight: 600; }
    .btn[disabled] { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <main class="auth-page">
    <a href="onboarding.html" class="auth-close" aria-label="Back">←</a>

    <div class="auth-head">
      <div class="brand-logo" style="font-size:20px;">GAIVEX</div>
      <h1 id="headline">Welcome to GAIVEX</h1>
      <p id="subhead">Your universe begins here.</p>
    </div>

    <div class="mode-switch" role="tablist">
      <button type="button" id="tab-login" class="active" role="tab" aria-selected="true">Log In</button>
      <button type="button" id="tab-signup" role="tab" aria-selected="false">Sign Up</button>
    </div>

    <p class="auth-info" id="authInfo"></p>
    <p class="auth-error" id="authError"></p>

    <form id="authForm" novalidate>
      <div id="signupFields" style="display:none;">
        <div class="field-2">
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" placeholder="First name" autocomplete="given-name" maxlength="30" />
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" placeholder="Last name" autocomplete="family-name" maxlength="30" />
          </div>
        </div>

        <div class="field">
          <label for="handle">Username</label>
          <div class="handle-wrap">
            <span>@</span>
            <input type="text" id="handle" placeholder="yourname" autocomplete="off" autocapitalize="none" maxlength="20" />
          </div>
          <div class="hint" id="handleHint">3–20 characters: a–z, 0–9, _ and .</div>
        </div>

        <div class="field-2">
          <div class="field">
            <label for="birthDate">Date of birth</label>
            <input type="date" id="birthDate" />
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="">Select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
              <option value="private">Prefer not to say</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" placeholder="+8801XXXXXXXXX" autocomplete="tel" />
        </div>

        <div class="field">
          <label for="city">City / Country (optional)</label>
          <input type="text" id="city" placeholder="Dhaka, Bangladesh" autocomplete="address-level2" maxlength="60" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password" required minlength="6" />
      </div>

      <div class="field-row" id="forgotRow">
        <button type="button" id="forgotBtn">Forgot password?</button>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Continue →</button>
    </form>

    <div class="divider">Or continue with</div>
    <div class="social-row">
      <button class="social-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Google
      </button>
      <button class="social-btn" id="appleBtn">
         Apple
      </button>
    </div>

    <p class="auth-foot">
      <span id="footText">Don't have an account?</span>
      <button type="button" id="footSwitch">Sign Up</button>
    </p>
  </main>

  <script type="module">
    import {
      auth, googleProvider, db,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signInWithPopup, updateProfile, signOut, deleteUser,
      sendEmailVerification, runTransaction, doc, getDoc,
    } from './js/firebase-init.js';
    import { redirectIfLoggedIn, markOnboarded, showToast, HOME_PAGE } from './js/app.js';

    redirectIfLoggedIn();

    const $ = (id) => document.getElementById(id);
    const els = {
      tabLogin: $('tab-login'), tabSignup: $('tab-signup'),
      headline: $('headline'), subhead: $('subhead'),
      signupFields: $('signupFields'),
      firstName: $('firstName'), lastName: $('lastName'), handle: $('handle'), handleHint: $('handleHint'),
      birthDate: $('birthDate'), gender: $('gender'), phone: $('phone'), city: $('city'),
      email: $('email'), password: $('password'),
      form: $('authForm'), submitBtn: $('submitBtn'),
      error: $('authError'), info: $('authInfo'),
      footText: $('footText'), footSwitch: $('footSwitch'),
      forgotRow: $('forgotRow'), forgotBtn: $('forgotBtn'),
      googleBtn: $('googleBtn'), appleBtn: $('appleBtn'),
    };

    const HANDLE_RE = /^[a-z0-9_.]{3,20}$/;
    let mode = 'login';
    let pendingUnverified = null;

    function setMode(next) {
      mode = next;
      const isSignup = mode === 'signup';
      els.tabLogin.classList.toggle('active', !isSignup);
      els.tabSignup.classList.toggle('active', isSignup);
      els.tabLogin.setAttribute('aria-selected', String(!isSignup));
      els.tabSignup.setAttribute('aria-selected', String(isSignup));
      els.signupFields.style.display = isSignup ? 'block' : 'none';
      els.password.autocomplete = isSignup ? 'new-password' : 'current-password';
      els.forgotRow.style.display = isSignup ? 'none' : 'flex';
      els.headline.textContent = isSignup ? 'Create your account' : 'Welcome to GAIVEX';
      els.subhead.textContent = isSignup ? 'Join the universe — it takes a minute.' : 'Your universe begins here.';
      els.submitBtn.textContent = isSignup ? 'Create account →' : 'Continue →';
      els.footText.textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
      els.footSwitch.textContent = isSignup ? 'Log In' : 'Sign Up';
      hideError();
    }
    els.tabLogin.addEventListener('click', () => setMode('login'));
    els.tabSignup.addEventListener('click', () => setMode('signup'));
    els.footSwitch.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));

    function showError(msg, withResend = false) {
      els.info.style.display = 'none';
      els.error.textContent = msg;
      if (withResend) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = 'Resend email';
        b.addEventListener('click', resendVerification);
        els.error.appendChild(b);
      }
      els.error.style.display = 'block';
    }
    function hideError() { els.error.style.display = 'none'; }
    function showInfo(msg) {
      hideError();
      els.info.textContent = msg;
      els.info.style.display = 'block';
    }

    function friendlyAuthError(err) {
      const map = {
        'auth/invalid-email': 'That email address looks invalid.',
        'auth/user-not-found': 'No account found with that email.',
        'auth/wrong-password': 'Incorrect password. Try again.',
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/email-already-in-use': 'That email is already registered — try logging in instead.',
        'auth/weak-password': 'Password should be at least 6 characters.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
        'auth/network-request-failed': 'Network error — check your connection.',
        'auth/popup-closed-by-user': 'Sign-in was cancelled.',
      };
      return map[err?.code] || 'Something went wrong. Please try again.';
    }

    // ---------- @username helpers ----------
    async function isHandleFree(h) {
      const snap = await getDoc(doc(db, 'usernames', h));
      return !snap.exists();
    }

    let handleTimer = null;
    els.handle.addEventListener('input', () => {
      els.handle.value = els.handle.value.toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_.]/g, '');
      const h = els.handle.value;
      clearTimeout(handleTimer);
      els.handleHint.className = 'hint';
      if (!h) { els.handleHint.textContent = '3–20 characters: a–z, 0–9, _ and .'; return; }
      if (!HANDLE_RE.test(h)) { els.handleHint.textContent = 'Use 3–20 characters: a–z, 0–9, _ and .'; els.handleHint.classList.add('bad'); return; }
      els.handleHint.textContent = 'Checking…';
      handleTimer = setTimeout(async () => {
        try {
          const free = await isHandleFree(h);
          if (els.handle.value !== h) return;
          els.handleHint.textContent = free ? `@${h} is available ✓` : `@${h} is already taken`;
          els.handleHint.className = 'hint ' + (free ? 'ok' : 'bad');
        } catch { els.handleHint.textContent = ''; }
      }, 400);
    });

    /** Atomically reserves the @handle and writes users/{uid}. Throws 'handle-taken' if someone got it first. */
    async function claimHandleAndCreateProfile(user, handle, data) {
      await runTransaction(db, async (tx) => {
        const hRef = doc(db, 'usernames', handle);
        if ((await tx.get(hRef)).exists()) throw new Error('handle-taken');
        tx.set(hRef, { uid: user.uid });
        tx.set(doc(db, 'users', user.uid), {
          uid: user.uid,
          handle,
          email: user.email,
          photoURL: user.photoURL || '',
          bio: '',
          createdAt: Date.now(),
          followers: [], following: [], friends: [], friendRequests: [],
          ...data,
        });
      });
    }

    async function makeAutoHandle(seed) {
      let base = (seed || 'user').toLowerCase().replace(/[^a-z0-9_.]/g, '').slice(0, 14);
      if (base.length < 3) base = 'user' + base;
      for (let i = 0; i < 6; i++) {
        const cand = i === 0 ? base : base + Math.floor(1000 + Math.random() * 9000);
        if (await isHandleFree(cand)) return cand;
      }
      return 'user' + Date.now().toString().slice(-9);
    }

    async function resendVerification() {
      if (!pendingUnverified) return;
      try {
        await sendEmailVerification(pendingUnverified);
        await signOut(auth);
        pendingUnverified = null;
        showInfo('Verification email sent again. Check your inbox (and Spam folder).');
      } catch (err) {
        showError(friendlyAuthError(err));
      }
    }

    // ---------- Submit ----------
    els.form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = els.email.value.trim();
      const password = els.password.value;

      let profile = null;
      if (mode === 'signup') {
        const firstName = els.firstName.value.trim();
        const lastName = els.lastName.value.trim();
        const handle = els.handle.value.trim().toLowerCase();
        const birthDate = els.birthDate.value;
        const gender = els.gender.value;

        if (!firstName || !lastName) return showError('Please enter your first and last name.');
        if (!HANDLE_RE.test(handle)) return showError('Username must be 3–20 characters: a–z, 0–9, _ or .');
        if (!birthDate) return showError('Please enter your date of birth.');
        const age = (Date.now() - new Date(birthDate).getTime()) / 31557600000;
        if (!(age >= 13)) return showError('You must be at least 13 years old to join.');
        if (!gender) return showError('Please select your gender.');
        if (password.length < 6) return showError('Password should be at least 6 characters.');

        profile = {
          handle, firstName, lastName, birthDate, gender,
          phone: els.phone.value.trim(),
          city: els.city.value.trim(),
        };
      }

      els.submitBtn.disabled = true;
      const originalLabel = els.submitBtn.textContent;
      els.submitBtn.textContent = 'Please wait…';

      try {
        if (mode === 'signup') {
          if (!(await isHandleFree(profile.handle))) {
            throw Object.assign(new Error('taken'), { custom: `@${profile.handle} is already taken. Please choose another username.` });
          }
          const fullName = `${profile.firstName} ${profile.lastName}`;
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          try {
            await updateProfile(cred.user, { displayName: fullName });
            // `username` = full display name (other pages already use this field); `handle` = @username
            await claimHandleAndCreateProfile(cred.user, profile.handle, { ...profile, username: fullName });
          } catch (inner) {
            await deleteUser(cred.user).catch(() => {});
            throw Object.assign(inner, {
              custom: inner.message === 'handle-taken'
                ? `@${profile.handle} was just taken. Please choose another username.`
                : 'Could not create your profile. Please try again.',
            });
          }
          await sendEmailVerification(cred.user);
          await signOut(auth);
          setMode('login');
          els.email.value = email;
          els.password.value = '';
          showInfo(`We sent a verification link to ${email}. Open it, then log in here. Check Spam if you can't find it.`);
        } else {
          const cred = await signInWithEmailAndPassword(auth, email, password);
          if (!cred.user.emailVerified) {
            pendingUnverified = cred.user;
            showError('Please verify your email first — check your inbox for the link.', true);
          } else {
            markOnboarded();
            window.location.replace(HOME_PAGE);
            return;
          }
        }
      } catch (err) {
        showError(err.custom || friendlyAuthError(err));
      }
      els.submitBtn.disabled = false;
      els.submitBtn.textContent = mode === 'signup' ? 'Create account →' : 'Continue →';
    });

    // ---------- Google ----------
    els.googleBtn.addEventListener('click', async () => {
      try {
        const cred = await signInWithPopup(auth, googleProvider);
        const user = cred.user;
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (!snap.exists()) {
          const handle = await makeAutoHandle(user.email.split('@')[0]);
          const parts = (user.displayName || '').trim().split(/\s+/);
          await claimHandleAndCreateProfile(user, handle, {
            username: user.displayName || user.email.split('@')[0],
            firstName: parts[0] || '',
            lastName: parts.slice(1).join(' '),
          });
        }
        markOnboarded();
        window.location.replace(HOME_PAGE);
      } catch (err) {
        showError(friendlyAuthError(err));
      }
    });

    els.appleBtn.addEventListener('click', () => showToast('Apple sign-in is coming soon.'));
    els.forgotBtn.addEventListener('click', () => showToast('Password reset is coming soon — use Google sign-in for now.'));
  </script>
</body>
</html>
