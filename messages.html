<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Messages</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    html, body { height: 100%; }

    .msg-top { justify-content: flex-start; gap: 12px; }
    .msg-top a, .msg-top button.back { font-size: 18px; color: var(--text-secondary); }
    .msg-top .title { font-size: 16px; font-weight: 700; }
    .msg-top .chat-head { display: flex; align-items: center; gap: 10px; flex: 1; }
    .msg-top .chat-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; overflow: hidden;
    }
    .msg-top .chat-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    /* ---- Inbox view ---- */
    #inboxView { padding: 8px 16px; max-width: 560px; margin: 0 auto; }
    .inbox-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; margin-bottom: 10px;
    }
    .inbox-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; flex: 0 0 auto; overflow: hidden;
    }
    .inbox-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .inbox-info { flex: 1; min-width: 0; }
    .inbox-name { font-size: 14px; font-weight: 600; }
    .inbox-preview { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inbox-time { font-size: 11px; color: var(--text-muted); flex: 0 0 auto; }

    .msg-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 20px; }

    /* ---- Chat view ---- */
    #chatView { display: none; flex-direction: column; height: 100svh; }
    #chatView.show { display: flex; }
    #inboxWrap.hidden { display: none; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
    }
    .bubble.mine {
      align-self: flex-end;
      background: var(--grad-brand);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.theirs {
      align-self: flex-start;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line-soft);
      border-bottom-left-radius: 4px;
    }

    .chat-input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px calc(10px + var(--safe-bottom));
      border-top: 1px solid var(--line-soft);
      background: rgba(10,14,34,0.85);
      backdrop-filter: blur(14px);
    }
    .chat-input-bar input {
      flex: 1;
      height: 42px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line-soft);
      color: var(--text-primary);
      padding: 0 16px;
      font-size: 14px;
      outline: none;
    }
    .chat-send {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    .chat-send svg { width: 18px; height: 18px; stroke: #fff; }
    .chat-send[disabled] { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <div id="inboxWrap">
    <header class="top-bar msg-top">
      <a href="home.html" aria-label="Back">←</a>
      <span class="title">Messages</span>
    </header>
    <main class="page" id="inboxView">
      <p class="msg-empty" id="loadingHint">Loading conversations…</p>
      <div id="inboxList"></div>
      <p class="msg-empty" id="emptyHint" style="display:none;">
        No conversations yet. Add friends in Search, then say hi here.
      </p>
    </main>

    <nav class="bottom-nav">
      <a href="home.html" data-page="home">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a href="pulse.html" data-page="pulse">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>
        Pulse
      </a>
      <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </a>
      <a href="spaces.html" data-page="spaces">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Spaces
      </a>
      <a href="profile.html" data-page="profile">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
  </div>

  <div id="chatView">
    <header class="top-bar msg-top">
      <button type="button" class="back" id="chatBack" aria-label="Back to inbox">←</button>
      <div class="chat-head">
        <div class="chat-avatar" id="chatAvatar">?</div>
        <span class="title" id="chatName">…</span>
      </div>
    </header>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-bar">
      <input type="text" id="chatInput" placeholder="Message…" maxlength="1000" />
      <button type="button" class="chat-send" id="chatSend" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </div>
  </div>

  <script type="module">
    import {
      db,
      doc, getDoc, setDoc,
      collection, addDoc, query, orderBy, onSnapshot, serverTimestamp,
    } from './js/firebase-init.js';
    import { requireAuth, setActiveNav, showToast } from './js/app.js';

    setActiveNav('home'); // messages is reached from the home top bar

    function initialsOf(name) {
      return (name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    }
    function avatarInner(photoURL, name) {
      return photoURL ? `<img src="${photoURL}" alt="" />` : initialsOf(name);
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
    function conversationId(uidA, uidB) {
      return [uidA, uidB].sort().join('_');
    }
    function timeShort(ts) {
      if (!ts || !ts.toDate) return '';
      const d = ts.toDate();
      const mins = Math.floor((Date.now() - d.getTime()) / 60000);
      if (mins < 1) return 'now';
      if (mins < 60) return `${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h`;
      return `${Math.floor(hrs / 24)}d`;
    }

    let currentUser = null;
    let activeConvId = null;
    let unsubChat = null;

    async function openChat(friendUid, friendProfile) {
      activeConvId = conversationId(currentUser.uid, friendUid);
      document.getElementById('inboxWrap').classList.add('hidden');
      document.getElementById('chatView').classList.add('show');
      document.getElementById('chatName').textContent = friendProfile.username || 'GAIVEX user';
      document.getElementById('chatAvatar').innerHTML = avatarInner(friendProfile.photoURL, friendProfile.username);

      const msgsRef = collection(db, 'conversations', activeConvId, 'messages');
      const q = query(msgsRef, orderBy('createdAt', 'asc'));

      if (unsubChat) unsubChat();
      const container = document.getElementById('chatMessages');
      unsubChat = onSnapshot(q, (snap) => {
        container.innerHTML = '';
        snap.forEach((d) => {
          const m = d.data();
          const bubble = document.createElement('div');
          bubble.className = `bubble ${m.senderId === currentUser.uid ? 'mine' : 'theirs'}`;
          bubble.textContent = m.text;
          container.appendChild(bubble);
        });
        container.scrollTop = container.scrollHeight;
      });

      document.getElementById('chatSend').onclick = () => sendMessage(friendUid);
      document.getElementById('chatInput').onkeydown = (e) => {
        if (e.key === 'Enter') sendMessage(friendUid);
      };
    }

    async function sendMessage(friendUid) {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !activeConvId) return;
      input.value = '';

      try {
        // Ensure the conversation doc (with participants) exists BEFORE writing the
        // message — the messages subcollection's rules check participants on the
        // parent doc, so a brand-new chat would otherwise fail on the first message.
        await setDoc(doc(db, 'conversations', activeConvId), {
          participants: [currentUser.uid, friendUid],
          lastMessage: text,
          lastSenderId: currentUser.uid,
          updatedAt: serverTimestamp(),
        }, { merge: true });
        await addDoc(collection(db, 'conversations', activeConvId, 'messages'), {
          senderId: currentUser.uid,
          text,
          createdAt: serverTimestamp(),
        });
      } catch (err) {
        console.error(err);
        input.value = text; // restore on failure
        showToast('Could not send — check Firestore rules for "conversations".');
      }
    }

    document.getElementById('chatBack').addEventListener('click', () => {
      if (unsubChat) { unsubChat(); unsubChat = null; }
      document.getElementById('chatView').classList.remove('show');
      document.getElementById('inboxWrap').classList.remove('hidden');
    });

    async function buildInbox() {
      const loadingHint = document.getElementById('loadingHint');
      const emptyHint = document.getElementById('emptyHint');
      const listEl = document.getElementById('inboxList');

      const mySnap = await getDoc(doc(db, 'users', currentUser.uid));
      const myProfile = mySnap.exists() ? mySnap.data() : {};
      const friendUids = Array.isArray(myProfile.friends) ? myProfile.friends : [];

      loadingHint.style.display = 'none';

      if (friendUids.length === 0) {
        emptyHint.style.display = 'block';
        return;
      }
      emptyHint.style.display = 'none';

      const rows = await Promise.all(friendUids.map(async (uid) => {
        const [profileSnap, convSnap] = await Promise.all([
          getDoc(doc(db, 'users', uid)),
          getDoc(doc(db, 'conversations', conversationId(currentUser.uid, uid))),
        ]);
        return {
          uid,
          profile: profileSnap.exists() ? profileSnap.data() : { username: 'GAIVEX user' },
          conv: convSnap.exists() ? convSnap.data() : null,
        };
      }));

      rows.sort((a, b) => {
        const ta = a.conv?.updatedAt?.toDate?.().getTime() || 0;
        const tb = b.conv?.updatedAt?.toDate?.().getTime() || 0;
        return tb - ta;
      });

      listEl.innerHTML = '';
      rows.forEach(({ uid, profile, conv }) => {
        const item = document.createElement('div');
        item.className = 'card inbox-item';
        item.innerHTML = `
          <div class="inbox-avatar">${avatarInner(profile.photoURL, profile.username)}</div>
          <div class="inbox-info">
            <div class="inbox-name">${escapeHtml(profile.username || 'GAIVEX user')}</div>
            <div class="inbox-preview">${escapeHtml(conv?.lastMessage || 'Say hi 👋')}</div>
          </div>
          <div class="inbox-time">${conv?.updatedAt ? timeShort(conv.updatedAt) : ''}</div>
        `;
        item.addEventListener('click', () => openChat(uid, profile));
        listEl.appendChild(item);
      });
    }

    (async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;
      await buildInbox();
    })();
  </script>
</body>
</html>
