<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {

}

</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Messages Pro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    :root { --safe-bottom: env(safe-area-inset-bottom); }
    .bg-cosmic { position: fixed; inset:0; z-index:-1; background: radial-gradient(120% 120% at 0% 0%, #1a1f4a 0%, #0a0e22 60%); }

    .msg-top { justify-content: flex-start; gap: 12px; padding: 10px 16px; display:flex; align-items:center; backdrop-filter: blur(16px); background: rgba(10,14,34,0.8); border-bottom:1px solid var(--line-soft); position:sticky; top:0; z-index:10; }
    .msg-top a, .msg-top button.back { font-size: 20px; color: var(--text-secondary); background:none; border:none; cursor:pointer; }
    .msg-top .title { font-size: 16px; font-weight: 700; }
    .msg-top .chat-head { display: flex; align-items: center; gap: 10px; flex: 1; min-width:0; }
    .msg-top .chat-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--grad-brand); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; overflow: hidden; position:relative; }
    .msg-top .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .online-dot { width:9px; height:9px; background:#22c55e; border-radius:50%; border:2px solid #0a0e22; position:absolute; bottom:-1px; right:-1px; }
    .chat-status { font-size:11px; color: var(--text-muted); font-weight:400; display:block; }
    
    /* Inbox */
    #inboxWrap { height: 100svh; display:flex; flex-direction:column; }
    #inboxView { padding: 8px 16px 100px; max-width: 560px; margin: 0 auto; width:100%; overflow-y:auto; flex:1; }
    .inbox-search { position:relative; margin: 12px 0; }
    .inbox-search input { width:100%; height:40px; border-radius:99px; background: rgba(255,255,255,0.06); border:1px solid var(--line-soft); color:#fff; padding:0 16px 0 38px; outline:none; font-size:14px; }
    .inbox-search svg { position:absolute; left:12px; top:10px; opacity:0.5; }
    .inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 10px; cursor:pointer; transition:0.2s; }
    .inbox-item:active { transform:scale(0.98); }
    .inbox-item.unread { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.3); }
    .inbox-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--grad-brand); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex: 0 0 auto; overflow: hidden; position:relative; }
    .inbox-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .inbox-info { flex: 1; min-width: 0; }
    .inbox-name { font-size: 14.5px; font-weight: 600; display:flex; gap:6px; align-items:center; }
    .inbox-preview { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display:flex; align-items:center; gap:4px; }
    .inbox-preview b { color:#fff; font-weight:600; }
    .inbox-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
    .inbox-time { font-size: 11px; color: var(--text-muted); }
    .unread-badge { background: var(--grad-brand); color:#fff; font-size:10px; font-weight:700; min-width:20px; height:20px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 6px; }
    .msg-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 20px; }

    /* Chat */
    #chatView { display: none; flex-direction: column; height: 100svh; }
    #chatView.show { display: flex; }
    #inboxWrap.hidden { display: none; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; scroll-behavior:smooth; }
    .date-sep { align-self:center; background: rgba(255,255,255,0.08); border:1px solid var(--line-soft); font-size:11px; padding:4px 12px; border-radius:99px; color: var(--text-muted); margin:10px 0; }
    .bubble-wrap { display:flex; flex-direction:column; max-width:78%; gap:3px; }
    .bubble-wrap.mine { align-self:flex-end; align-items:flex-end; }
    .bubble-wrap.theirs { align-self:flex-start; }
    .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45; position:relative; word-break:break-word; }
    .bubble.mine { background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; border-bottom-right-radius: 4px; }
    .bubble.theirs { background: rgba(255,255,255,0.07); border: 1px solid var(--line-soft); border-bottom-left-radius: 4px; color:#e5e7eb; }
    .bubble img { max-width:220px; border-radius:12px; display:block; cursor:pointer; }
    .bubble-time { font-size:10px; color:rgba(255,255,255,0.6); display:flex; gap:4px; align-items:center; margin-top:2px; }
    .bubble-wrap.mine .bubble-time { color: rgba(255,255,255,0.7); }
    .typing-ind { align-self:flex-start; background: rgba(255,255,255,0.06); border:1px solid var(--line-soft); padding:10px 16px; border-radius:18px; border-bottom-left-radius:4px; display:flex; gap:4px; }
    .typing-ind span { width:6px; height:6px; background:#9ca3af; border-radius:50%; animation: bounce 1.4s infinite; }
    .typing-ind span:nth-child(2){animation-delay:.2s} .typing-ind span:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    .chat-input-bar { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px calc(10px + var(--safe-bottom)); border-top: 1px solid var(--line-soft); background: rgba(10,14,34,0.92); backdrop-filter: blur(14px); position:relative; }
    .chat-actions { display:flex; gap:6px; }
    .icon-btn { width:38px; height:38px; border-radius:50%; background: rgba(255,255,255,0.06); border:1px solid var(--line-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .chat-input-wrap { flex:1; background: rgba(255,255,255,0.06); border:1px solid var(--line-soft); border-radius:20px; display:flex; align-items:flex-end; padding:6px 6px 6px 14px; }
    .chat-input-wrap textarea { flex:1; background:transparent; border:none; color:var(--text-primary); font-size:14px; outline:none; resize:none; max-height:110px; padding:6px 0; line-height:1.4; }
    .chat-send { width: 40px; height: 40px; border-radius: 50%; background: var(--grad-brand); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; border:none; cursor:pointer; }
    .chat-send svg { width: 18px; height: 18px; stroke: #fff; }
    .chat-send[disabled] { opacity: 0.5; pointer-events:none; }

    .emoji-panel { position:absolute; bottom:60px; right:12px; background:#151933; border:1px solid var(--line-soft); border-radius:16px; padding:8px; display:none; grid-template-columns: repeat(6,1fr); gap:6px; z-index:20; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    .emoji-panel.show { display:grid; }
    .emoji-panel button { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; }

    .reply-preview { background: rgba(99,102,241,0.12); border-left:3px solid #6366f1; padding:6px 10px; border-radius:8px; margin-bottom:6px; font-size:12px; }
    .load-more { align-self:center; font-size:12px; color:var(--text-muted); background: rgba(255,255,255,0.06); border:1px solid var(--line-soft); padding:6px 14px; border-radius:99px; cursor:pointer; margin-bottom:8px; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <div id="inboxWrap">
    <header class="top-bar msg-top">
      <a href="home.html" aria-label="Back">←</a>
      <span class="title">Messages</span>
    </header>
    <main class="page" id="inboxView">
      <div class="inbox-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="inboxSearch" placeholder="Search conversations..." />
      </div>
      <p class="msg-empty" id="loadingHint">Loading conversations…</p>
      <div id="inboxList"></div>
      <p class="msg-empty" id="emptyHint" style="display:none;">No conversations yet. Add friends in Search, then say hi here.</p>
    </main>
    <nav class="bottom-nav">
      <a href="home.html" data-page="home"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>Home</a>
      <a href="pulse.html" data-page="pulse"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Pulse</a>
      <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></a>

      <a href="profile.html" data-page="profile"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
    </nav>
  </div>

  <div id="chatView">
    <header class="top-bar msg-top">
      <button type="button" class="back" id="chatBack" aria-label="Back">←</button>
      <div class="chat-head">
        <div class="chat-avatar" id="chatAvatar">?</div>
        <div style="min-width:0;">
          <span class="title" id="chatName">…</span>
          <span class="chat-status" id="chatStatus"></span>
        </div>
      </div>
      <button class="icon-btn" id="chatMenuBtn" style="margin-left:auto;">⋮</button>
    </header>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-bar">
      <div class="emoji-panel" id="emojiPanel"></div>
      <div class="chat-actions">
        <button class="icon-btn" id="attachBtn" title="Send Image">📷</button>
        <input type="file" id="fileInput" accept="image/*" hidden />
      </div>
      <div class="chat-input-wrap">
        <textarea id="chatInput" placeholder="Message…" rows="1" maxlength="2000"></textarea>
        <button type="button" class="icon-btn" id="emojiBtn" style="background:none; border:none;">😊</button>
      </div>
      <button type="button" class="chat-send" id="chatSend" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </div>
  </div>

  <script type="module">
    import {
      db, doc, getDoc, setDoc, deleteDoc, updateDoc,
      collection, addDoc, query, orderBy, onSnapshot, serverTimestamp,
      limit, startAfter, where, getDocs
    } from './js/firebase-init.js';
    import { requireAuth, setActiveNav, showToast } from './js/app.js';

    setActiveNav('home');

    // --- CONFIG: তোমার স্ক্রিনশট অনুযায়ী ---
    const CLOUDINARY_CLOUD = "zcr4hgzf";
    const CLOUDINARY_PRESET = "gsukipso"; // Unsigned preset from screenshot

    const EMOJIS = ["❤️","😂","😮","😢","🙏","🔥","😍","👍","👎","😅","🥺","✨","💀","👏","🤔","😎"];

    function initialsOf(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
    function avatarInner(photoURL,name){ return photoURL ? `<img src="${photoURL}" alt="" />` : initialsOf(name); }
    function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
    function conversationId(uidA,uidB){ return [uidA,uidB].sort().join('_'); }
    function timeShort(ts){ if(!ts||!ts.toDate) return ''; const d=ts.toDate(); const mins=Math.floor((Date.now()-d.getTime())/60000); if(mins<1) return 'now'; if(mins<60) return `${mins}m`; const hrs=Math.floor(mins/60); if(hrs<24) return `${hrs}h`; return `${Math.floor(hrs/24)}d`; }
    function formatTime(ts){ if(!ts?.toDate) return ''; return ts.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
    function formatDateSep(ts){ if(!ts?.toDate) return ''; const d=ts.toDate(); const today=new Date(); const yesterday=new Date(); yesterday.setDate(today.getDate()-1);
      if(d.toDateString()===today.toDateString()) return 'Today';
      if(d.toDateString()===yesterday.toDateString()) return 'Yesterday';
      return d.toLocaleDateString(); }

    let currentUser=null, activeConvId=null, activeFriendUid=null, unsubChat=null, unsubTyping=null, unsubPresence=null;
    let lastVisible=null, isLoadingMore=false, replyTo=null;
    let inboxCache=[];

    // Emoji panel init
    const emojiPanel=document.getElementById('emojiPanel');
    EMOJIS.forEach(e=>{ const b=document.createElement('button'); b.textContent=e; b.onclick=()=>{ document.getElementById('chatInput').value+=e; emojiPanel.classList.remove('show'); document.getElementById('chatInput').focus(); }; emojiPanel.appendChild(b); });

    async function uploadToCloudinary(file){
      const fd=new FormData();
      fd.append('file',file);
      fd.append('upload_preset',CLOUDINARY_PRESET);
      const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});
      const data=await res.json();
      if(!data.secure_url) throw new Error('Upload failed');
      return data.secure_url;
    }

    async function openChat(friendUid, friendProfile){
      activeFriendUid=friendUid;
      activeConvId=conversationId(currentUser.uid,friendUid);
      document.getElementById('inboxWrap').classList.add('hidden');
      document.getElementById('chatView').classList.add('show');
      document.getElementById('chatName').textContent=friendProfile.username||'GAIVEX user';
      document.getElementById('chatAvatar').innerHTML=avatarInner(friendProfile.photoURL,friendProfile.username)+'<span class="online-dot" id="onlineDot" style="display:none;"></span>';
      
      const container=document.getElementById('chatMessages');
      container.innerHTML='<p class="msg-empty">Loading messages...</p>';
      lastVisible=null;

      // Mark as read
      try{ await updateDoc(doc(db,'conversations',activeConvId),{ [`unreadCount.${currentUser.uid}`]:0, [`seenBy.${currentUser.uid}`]: serverTimestamp() }); }catch{}

      // Presence listener
      if(unsubPresence) unsubPresence();
      unsubPresence=onSnapshot(doc(db,'users',friendUid),(snap)=>{
        const data=snap.data(); const statusEl=document.getElementById('chatStatus'); const dot=document.getElementById('onlineDot');
        if(data?.isOnline){ statusEl.textContent='Active now'; dot.style.display='block'; } else {
          dot.style.display='none';
          if(data?.lastSeen?.toDate){ const diff=Math.floor((Date.now()-data.lastSeen.toDate().getTime())/60000); statusEl.textContent= diff<60 ? `Active ${diff}m ago` : `Active ${formatDateSep(data.lastSeen)}`; } else statusEl.textContent='';
        }
      });

      // Typing listener
      if(unsubTyping) unsubTyping();
      unsubTyping=onSnapshot(collection(db,'conversations',activeConvId,'typing'),(snap)=>{
        const typing=snap.docs.find(d=>d.id!==currentUser.uid && d.data().isTyping);
        let el=document.getElementById('typingEl');
        if(typing){
          if(!el){ el=document.createElement('div'); el.id='typingEl'; el.className='typing-ind'; el.innerHTML='<span></span><span></span><span></span>'; container.appendChild(el); }
          container.scrollTop=container.scrollHeight;
        } else { if(el) el.remove(); }
      });

      loadMessages(true);
      document.getElementById('chatInput').focus();
    }

    function renderMessages(docs, prepend=false){
      const container=document.getElementById('chatMessages');
      if(prepend){
        const oldHeight=container.scrollHeight;
        const frag=document.createDocumentFragment();
        let lastDate='';
        docs.forEach(d=>{
          const m=d.data(); const dateStr=formatDateSep(m.createdAt);
          if(dateStr && dateStr!==lastDate){ const sep=document.createElement('div'); sep.className='date-sep'; sep.textContent=dateStr; frag.appendChild(sep); lastDate=dateStr; }
          frag.appendChild(createBubble(m,d.id));
        });
        container.prepend(frag);
        container.scrollTop=container.scrollHeight-oldHeight;
        return;
      }
      // Full rebuild for realtime (simple but effective)
      container.innerHTML='';
      if(docs.length>=20){
        const btn=document.createElement('button'); btn.className='load-more'; btn.textContent='Load older messages'; btn.onclick=()=>loadMessages(false); container.appendChild(btn);
      }
      let lastDate='';
      docs.forEach(d=>{
        const m=d.data(); const dateStr=formatDateSep(m.createdAt);
        if(dateStr && dateStr!==lastDate){ const sep=document.createElement('div'); sep.className='date-sep'; sep.textContent=dateStr; container.appendChild(sep); lastDate=dateStr; }
        container.appendChild(createBubble(m,d.id));
      });
      container.scrollTop=container.scrollHeight;
    }

    function createBubble(m,id){
      const wrap=document.createElement('div'); wrap.className=`bubble-wrap ${m.senderId===currentUser.uid?'mine':'theirs'}`;
      const bubble=document.createElement('div'); bubble.className=`bubble ${m.senderId===currentUser.uid?'mine':'theirs'}`;
      if(m.replyTo){ const rp=document.createElement('div'); rp.className='reply-preview'; rp.textContent=m.replyTo.text||'Photo'; bubble.appendChild(rp); }
      if(m.type==='image' && m.imageUrl){ const img=document.createElement('img'); img.src=m.imageUrl; img.loading='lazy'; img.onclick=()=>window.open(m.imageUrl,'_blank'); bubble.appendChild(img); if(m.text){ const t=document.createElement('div'); t.textContent=m.text; bubble.appendChild(t); } }
      else { bubble.textContent=m.text||''; }
      const time=document.createElement('div'); time.className='bubble-time';
      time.innerHTML=`${formatTime(m.createdAt)} ${m.senderId===currentUser.uid ? (m.seen?'✓✓':'✓') : ''}`;
      wrap.appendChild(bubble); wrap.appendChild(time);
      wrap.oncontextmenu=(e)=>{ e.preventDefault(); if(confirm('Delete this message?')) deleteDoc(doc(db,'conversations',activeConvId,'messages',id)); };
      // simple reply on click
      bubble.ondblclick=()=>{ replyTo={id,text:m.text||'Photo'}; document.getElementById('chatInput').placeholder=`Replying to ${m.text?.slice(0,20)}...`; document.getElementById('chatInput').focus(); };
      return wrap;
    }

    async function loadMessages(isInitial){
      const msgsRef=collection(db,'conversations',activeConvId,'messages');
      let q;
      if(isInitial){ q=query(msgsRef, orderBy('createdAt','desc'), limit(30)); }
      else { if(!lastVisible || isLoadingMore) return; isLoadingMore=true; q=query(msgsRef, orderBy('createdAt','desc'), startAfter(lastVisible), limit(30)); }
      if(unsubChat && isInitial){ unsubChat(); }
      const fetchQ = isInitial ? query(msgsRef, orderBy('createdAt','asc'), limit(30)) : null;
      // For realtime we use asc listener
      if(isInitial){
        unsubChat=onSnapshot(query(msgsRef, orderBy('createdAt','asc')), (snap)=>{
          lastVisible=snap.docs[0]||null;
          const docs=[...snap.docs].sort((a,b)=> (a.data().createdAt?.toMillis()||0)-(b.data().createdAt?.toMillis()||0));
          renderMessages(docs);
        });
      } else {
        const snap=await getDocs(q);
        if(snap.empty){ isLoadingMore=false; return; }
        lastVisible=snap.docs[snap.docs.length-1];
        const docs=snap.docs.reverse();
        renderMessages(docs,true);
        isLoadingMore=false;
      }
    }

    async function sendMessage(){
      const input=document.getElementById('chatInput');
      const text=input.value.trim();
      if((!text && !pendingImageUrl) || !activeConvId) return;
      const msgText=text;
      input.value=''; input.style.height='auto'; pendingImageUrl=null;
      document.getElementById('chatInput').placeholder='Message…';
      replyTo=null;

      try{
        await setDoc(doc(db,'conversations',activeConvId),{
          participants:[currentUser.uid,activeFriendUid],
          lastMessage: msgText || '📷 Photo',
          lastSenderId: currentUser.uid,
          updatedAt: serverTimestamp(),
          [`unreadCount.${activeFriendUid}`]: (inboxCache.find(r=>r.uid===activeFriendUid)?.conv?.unreadCount?.[activeFriendUid]||0)+1,
          [`unreadCount.${currentUser.uid}`]:0
        },{merge:true});

        await addDoc(collection(db,'conversations',activeConvId,'messages'),{
          senderId: currentUser.uid,
          text: msgText,
          type: currentImageToSend ? 'image' : 'text',
          imageUrl: currentImageToSend || null,
          replyTo: replyTo || null,
          createdAt: serverTimestamp(),
          seen:false
        });
        currentImageToSend=null;
        // clear typing
        await setDoc(doc(db,'conversations',activeConvId,'typing',currentUser.uid),{isTyping:false},{merge:true});
      }catch(err){ console.error(err); input.value=msgText; showToast('Could not send — check rules'); }
    }

    let currentImageToSend=null, pendingImageUrl=null;
    document.getElementById('attachBtn').onclick=()=>document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange=async (e)=>{
      const file=e.target.files[0]; if(!file) return;
      showToast('Uploading image…');
      try{ const url=await uploadToCloudinary(file); currentImageToSend=url; document.getElementById('chatInput').value=`📷 Photo ready`; document.getElementById('chatInput').focus(); showToast('Image ready — tap send'); }catch(err){ showToast('Upload failed — check Cloudinary preset is Unsigned'); }
      e.target.value='';
    };

    document.getElementById('chatSend').onclick=sendMessage;
    document.getElementById('chatInput').addEventListener('keydown',(e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
    });
    // typing indicator logic
    let typingTimeout;
    document.getElementById('chatInput').addEventListener('input',()=>{
      const el=document.getElementById('chatInput'); el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px';
      if(!activeConvId) return;
      setDoc(doc(db,'conversations',activeConvId,'typing',currentUser.uid),{isTyping:true, updatedAt: serverTimestamp()},{merge:true});
      clearTimeout(typingTimeout);
      typingTimeout=setTimeout(()=> setDoc(doc(db,'conversations',activeConvId,'typing',currentUser.uid),{isTyping:false},{merge:true}), 2000);
    });
    document.getElementById('emojiBtn').onclick=()=> emojiPanel.classList.toggle('show');
    document.addEventListener('click',(e)=>{ if(!e.target.closest('#emojiPanel') && !e.target.closest('#emojiBtn')) emojiPanel.classList.remove('show'); });

    document.getElementById('chatBack').addEventListener('click',()=>{
      if(unsubChat) { unsubChat(); unsubChat=null; }
      if(unsubTyping) { unsubTyping(); unsubTyping=null; }
      if(unsubPresence) { unsubPresence(); unsubPresence=null; }
      document.getElementById('chatView').classList.remove('show');
      document.getElementById('inboxWrap').classList.remove('hidden');
      activeConvId=null; buildInbox();
    });

    async function buildInbox(){
      const loadingHint=document.getElementById('loadingHint');
      const emptyHint=document.getElementById('emptyHint');
      const listEl=document.getElementById('inboxList');
      const searchVal=(document.getElementById('inboxSearch').value||'').toLowerCase();

      const mySnap=await getDoc(doc(db,'users',currentUser.uid));
      const myProfile=mySnap.exists()?mySnap.data():{};
      const friendUids=Array.isArray(myProfile.friends)?myProfile.friends:[];

      if(friendUids.length===0){ loadingHint.style.display='none'; emptyHint.style.display='block'; listEl.innerHTML=''; return; }

      // Batch fetch conversations for unread counts
      const rows=await Promise.all(friendUids.map(async uid=>{
        const [profileSnap, convSnap]=await Promise.all([ getDoc(doc(db,'users',uid)), getDoc(doc(db,'conversations',conversationId(currentUser.uid,uid))) ]);
        return { uid, profile: profileSnap.exists()?profileSnap.data():{username:'GAIVEX user'}, conv: convSnap.exists()?convSnap.data():null };
      }));

      rows.sort((a,b)=>{ const ta=a.conv?.updatedAt?.toDate?.().getTime()||0; const tb=b.conv?.updatedAt?.toDate?.().getTime()||0; return tb-ta; });
      inboxCache=rows;
      loadingHint.style.display='none'; emptyHint.style.display='none';
      listEl.innerHTML='';
      rows.filter(r=> !searchVal || (r.profile.username||'').toLowerCase().includes(searchVal) || (r.conv?.lastMessage||'').toLowerCase().includes(searchVal))
      .forEach(({uid,profile,conv})=>{
        const unread=conv?.unreadCount?.[currentUser.uid]||0;
        const isUnread=unread>0;
        const item=document.createElement('div'); item.className=`card inbox-item ${isUnread?'unread':''}`;
        item.innerHTML=`
          <div class="inbox-avatar">${avatarInner(profile.photoURL,profile.username)} ${profile.isOnline?'<span class="online-dot"></span>':''}</div>
          <div class="inbox-info">
            <div class="inbox-name">${escapeHtml(profile.username||'GAIVEX user')} ${isUnread?'•':''}</div>
            <div class="inbox-preview">${conv?.lastSenderId===currentUser.uid?'You: ':''}${escapeHtml(conv?.lastMessage||'Say hi 👋')}</div>
          </div>
          <div class="inbox-meta">
            <div class="inbox-time">${conv?.updatedAt?timeShort(conv.updatedAt):''}</div>
            ${isUnread?`<div class="unread-badge">${unread>9?'9+':unread}</div>`:''}
          </div>`;
        item.addEventListener('click',()=>openChat(uid,profile));
        listEl.appendChild(item);
      });
      if(listEl.children.length===0){ listEl.innerHTML='<p class="msg-empty">No results found</p>'; }
    }

    document.getElementById('inboxSearch').addEventListener('input',()=>buildInbox());

    // Presence: set online
    async function setPresence(isOnline){
      if(!currentUser) return;
      try{ await updateDoc(doc(db,'users',currentUser.uid),{isOnline, lastSeen: serverTimestamp()}); }catch{ await setDoc(doc(db,'users',currentUser.uid),{isOnline, lastSeen: serverTimestamp()},{merge:true}); }
    }

    (async()=>{
      currentUser=await requireAuth(); if(!currentUser) return;
      await buildInbox();
      await setPresence(true);
      window.addEventListener('beforeunload',()=>setPresence(false));
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') setPresence(true); else setPresence(false); });
    })();
  </script>
