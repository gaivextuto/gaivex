<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Control Center</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .cc-top { justify-content: flex-start; gap: 12px; }
    .cc-top a { font-size: 18px; color: var(--text-secondary); }
    .cc-top span { font-size: 16px; font-weight: 700; }
    .cc-body { padding: 16px; max-width: 560px; margin: 0 auto calc(24px + var(--safe-bottom)); }
    .cc-title { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 10px; }
    .cc-title:first-child { margin-top: 4px; }
    .cc-card { padding: 4px; }
    .cc-row { display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-bottom: 1px solid var(--line-soft); width: 100%; text-align: left; }
    .cc-row:last-child { border-bottom: none; }
    button.cc-row, .cc-row.tap { cursor: pointer; }
    .cc-ic { width: 34px; height: 34px; border-radius: 10px; background: rgba(124,58,237,.15); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-size: 16px; }
    .cc-text { flex: 1; min-width: 0; }
    .cc-label { font-size: 14px; font-weight: 500; }
    .cc-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
    .cc-val { font-size: 12.5px; color: var(--text-muted); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cc-chev { color: var(--text-muted); }
    .cc-row.danger .cc-label { color: #fda4af; }
    .cc-row.danger .cc-ic { background: rgba(244,63,94,.12); }
    .toggle { width: 44px; height: 26px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid var(--line-strong); position: relative; flex: 0 0 auto; transition: background .2s; }
    .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle.on { background: var(--grad-brand); border-color: transparent; }
    .toggle.on::after { transform: translateX(18px); }
    .cc-edit { display: none; padding: 0 12px 14px; }
    .cc-edit.show { display: block; }
    .cc-edit .input, .cc-edit textarea { min-height: 42px; }
    .cc-edit .row { display: flex; gap: 8px; margin-top: 8px; }
    .cc-hint { font-size: 11.5px; margin-top: 6px; min-height: 14px; color: var(--text-muted); }
    .cc-blocked { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
    .cc-blocked:last-child { border-bottom: none; }
    .cc-empty { padding: 16px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>
  <header class="top-bar cc-top"><a href="profile.html" aria-label="Back">←</a><span>Control Center</span></header>

  <main class="page"><div class="cc-body">

    <div class="cc-title">Account</div>
    <div class="card cc-card">
      <div class="cc-row tap" data-edit="name"><div class="cc-ic">👤</div><div class="cc-text"><div class="cc-label">Display name</div></div><div class="cc-val" id="nameVal">…</div><span class="cc-chev">›</span></div>
      <div class="cc-edit" id="edit-name"><input class="input" id="nameIn" maxlength="40" /><div class="row"><button class="btn btn-outline btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" id="nameSave">Save</button></div></div>

      <div class="cc-row tap" data-edit="handle"><div class="cc-ic" style="color:var(--cyan);font-weight:700">@</div><div class="cc-text"><div class="cc-label">Username</div></div><div class="cc-val" id="handleVal">…</div><span class="cc-chev">›</span></div>
      <div class="cc-edit" id="edit-handle"><input class="input" id="handleIn" maxlength="20" autocapitalize="none" /><div class="cc-hint" id="handleHint"></div><div class="row"><button class="btn btn-outline btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" id="handleSave">Save</button></div></div>

      <div class="cc-row tap" data-edit="bio"><div class="cc-ic">📝</div><div class="cc-text"><div class="cc-label">Bio</div></div><div class="cc-val" id="bioVal">…</div><span class="cc-chev">›</span></div>
      <div class="cc-edit" id="edit-bio"><textarea class="input" id="bioIn" maxlength="140" placeholder="Add a short bio…"></textarea><div class="row"><button class="btn btn-outline btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" id="bioSave">Save</button></div></div>

      <div class="cc-row"><div class="cc-ic">✉️</div><div class="cc-text"><div class="cc-label">Email</div></div><div class="cc-val" id="emailVal">…</div></div>
    </div>

    <div id="prefs"></div>

    <div class="cc-title">Blocked users</div>
    <div class="card cc-card" id="blockedList"><div class="cc-empty">Loading…</div></div>

    <div class="cc-title">Security</div>
    <div class="card cc-card">
      <button class="cc-row" id="resetPw"><div class="cc-ic">🔑</div><div class="cc-text"><div class="cc-label">Change password</div><div class="cc-sub">We'll email you a reset link</div></div><span class="cc-chev">›</span></button>
      <button class="cc-row" id="logoutAll"><div class="cc-ic">🚪</div><div class="cc-text"><div class="cc-label">Log out</div></div></button>
    </div>

    <div class="cc-title">Data</div>
    <div class="card cc-card">
      <button class="cc-row" id="dlData"><div class="cc-ic">⬇️</div><div class="cc-text"><div class="cc-label">Download my data</div><div class="cc-sub">Profile &amp; settings as JSON</div></div></button>
      <button class="cc-row" id="clearLocal"><div class="cc-ic">🧹</div><div class="cc-text"><div class="cc-label">Reset hidden reels</div><div class="cc-sub">Show "Not interested" reels again</div></div></button>
      <a href="safety.html" class="cc-row"><div class="cc-ic">🛡️</div><div class="cc-text"><div class="cc-label">Safety Center</div><div class="cc-sub">Report a problem</div></div><span class="cc-chev">›</span></a>
    </div>

    <div class="cc-title">Danger zone</div>
    <div class="card cc-card">
      <button class="cc-row danger" id="delAcc"><div class="cc-ic">🗑️</div><div class="cc-text"><div class="cc-label">Delete account</div><div class="cc-sub">This permanently removes your account</div></div></button>
    </div>
  </div></main>

  <script type="module">
    import { auth, db, doc, getDoc, updateDoc, deleteDoc, updateProfile, deleteUser, arrayRemove, runTransaction } from './js/firebase-init.js';
    import { sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
    import { requireAuth, logout, showToast, ONBOARDING_PAGE } from './js/app.js';

    const $ = (id) => document.getElementById(id);
    const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
    let user = null, handle = '', settings = {};

    // key, label, sub, default
    const PREFS = [
      ['Privacy', [
        ['isPrivate', 'Private account', 'Only friends can see your pulses', false],
        ['showInSearch', 'Show in search', 'Let people find you in Explore', true],
        ['friendsOnlyMsg', 'Friends-only messages', 'Only friends can message you', false],
        ['showFriends', 'Show friends count', 'Display on your profile', true]]],
      ['Notifications', [
        ['pushEnabled', 'Push notifications', 'Master switch', true],
        ['notifLikes', 'Likes', '', true],
        ['notifComments', 'Comments', '', true],
        ['notifRequests', 'Friend requests', '', true],
        ['notifMessages', 'Messages', '', true],
        ['emailEnabled', 'Email notifications', '', false]]],
      ['Playback', [
        ['autoplay', 'Autoplay videos', '', true],
        ['startMuted', 'Start videos muted', '', true],
        ['dataSaver', 'Data saver', 'Lower media usage', false]]],
    ];

    $('prefs').innerHTML = PREFS.map(([t, rows]) => `<div class="cc-title">${t}</div><div class="card cc-card">` +
      rows.map(([k, l, s]) => `<div class="cc-row"><div class="cc-text"><div class="cc-label">${l}</div>${s ? `<div class="cc-sub">${s}</div>` : ''}</div><button class="toggle" data-key="${k}"></button></div>`).join('') + '</div>').join('');

    document.querySelectorAll('.toggle').forEach((el) => el.addEventListener('click', async () => {
      const on = !el.classList.contains('on');
      el.classList.toggle('on', on);
      try { await updateDoc(doc(db, 'users', user.uid), { [`settings.${el.dataset.key}`]: on }); }
      catch (e) { el.classList.toggle('on', !on); showToast('Could not save.'); }
    }));

    // inline editors
    document.querySelectorAll('[data-edit]').forEach((r) => r.addEventListener('click', () => {
      const w = $('edit-' + r.dataset.edit); const open = w.classList.contains('show');
      document.querySelectorAll('.cc-edit').forEach((x) => x.classList.remove('show'));
      if (open) return;
      w.classList.add('show');
      if (r.dataset.edit === 'name') $('nameIn').value = $('nameVal').textContent;
      if (r.dataset.edit === 'handle') { $('handleIn').value = handle; $('handleHint').textContent = ''; }
      if (r.dataset.edit === 'bio') $('bioIn').value = $('bioVal').dataset.full || '';
    }));
    document.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', () => b.closest('.cc-edit').classList.remove('show')));

    $('nameSave').addEventListener('click', async () => {
      const n = $('nameIn').value.trim();
      if (n.length < 2) return showToast('Name is too short.');
      try {
        await updateProfile(auth.currentUser, { displayName: n });
        await updateDoc(doc(db, 'users', user.uid), { username: n });
        $('nameVal').textContent = n; $('edit-name').classList.remove('show'); showToast('Name updated');
      } catch (e) { console.error(e); showToast('Could not update name.'); }
    });

    $('bioSave').addEventListener('click', async () => {
      const b = $('bioIn').value.trim();
      try {
        await updateDoc(doc(db, 'users', user.uid), { bio: b });
        setBio(b); $('edit-bio').classList.remove('show'); showToast('Bio updated');
      } catch (e) { showToast('Could not save bio.'); }
    });
    function setBio(b) { $('bioVal').dataset.full = b; $('bioVal').textContent = b || 'Add bio'; }

    // username
    const RE = /^[a-z0-9_.]{3,20}$/; let t;
    $('handleIn').addEventListener('input', () => {
      const i = $('handleIn'), h = i.value = i.value.toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_.]/g, '');
      const hint = $('handleHint'); clearTimeout(t);
      if (!RE.test(h)) { hint.style.color = '#fda4af'; hint.textContent = '3–20 characters: a–z, 0–9, _ and .'; return; }
      if (h === handle) { hint.textContent = ''; return; }
      hint.style.color = 'var(--text-muted)'; hint.textContent = 'Checking…';
      t = setTimeout(async () => {
        const free = !(await getDoc(doc(db, 'usernames', h))).exists();
        if (i.value !== h) return;
        hint.style.color = free ? '#4ade80' : '#fda4af';
        hint.textContent = free ? `@${h} is available ✓` : `@${h} is already taken`;
      }, 400);
    });
    $('handleSave').addEventListener('click', async () => {
      const h = $('handleIn').value.trim();
      if (!RE.test(h)) return showToast('Invalid username.');
      if (h === handle) return $('edit-handle').classList.remove('show');
      try {
        await runTransaction(db, async (tx) => {
          const nr = doc(db, 'usernames', h);
          if ((await tx.get(nr)).exists()) throw new Error('taken');
          if (handle) tx.delete(doc(db, 'usernames', handle));
          tx.set(nr, { uid: user.uid });
          tx.update(doc(db, 'users', user.uid), { handle: h });
        });
        handle = h; $('handleVal').textContent = '@' + h; $('edit-handle').classList.remove('show'); showToast('Username updated');
      } catch (e) { showToast(e.message === 'taken' ? `@${h} is already taken.` : 'Could not update username.'); }
    });

    // blocked users
    async function loadBlocked(list) {
      const box = $('blockedList');
      if (!list.length) { box.innerHTML = '<div class="cc-empty">You haven\'t blocked anyone.</div>'; return; }
      const rows = await Promise.all(list.map(async (uid) => {
        try { const s = await getDoc(doc(db, 'users', uid)); const d = s.exists() ? s.data() : {}; return [uid, d.username || 'GAIVEX user', d.handle]; }
        catch (e) { return [uid, 'GAIVEX user', '']; }
      }));
      box.innerHTML = rows.map(([uid, n, h]) => `<div class="cc-blocked"><span>${esc(n)}${h ? ` <small class="text-muted">@${esc(h)}</small>` : ''}</span><button class="btn btn-outline btn-sm" data-un="${uid}">Unblock</button></div>`).join('');
      box.querySelectorAll('[data-un]').forEach((b) => b.addEventListener('click', async () => {
        try {
          await updateDoc(doc(db, 'users', user.uid), { blocked: arrayRemove(b.dataset.un) });
          b.closest('.cc-blocked').remove(); showToast('Unblocked');
          if (!box.children.length) loadBlocked([]);
        } catch (e) { showToast('Could not unblock.'); }
      }));
    }

    // security & data
    $('resetPw').addEventListener('click', async () => {
      try { await sendPasswordResetEmail(auth, user.email); showToast('Reset link sent to your email ✦'); }
      catch (e) { showToast('Could not send reset email.'); }
    });
    $('logoutAll').addEventListener('click', () => logout());
    $('clearLocal').addEventListener('click', () => { try { localStorage.removeItem('gx_hidden_reels'); } catch (e) {} showToast('Hidden reels reset'); });
    $('dlData').addEventListener('click', async () => {
      try {
        const s = await getDoc(doc(db, 'users', user.uid));
        const data = { uid: user.uid, email: user.email, exportedAt: new Date().toISOString(), profile: s.exists() ? s.data() : {} };
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        a.download = 'gaivex-data.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      } catch (e) { showToast('Could not export data.'); }
    });
    $('delAcc').addEventListener('click', async () => {
      if (!confirm('Delete your GAIVEX account? This cannot be undone.')) return;
      if (!confirm('Are you absolutely sure?')) return;
      try {
        if (handle) await deleteDoc(doc(db, 'usernames', handle)).catch(() => {});
        await deleteDoc(doc(db, 'users', user.uid));
        await deleteUser(auth.currentUser);
        location.replace(ONBOARDING_PAGE);
      } catch (e) { console.error(e); showToast('Could not delete. Log out, log in again, then retry.'); }
    });

    (async () => {
      user = await requireAuth(); if (!user) return;
      $('nameVal').textContent = user.displayName || user.email.split('@')[0];
      $('emailVal').textContent = user.email;
      let d = {};
      try { const s = await getDoc(doc(db, 'users', user.uid)); d = s.exists() ? s.data() : {}; } catch (e) { console.warn(e); }
      settings = d.settings || {}; handle = d.handle || '';
      $('handleVal').textContent = handle ? '@' + handle : 'Set username';
      setBio(d.bio || '');
      PREFS.forEach(([, rows]) => rows.forEach(([k, , , def]) => {
        const v = settings[k] === undefined ? def : !!settings[k];
        document.querySelector(`[data-key="${k}"]`).classList.toggle('on', v);
      }));
      loadBlocked(Array.isArray(d.blocked) ? d.blocked : []);
    })();
  </script>
</body>
</html>
