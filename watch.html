<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Watch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/video.css" />
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar">
    <a href="videos.html" aria-label="Back" style="font-size:18px;color:var(--text-secondary)">←</a>
    <span class="brand-logo" style="font-size:18px">Watch</span>
    <span style="width:18px"></span>
  </header>

  <div class="wt">
    <div class="wt-main">
      <div class="pl paused" id="pl">
        <video id="v" playsinline preload="metadata"></video>
        <div class="pl-mpop" id="mpop"></div>
        <div class="pl-ui">
          <span class="pl-skip l" id="skl">« 10s</span><span class="pl-skip r" id="skr">10s »</span>
          <button class="pl-big" id="big" aria-label="Play">▶</button>
          <div class="pl-menu" id="qm"></div>
          <div class="pl-bar">
            <div class="pl-sw"><div class="pl-marks" id="marks"></div><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" /></div>
            <div class="pl-row">
              <button id="pp" aria-label="Play/Pause">▶</button>
              <span id="tm">0:00 / 0:00</span><span class="sp"></span>
              <button id="qual">Auto</button><button id="spd">1x</button><button id="mu" aria-label="Mute">🔊</button><button id="fs" aria-label="Fullscreen">⛶</button>
            </div>
          </div>
        </div>
      </div>

      <p class="vd-empty" id="loading">Loading video…</p>
      <div id="info" style="display:none">
        <h1 class="wt-title" id="title"></h1>
        <div class="wt-sub" id="sub"></div>
        <div class="wt-author">
          <div class="wt-av" id="av"></div>
          <div style="flex:1;min-width:0"><b id="an" style="font-size:14px;display:block"></b><span class="wt-sub" id="oc"></span></div>
          <button class="btn btn-sm btn-primary" id="orbit">🪐 Orbit</button>
          <button class="btn btn-sm btn-ghost" id="del" style="display:none;color:#ff9eaa">Delete</button>
        </div>
        <div class="wt-actions">
          <button class="wt-pill" id="like">♡ <span id="lc">0</span></button>
          <button class="wt-pill" id="dis">👎 <span id="dc">0</span></button>
          <button class="wt-pill" id="mom">✦ Moment</button>
          <button class="wt-pill" id="save">＋ Save</button>
          <button class="wt-pill" id="share">↗ Share</button>
        </div>
        <div id="mwrap" style="display:none"><div class="wt-h" style="margin-top:6px">✦ Moments</div><div class="mm-list" id="mlist"></div></div>
        <div class="wt-desc" id="desc"></div>
        <div class="wt-h" id="cch">Comments</div>
        <div id="clist"></div>
      </div>
    </div>
    <aside class="wt-side"><div class="wt-h" id="uph">Up next</div><div id="up"></div></aside>
  </div>

  <div class="sheet-bg" id="sb"><div class="sheet">
    <div class="sheet-handle"></div><div class="wt-h" style="margin-top:0">Save to playlist</div>
    <div id="pls"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><input class="input" id="npn" maxlength="60" placeholder="New playlist name" style="min-height:42px" /><button class="btn btn-primary btn-sm" id="npb" style="height:42px">Create</button></div>
  </div></div>

  <div class="sheet-bg" id="mb"><div class="sheet">
    <div class="sheet-handle"></div><div class="wt-h" style="margin-top:0">✦ Pin a moment at <span id="mt">0:00</span></div>
    <input class="input" id="mi" maxlength="80" placeholder="What happens here? (e.g. best part, key point)" />
    <button class="btn btn-primary btn-block" id="mbtn" style="margin-top:12px">Pin moment</button>
  </div></div>

  <div class="wt-cbar">
    <button class="btn btn-sm btn-ghost" id="rc" style="display:none;height:42px">✕</button>
    <input class="input" id="ci" maxlength="500" placeholder="Add a comment…" />
    <button class="btn btn-primary btn-sm" id="cs" style="height:42px">Send</button>
  </div>

  <script type="module">
    import {
      db, doc, getDoc, setDoc, getDocs, where, updateDoc, deleteDoc, arrayUnion, arrayRemove, increment,
      collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp,
    } from './js/firebase-init.js';
    import { requireAuth, showToast } from './js/app.js';
    import { esc, srcOf, thumbOf, fmtDur, fmtNum, ago, avatarHtml } from './js/video-utils.js';

    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.replace('videos.html');
    const $ = (i) => document.getElementById(i);
    const pl = $('pl'), v = $('v');
    let me = null, vd = null, hideT = null, lastTap = 0;

    /* ---------- Player ---------- */
    const toggle = () => (v.paused ? v.play() : v.pause());
    const showUi = () => { pl.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => pl.classList.remove('show'), 2600); };
    const skip = (s) => { v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + s)); const el = $(s < 0 ? 'skl' : 'skr'); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); };

    v.addEventListener('play', () => { pl.classList.remove('paused'); $('pp').textContent = '⏸'; showUi(); });
    v.addEventListener('pause', () => { pl.classList.add('paused'); $('pp').textContent = '▶'; });
    v.addEventListener('ended', () => { $('big').textContent = '↻'; });
    v.addEventListener('playing', () => { $('big').textContent = '▶'; });
    v.addEventListener('timeupdate', () => {
      const d = v.duration || 0;
      const s = $('seek'); s.value = d ? (v.currentTime / d) * 1000 : 0;
      s.style.setProperty('--p', (s.value / 10) + '%');
      $('tm').textContent = fmtDur(v.currentTime) + ' / ' + fmtDur(d);
      // ভিউ গণনা: ৫ সেকেন্ড দেখলে (প্রতি সেশনে একবার)
      if (v.currentTime >= 5 && !sessionStorage['vw_' + id]) {
        sessionStorage['vw_' + id] = '1';
        updateDoc(doc(db, 'videos', id), { views: increment(1) }).catch(() => {});
      }
    });
    $('seek').addEventListener('input', (e) => { v.currentTime = (e.target.value / 1000) * (v.duration || 0); });
    $('pp').addEventListener('click', toggle);
    $('big').addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
    $('mu').addEventListener('click', () => { v.muted = !v.muted; $('mu').textContent = v.muted ? '🔇' : '🔊'; });
    const speeds = [0.5, 1, 1.25, 1.5, 2];
    $('spd').addEventListener('click', () => {
      const n = speeds[(speeds.indexOf(v.playbackRate) + 1) % speeds.length];
      v.playbackRate = n; $('spd').textContent = n + 'x';
    });
    $('fs').addEventListener('click', () => {
      if (document.fullscreenElement || document.webkitFullscreenElement) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      const f = pl.requestFullscreen || pl.webkitRequestFullscreen;
      if (f) f.call(pl); else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
      try { document.fullscreenElement ? screen.orientation.lock('landscape') : screen.orientation.unlock(); } catch (_) {}
    });
    // ডাবল ট্যাপ = ১০ সেকেন্ড আগে/পরে, সিঙ্গেল ট্যাপ = কন্ট্রোল দেখাও
    pl.addEventListener('click', (e) => {
      if (e.target.closest('button,input')) return showUi();
      const now = Date.now();
      if (now - lastTap < 300) { const r = pl.getBoundingClientRect(); skip(e.clientX - r.left < r.width / 2 ? -10 : 10); }
      else if (pl.classList.contains('show')) toggle();
      lastTap = now; showUi();
    });
    pl.addEventListener('mousemove', showUi);
    document.addEventListener('keydown', (e) => {
      if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.id !== 'seek') return;
      if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
      else if (e.key === 'ArrowRight') skip(5);
      else if (e.key === 'ArrowLeft') skip(-5);
      else if (e.key === 'f') $('fs').click();
      else if (e.key === 'm') $('mu').click();
    });

    /* ---------- Quality ---------- */
    const QS = [['Auto', 0], ['1080p', 1080], ['720p', 720], ['480p', 480], ['360p', 360]];
    let qh = +localStorage.gx_q || 0;
    function setSrc() {
      let t = v.currentTime; const was = !v.paused;
      if (!t && !resumedOnce) { resumedOnce = true; if (resumeAt > 5) { t = resumeAt; showToast('Resumed from ' + fmtDur(t)); } }
      v.src = srcOf(vd.videoURL, qh);
      $('qual').textContent = QS.find((q) => q[1] === qh)[0];
      v.addEventListener('loadedmetadata', () => { if (t) v.currentTime = t; if (was) v.play(); }, { once: true });
    }
    $('qual').addEventListener('click', () => {
      $('qm').innerHTML = QS.map((q) => `<button data-h="${q[1]}" class="${q[1] === qh ? 'on' : ''}">${q[0]}</button>`).join('');
      $('qm').classList.toggle('open');
    });
    $('qm').addEventListener('click', (e) => {
      const b = e.target.closest('[data-h]'); if (!b) return;
      qh = +b.dataset.h; localStorage.gx_q = qh; $('qm').classList.remove('open'); setSrc();
    });

    /* ---------- Video data ---------- */
    function render() {
      $('loading').style.display = 'none'; $('info').style.display = 'block';
      if (!v.getAttribute('src')) { v.poster = thumbOf(vd); setSrc(); }
      document.title = vd.title + ' — GAIVEX';
      $('title').textContent = vd.title;
      $('sub').textContent = `${fmtNum(vd.views)} views · ${ago(vd.createdAt)}`;
      $('av').innerHTML = avatarHtml(vd.authorPhoto, vd.authorName);
      $('an').textContent = vd.authorName || 'GAIVEX user';
      const likes = vd.likes || [], dis = vd.dislikes || [];
      $('like').classList.toggle('on', likes.includes(me.uid));
      $('like').firstChild.textContent = likes.includes(me.uid) ? '♥ ' : '♡ ';
      $('dis').classList.toggle('on', dis.includes(me.uid));
      $('lc').textContent = fmtNum(likes.length); $('dc').textContent = fmtNum(dis.length);
      $('desc').textContent = vd.description || 'No description.';
      $('cch').textContent = `Comments · ${fmtNum(vd.commentsCount)}`;
      $('del').style.display = vd.uid === me.uid ? 'inline-flex' : 'none';
    }
    $('desc').addEventListener('click', () => $('desc').classList.toggle('open'));

    async function react(kind) {
      const ref = doc(db, 'videos', id);
      const mine = (vd[kind] || []).includes(me.uid);
      const other = kind === 'likes' ? 'dislikes' : 'likes';
      try {
        await updateDoc(ref, { [kind]: mine ? arrayRemove(me.uid) : arrayUnion(me.uid), ...(mine ? {} : { [other]: arrayRemove(me.uid) }) });
      } catch (e) { console.error(e); showToast('Could not update.'); }
    }
    $('like').addEventListener('click', () => react('likes'));
    $('dis').addEventListener('click', () => react('dislikes'));
    $('share').addEventListener('click', async () => {
      const d = { title: vd.title, text: vd.title + ' — GAIVEX', url: location.href };
      if (navigator.share) { try { await navigator.share(d); } catch (_) {} }
      else { try { await navigator.clipboard.writeText(d.url); showToast('Link copied'); } catch (_) {} }
    });
    $('del').addEventListener('click', async () => {
      if (!confirm('Delete this video? This cannot be undone.')) return;
      try { await deleteDoc(doc(db, 'videos', id)); showToast('Video deleted'); location.replace('videos.html'); }
      catch (e) { console.error(e); showToast('Could not delete.'); }
    });

    /* ---------- Comments + replies ---------- */
    let replyTo = null, allC = [];
    const cHtml = (d, rp) => {
      const c = d.data(), canDel = c.uid === me.uid || (vd && vd.uid === me.uid), sz = rp ? 28 : 34;
      return `<div class="cm ${rp ? 'rp' : ''}"><div class="wt-av" style="width:${sz}px;height:${sz}px;font-size:11px">${avatarHtml(c.photoURL, c.name)}</div>
        <div class="cm-bubble"><b>${esc(c.name || 'GAIVEX user')}</b><small>${ago(c.createdAt)}</small><p>${esc(c.text)}</p>
        <div class="cm-act">${rp ? '' : `<button data-r="${d.id}" data-n="${esc(c.name || '')}">Reply</button>`}${canDel ? `<button data-d="${d.id}">Delete</button>` : ''}</div></div></div>`;
    };
    function drawComments() {
      const tops = allC.filter((d) => !d.data().parentId).reverse();
      $('clist').innerHTML = tops.length
        ? tops.map((t) => cHtml(t) + allC.filter((r) => r.data().parentId === t.id).map((r) => cHtml(r, true)).join('')).join('')
        : '<p class="vd-empty" style="padding:20px 0">No comments yet.</p>';
    }
    function watchComments() {
      onSnapshot(query(collection(db, 'videos', id, 'comments'), orderBy('createdAt', 'asc')), (s) => { allC = s.docs; drawComments(); });
    }
    function clearReply() { replyTo = null; $('ci').placeholder = 'Add a comment…'; $('rc').style.display = 'none'; }
    $('rc').addEventListener('click', clearReply);
    $('clist').addEventListener('click', async (e) => {
      const r = e.target.closest('[data-r]');
      if (r) { replyTo = r.dataset.r; $('ci').placeholder = 'Replying to ' + r.dataset.n + '…'; $('rc').style.display = 'inline-flex'; $('ci').focus(); return; }
      const b = e.target.closest('[data-d]'); if (!b) return;
      let n = 1;
      try {
        for (const k of allC.filter((d) => d.data().parentId === b.dataset.d)) { try { await deleteDoc(k.ref); n++; } catch (_) {} }
        await deleteDoc(doc(db, 'videos', id, 'comments', b.dataset.d));
        await updateDoc(doc(db, 'videos', id), { commentsCount: increment(-n) });
      } catch (err) { console.error(err); showToast('Could not delete.'); }
    });
    async function sendComment() {
      const text = $('ci').value.trim(); if (!text) return;
      $('ci').value = '';
      const parentId = replyTo; clearReply();
      try {
        await addDoc(collection(db, 'videos', id, 'comments'), {
          uid: me.uid, name: me.displayName || me.email.split('@')[0], photoURL: me.photoURL || '', text, parentId: parentId || null, createdAt: serverTimestamp(),
        });
        await updateDoc(doc(db, 'videos', id), { commentsCount: increment(1) });
      } catch (e) { console.error(e); $('ci').value = text; showToast('Could not post comment.'); }
    }
    $('cs').addEventListener('click', sendComment);
    $('ci').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendComment(); });

    /* ---------- Orbit (follow a creator) ---------- */
    let inOrbit = false, orbitOn = false;
    function watchOrbit() {
      onSnapshot(query(collection(db, 'orbits'), where('creator', '==', vd.uid)), (s) => {
        $('oc').textContent = fmtNum(s.size) + (s.size === 1 ? ' orbiter' : ' orbiters');
        inOrbit = s.docs.some((d) => d.data().member === me.uid);
        $('orbit').textContent = inOrbit ? '✓ In Orbit' : '🪐 Orbit';
        $('orbit').classList.toggle('btn-primary', !inOrbit);
        $('orbit').classList.toggle('btn-soft', inOrbit);
      });
    }
    $('orbit').addEventListener('click', async () => {
      const ref = doc(db, 'orbits', vd.uid + '_' + me.uid);
      try {
        if (inOrbit) await deleteDoc(ref);
        else await setDoc(ref, { creator: vd.uid, member: me.uid, creatorName: vd.authorName || '', createdAt: serverTimestamp() });
      } catch (e) { console.error(e); showToast('Could not update.'); }
    });

    /* ---------- Playlists ---------- */
    let myPls = [], nextUrl = null;
    const listId = new URLSearchParams(location.search).get('list');
    function drawPls() {
      $('pls').innerHTML = myPls.length ? myPls.map((d) => {
        const p = d.data(), on = (p.videoIds || []).includes(id);
        return `<button class="pls-row ${on ? 'on' : ''}" data-p="${d.id}">${on ? '☑' : '☐'} ${esc(p.name)}<small>${(p.videoIds || []).length}</small></button>`;
      }).join('') : '<p class="vd-empty" style="padding:12px 0">No playlists yet. Create one below.</p>';
    }
    $('save').addEventListener('click', () => $('sb').classList.add('open'));
    $('sb').addEventListener('click', (e) => { if (e.target === $('sb')) $('sb').classList.remove('open'); });
    $('pls').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      const d = myPls.find((x) => x.id === b.dataset.p), on = (d.data().videoIds || []).includes(id);
      try { await updateDoc(d.ref, { videoIds: on ? arrayRemove(id) : arrayUnion(id) }); showToast(on ? 'Removed from playlist' : 'Saved to playlist'); }
      catch (err) { console.error(err); showToast('Could not update.'); }
    });
    $('npb').addEventListener('click', async () => {
      const name = $('npn').value.trim(); if (!name) return;
      try {
        await addDoc(collection(db, 'playlists'), { uid: me.uid, ownerName: me.displayName || me.email.split('@')[0], name, videoIds: [id], createdAt: serverTimestamp() });
        $('npn').value = ''; showToast('Playlist created ✦');
      } catch (e) { console.error(e); showToast('Could not create playlist.'); }
    });
    v.addEventListener('ended', () => { if (nextUrl) location.href = nextUrl; });

    /* ---------- Up next ---------- */
    const upHtml = (vid, x, cur) => `<a class="up ${cur ? 'cur' : ''}" href="watch.html?id=${vid}${listId ? '&list=' + listId : ''}"><img src="${esc(thumbOf(x))}" alt="" loading="lazy" />
      <div><b>${esc(x.title)}</b><span>${esc(x.authorName || '')}</span><span>${fmtNum(x.views)} views · ${fmtDur(x.duration)}</span></div></a>`;
    async function loadUpNext() {
      try {
        if (listId) {
          const pl = await getDoc(doc(db, 'playlists', listId));
          if (pl.exists()) {
            const vs = (await Promise.all((pl.data().videoIds || []).map((i) => getDoc(doc(db, 'videos', i))))).filter((x) => x.exists());
            const k = vs.findIndex((x) => x.id === id);
            if (k >= 0 && vs[k + 1]) nextUrl = `watch.html?id=${vs[k + 1].id}&list=${listId}`;
            $('uph').textContent = 'Playlist · ' + pl.data().name;
            $('up').innerHTML = vs.map((d) => upHtml(d.id, d.data(), d.id === id)).join('');
            return;
          }
        }
        const s = await getDocs(query(collection(db, 'videos'), orderBy('createdAt', 'desc'), limit(12)));
        $('up').innerHTML = s.docs.filter((d) => d.id !== id).map((d) => upHtml(d.id, d.data())).join('')
          || '<p class="vd-empty" style="padding:10px 0">Nothing else yet.</p>';
      } catch (e) { console.warn(e); }
    }

    /* ---------- Moments (pin a note to an exact second) + Resume ---------- */
    let moments = [], lastPop = '', popT = null, pinAt = 0, resumedOnce = false;
    const resumeAt = +localStorage['gx_pos_' + id] || 0;
    function drawMoments() {
      const d = v.duration || (vd && vd.duration) || 0;
      $('mwrap').style.display = moments.length ? 'block' : 'none';
      $('marks').innerHTML = d ? moments.map((m) => `<i style="left:${Math.min(100, (m.t / d) * 100)}%"></i>`).join('') : '';
      $('mlist').innerHTML = moments.map((m) => `<div class="mm"><button data-t="${m.t}"><b>${fmtDur(m.t)}</b>${esc(m.text)}</button><small>${esc(m.name)}</small>
        ${(m.uid === me.uid || (vd && vd.uid === me.uid)) ? `<button class="mm-x" data-x="${m.id}" aria-label="Delete">✕</button>` : ''}</div>`).join('');
    }
    function watchMoments() {
      onSnapshot(query(collection(db, 'videos', id, 'moments'), orderBy('t', 'asc')), (s) => {
        moments = s.docs.map((d) => ({ id: d.id, ...d.data() })); drawMoments();
      });
    }
    v.addEventListener('loadedmetadata', drawMoments);
    v.addEventListener('timeupdate', () => {
      const c = v.currentTime;
      if (c > 5 && Math.floor(c) % 5 === 0) localStorage['gx_pos_' + id] = c;
      const m = moments.find((x) => Math.abs(x.t - c) < 0.6);
      if (m && lastPop !== m.id) {
        lastPop = m.id; $('mpop').textContent = '✦ ' + m.text; $('mpop').classList.add('on');
        clearTimeout(popT); popT = setTimeout(() => $('mpop').classList.remove('on'), 4000);
      } else if (!m) lastPop = '';
    });
    v.addEventListener('ended', () => localStorage.removeItem('gx_pos_' + id));
    $('mlist').addEventListener('click', async (e) => {
      const g = e.target.closest('[data-t]'), x = e.target.closest('[data-x]');
      if (g) { v.currentTime = +g.dataset.t; v.play(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      else if (x) { try { await deleteDoc(doc(db, 'videos', id, 'moments', x.dataset.x)); } catch (err) { console.error(err); showToast('Could not delete.'); } }
    });
    $('mom').addEventListener('click', () => {
      pinAt = Math.floor(v.currentTime); v.pause();
      $('mt').textContent = fmtDur(pinAt); $('mb').classList.add('open'); $('mi').focus();
    });
    $('mb').addEventListener('click', (e) => { if (e.target === $('mb')) $('mb').classList.remove('open'); });
    $('mbtn').addEventListener('click', async () => {
      const text = $('mi').value.trim(); if (!text) return showToast('Write a short note.');
      try {
        await addDoc(collection(db, 'videos', id, 'moments'), { uid: me.uid, name: me.displayName || me.email.split('@')[0], t: pinAt, text, createdAt: serverTimestamp() });
        $('mi').value = ''; $('mb').classList.remove('open'); showToast('Moment pinned ✦');
      } catch (e) { console.error(e); showToast('Could not pin moment.'); }
    });

    (async () => {
      me = await requireAuth(); if (!me) return;
      onSnapshot(doc(db, 'videos', id), (s) => {
        if (!s.exists()) { $('loading').textContent = 'This video was removed.'; $('info').style.display = 'none'; return; }
        vd = s.data(); render(); drawComments();
        $('orbit').style.display = vd.uid === me.uid ? 'none' : 'inline-flex';
        if (!orbitOn) { orbitOn = true; watchOrbit(); }
      });
      onSnapshot(query(collection(db, 'playlists'), where('uid', '==', me.uid)), (s) => { myPls = s.docs; drawPls(); });
      watchComments(); watchMoments(); loadUpNext();
    })();
