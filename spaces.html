<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Spaces</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .sp-top { justify-content: space-between; }
    .sp-top .back { font-size: 18px; color: var(--text-secondary); }
    .sp-top span.title { font-size: 16px; font-weight: 700; }
    .sp-top-left { display: flex; align-items: center; gap: 12px; }
    .sp-create-btn {
      height: 34px; padding: 0 16px; border-radius: var(--radius-pill);
      background: var(--grad-brand); color: #fff; font-size: 12.5px; font-weight: 700;
    }

    .sp-body { padding: 16px; max-width: 560px; margin: 0 auto; }
    .sp-section-title {
      font-size: 12.5px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin: 4px 0 12px;
    }

    .sp-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; }

    .sp-card { padding: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .sp-icon {
      width: 48px; height: 48px; border-radius: 16px;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex: 0 0 auto;
    }
    .sp-meta { flex: 1; min-width: 0; }
    .sp-name { font-size: 14.5px; font-weight: 700; }
    .sp-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .sp-count { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .sp-join-btn {
      height: 32px; padding: 0 14px; border-radius: var(--radius-pill);
      font-size: 12px; font-weight: 700; flex: 0 0 auto;
    }
    .sp-join-btn.join { background: var(--grad-brand); color: #fff; }
    .sp-join-btn.joined { background: rgba(255,255,255,0.05); border: 1px solid var(--line-strong); color: var(--text-secondary); }

    .sp-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }
    .sp-loading { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 0; }

    /* Create-space modal sheet */
    .sp-sheet-backdrop {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(5,6,15,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
    }
    .sp-sheet-backdrop.show { display: flex; }
    .sp-sheet {
      width: 100%; max-height: 92vh; max-height: 92dvh; overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--bg-surface);
      border: 1px solid var(--line-soft);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(24px + var(--safe-bottom));
    }
    .sp-sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
    .sp-sheet .field { margin-bottom: 12px; }
    .sp-sheet label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .sp-sheet input[type="text"], .sp-sheet textarea, .sp-sheet select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 14px;
      padding: 12px 14px;
      font-family: inherit;
      outline: none;
    }
    .sp-sheet select option { color: #000; }
    .sp-sheet textarea { min-height: 70px; resize: vertical; }
    .sp-sheet .check { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--text-primary); margin: 10px 0; }
    .sp-sheet .check small { display: block; color: var(--text-muted); font-size: 11.5px; margin-top: 2px; }
    .sp-sheet .row { display: flex; gap: 10px; margin-top: 16px; }
    .sp-sheet .row .btn { flex: 1; }
    .sp-badge { font-size: 10.5px; color: var(--text-muted); margin-left: 6px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar sp-top">
    <div class="sp-top-left">
      <a href="home.html" class="back" aria-label="Back">←</a>
      <span class="title">Spaces</span>
    </div>
    <button type="button" class="sp-create-btn" id="openCreate">+ Create</button>
  </header>

  <main class="page">
    <div class="sp-body">
      <div class="sp-section-title">My Spaces</div>
      <p class="sp-empty" id="mineEmpty" style="display:none;">You haven't joined any spaces yet.</p>
      <div class="sp-grid" id="mineGrid"></div>

      <div class="sp-section-title">Discover Spaces</div>
      <p class="sp-loading" id="loadingHint">Loading spaces…</p>
      <p class="sp-empty" id="discoverEmpty" style="display:none;">No other spaces yet — create the first one!</p>
      <div class="sp-grid" id="discoverGrid"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="pulse.html" data-page="pulse">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>
      Pulse
    </a>
    <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="spaces.html" data-page="spaces" class="active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Spaces
    </a>
    <a href="profile.html" data-page="profile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <div class="sp-sheet-backdrop" id="sheetBackdrop">
    <div class="sp-sheet">
      <h3>Create a Space</h3>
      <div class="field">
        <label for="spaceIcon">Icon (one emoji)</label>
        <input type="text" id="spaceIcon" placeholder="🚀" maxlength="4" />
      </div>
      <div class="field">
        <label for="spaceName">Name</label>
        <input type="text" id="spaceName" placeholder="e.g. Travel Buddies" maxlength="40" />
      </div>
      <div class="field">
        <label for="spaceDesc">Description</label>
        <textarea id="spaceDesc" placeholder="What's this space about?" maxlength="140"></textarea>
      </div>
      <div class="field">
        <label for="spacePrivacy">Privacy</label>
        <select id="spacePrivacy">
          <option value="public">Public — anyone can see posts</option>
          <option value="private">Private — only members can see posts</option>
        </select>
      </div>
      <label class="check">
        <input type="checkbox" id="spaceHidden" />
        <span>Hidden<small>Not shown in Discover. Only people with the invite link can find it.</small></span>
      </label>
      <label class="check">
        <input type="checkbox" id="spaceAuto" checked />
        <span>Auto-approve members<small>People with a complete profile join instantly. Turn off to approve every request manually.</small></span>
      </label>
      <div class="field">
        <label for="spaceQuestion">Joining question (optional)</label>
        <input type="text" id="spaceQuestion" placeholder="e.g. Why do you want to join?" maxlength="100" />
      </div>
      <div class="field">
        <label for="spaceRules">Group rules (one per line)</label>
        <textarea id="spaceRules" placeholder="Be respectful&#10;No spam&#10;No hate speech" maxlength="800"></textarea>
      </div>
      <div class="row">
        <button type="button" class="btn btn-outline" id="cancelCreate">Cancel</button>
        <button type="button" class="btn btn-primary" id="submitCreate">Create</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      db,
      doc, updateDoc, arrayUnion, arrayRemove,
      collection, addDoc, query, where, onSnapshot, serverTimestamp,
    } from './js/firebase-init.js';
    import { requireAuth, setActiveNav, showToast } from './js/app.js';

    setActiveNav('spaces');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    let currentUser = null;
    let mineDocs = [];
    let discoverDocs = [];

    const byNewest = (a, b) => (b.data.createdAt?.seconds || 0) - (a.data.createdAt?.seconds || 0);

    function genCode(len = 10) {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr, (n) => chars[n % chars.length]).join('');
    }

    function profileOk(u) {
      const verified = u.emailVerified || (u.providerData || []).some((p) => p.providerId !== 'password');
      return !!u.displayName && !!u.email && verified;
    }

    function renderCard(id, space) {
      const members = Array.isArray(space.members) ? space.members : [];
      const joined = members.includes(currentUser.uid);
      const isPublic = space.privacy !== 'private';
      const lock = isPublic ? '' : '🔒 ';
      const canInstantJoin = isPublic && space.autoApprove !== false && profileOk(currentUser);
      const card = document.createElement('div');
      card.className = 'card sp-card';
      card.innerHTML = `
        <div class="sp-icon">${escapeHtml(space.icon || '🪐')}</div>
        <div class="sp-meta">
          <div class="sp-name">${lock}${escapeHtml(space.name || 'Untitled Space')}${space.hidden ? '<span class="sp-badge">Hidden</span>' : ''}</div>
          <div class="sp-desc">${escapeHtml(space.description || '')}</div>
          <div class="sp-count">${members.length} member${members.length === 1 ? '' : 's'}</div>
        </div>
        <button class="sp-join-btn ${joined ? 'joined' : 'join'}" data-id="${id}" data-joined="${joined}" data-instant="${canInstantJoin}">
          ${joined ? 'Joined' : (canInstantJoin ? 'Join' : 'View')}
        </button>
      `;
      card.addEventListener('click', (e) => {
        if (e.target.closest('.sp-join-btn')) return;
        location.href = 'space.html?id=' + id;
      });
      return card;
    }

    function paint() {
      document.getElementById('loadingHint').style.display = 'none';
      const mineGrid = document.getElementById('mineGrid');
      const discoverGrid = document.getElementById('discoverGrid');
      mineGrid.innerHTML = '';
      discoverGrid.innerHTML = '';

      const mineIds = new Set(mineDocs.map((d) => d.id));
      const mine = [...mineDocs].sort(byNewest);
      const discover = discoverDocs.filter((d) => !mineIds.has(d.id)).sort(byNewest);

      mine.forEach((d) => mineGrid.appendChild(renderCard(d.id, d.data)));
      discover.forEach((d) => discoverGrid.appendChild(renderCard(d.id, d.data)));

      document.getElementById('mineEmpty').style.display = mine.length === 0 ? 'block' : 'none';
      document.getElementById('discoverEmpty').style.display = discover.length === 0 ? 'block' : 'none';
    }

    function subscribeSpaces() {
      const onErr = (err) => {
        console.error(err);
        document.getElementById('loadingHint').textContent = 'Could not load spaces right now.';
      };
      // আমার Spaces (hidden সহ)
      onSnapshot(
        query(collection(db, 'spaces'), where('members', 'array-contains', currentUser.uid)),
        (snap) => { mineDocs = snap.docs.map((d) => ({ id: d.id, data: d.data() })); paint(); },
        onErr
      );
      // Discover — hidden Space কখনো আসবে না
      onSnapshot(
        query(collection(db, 'spaces'), where('hidden', '==', false)),
        (snap) => { discoverDocs = snap.docs.map((d) => ({ id: d.id, data: d.data() })); paint(); },
        onErr
      );
    }

    document.body.addEventListener('click', async (e) => {
      const btn = e.target.closest('.sp-join-btn');
      if (!btn) return;
      const id = btn.dataset.id;
      const isJoined = btn.dataset.joined === 'true';
      const instant = btn.dataset.instant === 'true';

      // Private / approval লাগলে Space পেজে গিয়ে request পাঠাতে হবে
      if (!isJoined && !instant) { location.href = 'space.html?id=' + id; return; }

      btn.disabled = true;
      try {
        const name = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : 'Member');
        if (isJoined) {
          await updateDoc(doc(db, 'spaces', id), {
            members: arrayRemove(currentUser.uid),
            admins: arrayRemove(currentUser.uid),
          });
        } else {
          await updateDoc(doc(db, 'spaces', id), {
            members: arrayUnion(currentUser.uid),
            ['memberNames.' + currentUser.uid]: name,
          });
        }
      } catch (err) {
        console.error(err);
        showToast('Could not update membership.');
      } finally {
        btn.disabled = false;
      }
    });

    // Create-space sheet
    const backdrop = document.getElementById('sheetBackdrop');
    document.getElementById('openCreate').addEventListener('click', () => backdrop.classList.add('show'));
    document.getElementById('cancelCreate').addEventListener('click', () => backdrop.classList.remove('show'));
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.classList.remove('show'); });

    document.getElementById('submitCreate').addEventListener('click', async () => {
      const icon = document.getElementById('spaceIcon').value.trim() || '🪐';
      const name = document.getElementById('spaceName').value.trim();
      const description = document.getElementById('spaceDesc').value.trim();
      const privacy = document.getElementById('spacePrivacy').value;
      const hidden = document.getElementById('spaceHidden').checked;
      const autoApprove = document.getElementById('spaceAuto').checked;
      const question = document.getElementById('spaceQuestion').value.trim();
      const rules = document.getElementById('spaceRules').value
        .split('\n').map((r) => r.trim()).filter(Boolean).slice(0, 15);

      if (name.length < 2) {
        showToast('Please give your space a name.');
        return;
      }

      const myName = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : 'Member');
      const submitBtn = document.getElementById('submitCreate');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating…';

      try {
        await addDoc(collection(db, 'spaces'), {
          icon, name, description,
          privacy, hidden, autoApprove, question, rules,
          inviteCode: genCode(),
          liveActive: false,
          members: [currentUser.uid],
          admins: [currentUser.uid],
          memberNames: { [currentUser.uid]: myName },
          createdBy: currentUser.uid,
          createdAt: serverTimestamp(),
        });
        ['spaceIcon', 'spaceName', 'spaceDesc', 'spaceQuestion', 'spaceRules'].forEach((i) => { document.getElementById(i).value = ''; });
        document.getElementById('spaceHidden').checked = false;
        document.getElementById('spaceAuto').checked = true;
        document.getElementById('spacePrivacy').value = 'public';
        backdrop.classList.remove('show');
        showToast('Space created ✦');
      } catch (err) {
        console.error(err);
        showToast('Could not create space. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create';
      }
    });

    (async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;
      subscribeSpaces();
    })();
  </script>
</body>
</html>
