<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .pf-top { justify-content: space-between; }
    .pf-top .back { font-size: 20px; color: var(--text-secondary); visibility: hidden; }
    .pf-top .back.show { visibility: visible; }
    .pf-top button.icon-only { font-size: 13px; color: var(--text-secondary); font-weight: 600; }

    .pf-body { padding: 20px 16px; max-width: 560px; margin: 0 auto; }

    .pf-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 20px; }
    .pf-avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 800; color: #fff;
      box-shadow: var(--shadow-glow);
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .pf-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pf-avatar-edit {
      position: absolute;
      bottom: 8px; right: -2px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2px solid var(--bg-void);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .pf-avatar-edit svg { width: 14px; height: 14px; stroke: var(--cyan); }
    .pf-avatar.own .pf-avatar-edit { display: flex; }
    .pf-avatar-uploading { opacity: 0.5; pointer-events: none; }
    .pf-name { font-size: 19px; font-weight: 700; }
    .pf-handle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .pf-bio { margin-top: 10px; font-size: 13.5px; color: var(--text-secondary); max-width: 320px; line-height: 1.5; }

    .pf-stats { display: flex; justify-content: center; gap: 28px; margin: 18px 0 16px; }
    .pf-stat { text-align: center; }
    .pf-stat b { display: block; font-size: 16px; font-weight: 700; }
    .pf-stat span { font-size: 11.5px; color: var(--text-muted); }

    .pf-actions { display: flex; gap: 10px; width: 100%; max-width: 320px; }

    .pf-bio-edit { display: none; width: 100%; margin-top: 10px; }
    .pf-bio-edit textarea {
      width: 100%; min-height: 64px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13.5px; padding: 10px 12px;
      font-family: inherit; resize: vertical; outline: none;
    }
    .pf-bio-edit .row { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
    .pf-bio-edit .row button { height: 34px; padding: 0 16px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 600; }

    /* Tabs */
    .pf-tabs {
      display: flex; margin-top: 24px;
      border-bottom: 1px solid var(--line-soft);
    }
    .pf-tab {
      flex: 1; padding: 12px 0; text-align: center;
      font-size: 13px; font-weight: 700; letter-spacing: 0.03em;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .pf-tab.active { color: var(--text-primary); border-bottom-color: var(--cyan); }

    /* Grid */
    .pf-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-top: 3px;
    }
    .pf-tile {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
      background: var(--bg-surface);
      cursor: pointer;
    }
    .pf-tile img, .pf-tile video {
      width: 100%; height: 100%; object-fit: cover; display: block;
      pointer-events: none;
    }
    .pf-tile .pf-text-tile {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 8px; text-align: center;
      font-size: 12px; line-height: 1.35; color: #fff;
      background: linear-gradient(135deg, rgba(99,102,241,0.55), rgba(236,72,153,0.4));
      overflow: hidden; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical;
      align-content: center;
    }
    .pf-tile .pf-badge {
      position: absolute; top: 6px; left: 6px;
      width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5); border-radius: 50%;
    }
    .pf-tile .pf-badge svg { width: 11px; height: 11px; fill: #fff; stroke: none; }
    .pf-tile .pf-del {
      position: absolute; top: 5px; right: 5px; z-index: 2;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(0,0,0,0.55); color: #fff; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }

    .pf-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 28px 8px; grid-column: 1 / -1; }

    /* Video viewer */
    .pf-viewer {
      position: fixed; inset: 0; z-index: 80; background: #000;
      display: none; flex-direction: column;
    }
    .pf-viewer.show { display: flex; }
    .pf-viewer-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: calc(12px + var(--safe-top)) 16px 12px; color: #fff; font-size: 20px;
    }
    .pf-viewer-bar button { color: #fff; font-size: 20px; padding: 4px 8px; }
    .pf-viewer video { flex: 1; width: 100%; min-height: 0; background: #000; }
    .pf-viewer-cap { padding: 12px 16px calc(16px + var(--safe-bottom)); color: #fff; font-size: 13.5px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar pf-top">
    <a href="home.html" class="back" id="backBtn">←</a>
    <span class="brand-logo" style="font-size:16px;">Profile</span>
    <div style="display:flex; align-items:center; gap:14px;">
      <a href="settings.html" id="settingsLink" aria-label="Settings" style="color:var(--text-secondary); font-size:18px;">⚙</a>
      <button type="button" class="icon-only" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="page">
    <div class="pf-body">
      <div class="pf-head">
        <div class="pf-avatar" id="pfAvatar">
          <span id="pfAvatarText">?</span>
          <label class="pf-avatar-edit" for="avatarFile" aria-label="Change profile picture">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
          </label>
          <input type="file" id="avatarFile" accept="image/*" style="display:none;" />
        </div>
        <div class="pf-name" id="pfName">…</div>
        <div class="pf-handle" id="pfHandle"></div>
        <p class="pf-bio" id="pfBio"></p>

        <div class="pf-stats">
          <div class="pf-stat"><b id="statPosts">0</b><span>Pulses</span></div>
          <div class="pf-stat"><b id="statFriends">0</b><span>Friends</span></div>
          <div class="pf-stat"><b id="statFollowers">0</b><span>Followers</span></div>
        </div>

        <div class="pf-actions" id="pfActions"></div>

        <div class="pf-bio-edit" id="bioEditWrap">
          <textarea id="bioInput" maxlength="140" placeholder="Add a short bio…"></textarea>
          <div class="row">
            <button type="button" class="btn btn-outline" id="bioCancel">Cancel</button>
            <button type="button" class="btn btn-primary" id="bioSave">Save</button>
          </div>
        </div>
      </div>

      <div id="pfContent">
        <div class="pf-tabs">
          <button type="button" class="pf-tab active" id="tabPosts">PULSES</button>
          <button type="button" class="pf-tab" id="tabVideos">VIDEOS</button>
        </div>

        <div class="pf-grid" id="pfPosts"></div>
        <div class="pf-grid" id="pfVideos" style="display:none;"></div>
      </div>

      <div id="pfLockedWrap"></div>
    </div>
  </main>

  <div class="pf-viewer" id="viewer">
    <div class="pf-viewer-bar">
      <button type="button" id="viewerClose" aria-label="Close">←</button>
      <button type="button" id="viewerDelete" style="display:none;" aria-label="Delete">🗑</button>
    </div>
    <video id="viewerVideo" controls playsinline></video>
    <div class="pf-viewer-cap" id="viewerCap"></div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="pulse.html" data-page="pulse">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>
      Pulse
    </a>
    <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="spaces.html" data-page="spaces">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Spaces
    </a>
    <a href="profile.html" data-page="profile" class="active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script type="module">
    import {
      db,
      doc, getDoc, updateDoc, deleteDoc, arrayUnion,
      collection, query, where, orderBy, onSnapshot,
      auth, updateProfile,
    } from './js/firebase-init.js';
    import { requireAuth, setActiveNav, logout, showToast, uploadToCloudinary } from './js/app.js';

    setActiveNav('profile');

    const params = new URLSearchParams(window.location.search);
    const viewedUid = params.get('uid'); // null => viewing your own profile

    const $ = (id) => document.getElementById(id);
    const els = {
      back: $('backBtn'), logoutBtn: $('logoutBtn'), settingsLink: $('settingsLink'),
      avatar: $('pfAvatar'), avatarText: $('pfAvatarText'), avatarFile: $('avatarFile'),
      name: $('pfName'), handle: $('pfHandle'), bio: $('pfBio'),
      statPosts: $('statPosts'), statFriends: $('statFriends'), statFollowers: $('statFollowers'),
      actions: $('pfActions'),
      bioEditWrap: $('bioEditWrap'), bioInput: $('bioInput'), bioCancel: $('bioCancel'), bioSave: $('bioSave'),
      content: $('pfContent'), lockedWrap: $('pfLockedWrap'),
      tabPosts: $('tabPosts'), tabVideos: $('tabVideos'),
      postsGrid: $('pfPosts'), videosGrid: $('pfVideos'),
      viewer: $('viewer'), viewerVideo: $('viewerVideo'), viewerCap: $('viewerCap'),
      viewerClose: $('viewerClose'), viewerDelete: $('viewerDelete'),
    };

    let postsCount = 0;
    let videosCount = 0;
    function updateStat() {
      els.statPosts.textContent = postsCount + videosCount;
      els.tabPosts.textContent = `PULSES (${postsCount})`;
      els.tabVideos.textContent = `VIDEOS (${videosCount})`;
    }

    function showTab(which) {
      const isPosts = which === 'posts';
      els.tabPosts.classList.toggle('active', isPosts);
      els.tabVideos.classList.toggle('active', !isPosts);
      els.postsGrid.style.display = isPosts ? 'grid' : 'none';
      els.videosGrid.style.display = isPosts ? 'none' : 'grid';
    }
    els.tabPosts.addEventListener('click', () => showTab('posts'));
    els.tabVideos.addEventListener('click', () => showTab('videos'));

    function initialsOf(name) {
      return (name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function setAvatar(photoURL, name) {
      els.avatarText.textContent = initialsOf(name);
      const existingImg = els.avatar.querySelector('img');
      if (photoURL) {
        if (existingImg) {
          existingImg.src = photoURL;
        } else {
          const img = document.createElement('img');
          img.src = photoURL;
          img.alt = '';
          els.avatar.insertBefore(img, els.avatarText);
          els.avatarText.style.display = 'none';
        }
      } else if (existingImg) {
        existingImg.remove();
        els.avatarText.style.display = '';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function setEmpty(grid, msg) {
      grid.innerHTML = `<p class="pf-empty">${msg}</p>`;
    }

    function indexMsg(err, what) {
      return err.code === 'failed-precondition'
        ? `${what} need a one-time Firestore index — check the browser console (F12) for a "Create Index" link, click it, then reload.`
        : `Could not load ${what.toLowerCase()} right now.`;
    }

    // ---------- Posts (text / photo) ----------
    function renderPostTile(id, post, isOwn) {
      const tile = document.createElement('div');
      tile.className = 'pf-tile';
      tile.innerHTML = post.mediaURL
        ? `<img src="${post.mediaURL}" alt="" loading="lazy" />`
        : `<div class="pf-text-tile">${escapeHtml(post.text)}</div>`;
      if (isOwn) tile.insertAdjacentHTML('beforeend', '<button type="button" class="pf-del" title="Delete">🗑</button>');

      tile.addEventListener('click', (e) => {
        if (e.target.closest('.pf-del')) return;
        window.location.href = `post-detail.html?id=${id}`;
      });

      const del = tile.querySelector('.pf-del');
      if (del) {
        del.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!window.confirm('Delete this pulse? This cannot be undone.')) return;
          try {
            await deleteDoc(doc(db, 'posts', id));
            showToast('Pulse deleted');
          } catch (err) {
            console.error(err);
            showToast('Could not delete. Please try again.');
          }
        });
      }
      return tile;
    }

    function loadPostsFor(uid, isOwn) {
      const q = query(collection(db, 'posts'), where('uid', '==', uid), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snap) => {
        postsCount = snap.size;
        updateStat();
        els.postsGrid.innerHTML = '';
        if (snap.empty) { setEmpty(els.postsGrid, 'No pulses shared yet.'); return; }
        snap.forEach((d) => els.postsGrid.appendChild(renderPostTile(d.id, d.data(), isOwn)));
      }, (err) => {
        console.error('Could not load posts:', err);
        setEmpty(els.postsGrid, indexMsg(err, 'Pulses'));
      });
    }

    // ---------- Videos (reels) ----------
    let openVideoId = null;

    function openViewer(id, reel, isOwn) {
      openVideoId = id;
      els.viewerVideo.src = reel.videoURL;
      els.viewerCap.textContent = reel.caption || '';
      els.viewerDelete.style.display = isOwn ? 'block' : 'none';
      els.viewer.classList.add('show');
      els.viewerVideo.play().catch(() => {});
    }
    function closeViewer() {
      els.viewerVideo.pause();
      els.viewerVideo.removeAttribute('src');
      els.viewerVideo.load();
      els.viewer.classList.remove('show');
      openVideoId = null;
    }
    els.viewerClose.addEventListener('click', closeViewer);
    els.viewerDelete.addEventListener('click', async () => {
      if (!openVideoId) return;
      if (!window.confirm('Delete this video? This cannot be undone.')) return;
      try {
        await deleteDoc(doc(db, 'reels', openVideoId));
        showToast('Video deleted');
        closeViewer();
      } catch (err) {
        console.error(err);
        showToast('Could not delete. Please try again.');
      }
    });

    function renderVideoTile(id, reel, isOwn) {
      const tile = document.createElement('div');
      tile.className = 'pf-tile';
      tile.innerHTML = `
        <video src="${reel.videoURL}#t=0.1" preload="metadata" muted playsinline></video>
        <span class="pf-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        ${isOwn ? '<button type="button" class="pf-del" title="Delete">🗑</button>' : ''}
      `;

      tile.addEventListener('click', (e) => {
        if (e.target.closest('.pf-del')) return;
        openViewer(id, reel, isOwn);
      });

      const del = tile.querySelector('.pf-del');
      if (del) {
        del.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!window.confirm('Delete this video? This cannot be undone.')) return;
          try {
            await deleteDoc(doc(db, 'reels', id));
            showToast('Video deleted');
          } catch (err) {
            console.error(err);
            showToast('Could not delete. Please try again.');
          }
        });
      }
      return tile;
    }

    function loadVideosFor(uid, isOwn) {
      const q = query(collection(db, 'reels'), where('uid', '==', uid), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snap) => {
        videosCount = snap.size;
        updateStat();
        els.videosGrid.innerHTML = '';
        if (snap.empty) { setEmpty(els.videosGrid, 'No videos shared yet.'); return; }
        snap.forEach((d) => els.videosGrid.appendChild(renderVideoTile(d.id, d.data(), isOwn)));
      }, (err) => {
        console.error('Could not load videos:', err);
        setEmpty(els.videosGrid, indexMsg(err, 'Videos'));
      });
    }

    // ---------- Actions ----------
    function renderOwnActions() {
      els.actions.innerHTML = `
        <button type="button" class="btn btn-outline btn-block" id="editBioBtn">Edit Bio</button>
      `;
      $('editBioBtn').addEventListener('click', () => {
        els.bioEditWrap.style.display = 'block';
        els.bioInput.value = els.bio.textContent.trim();
        els.bioInput.focus();
      });
    }

    async function renderOtherActions(currentUser, targetUid, targetProfile) {
      const theirFriends = Array.isArray(targetProfile.friends) ? targetProfile.friends : [];
      const pendingOnTarget = Array.isArray(targetProfile.friendRequests) ? targetProfile.friendRequests : [];

      let state = 'none';
      if (theirFriends.includes(currentUser.uid)) state = 'friends';
      else if (pendingOnTarget.includes(currentUser.uid)) state = 'pending';

      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-block';
      btn.id = 'friendBtn';

      if (state === 'friends') {
        btn.textContent = 'Friends ✓';
        btn.classList.replace('btn-primary', 'btn-outline');
        btn.disabled = true;
      } else if (state === 'pending') {
        btn.textContent = 'Request Sent';
        btn.classList.replace('btn-primary', 'btn-outline');
        btn.disabled = true;
      } else {
        btn.textContent = 'Add Friend';
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Sending…';
          try {
            await updateDoc(doc(db, 'users', targetUid), {
              friendRequests: arrayUnion(currentUser.uid),
            });
            btn.textContent = 'Request Sent';
            btn.classList.replace('btn-primary', 'btn-outline');
            showToast('Friend request sent ✦');
          } catch (err) {
            console.error(err);
            btn.disabled = false;
            btn.textContent = 'Add Friend';
            showToast('Could not send request. Try again.');
          }
        });
      }

      els.actions.innerHTML = '';
      els.actions.appendChild(btn);

      if (state === 'friends') {
        const msgBtn = document.createElement('a');
        msgBtn.href = 'messages.html';
        msgBtn.className = 'btn btn-primary btn-block';
        msgBtn.textContent = 'Message';
        els.actions.appendChild(msgBtn);
      }

      const blockBtn = document.createElement('button');
      blockBtn.type = 'button';
      blockBtn.textContent = 'Block';
      blockBtn.style.cssText = 'margin-top:10px; font-size:12px; color:var(--text-muted); text-decoration:underline; background:none;';
      blockBtn.addEventListener('click', async () => {
        if (!window.confirm('Block this user? They will be hidden from your Search list and feed.')) return;
        try {
          await updateDoc(doc(db, 'users', currentUser.uid), { blocked: arrayUnion(targetUid) });
          showToast('User blocked');
          window.location.href = 'search.html';
        } catch (err) {
          console.error(err);
          showToast('Could not block user.');
        }
      });
      els.actions.appendChild(blockBtn);
    }

    els.bioCancel.addEventListener('click', () => { els.bioEditWrap.style.display = 'none'; });

    els.bioSave.addEventListener('click', async () => {
      const newBio = els.bioInput.value.trim();
      els.bioSave.disabled = true;
      try {
        await updateDoc(doc(db, 'users', els.bioSave.dataset.uid), { bio: newBio });
        els.bio.textContent = newBio;
        els.bioEditWrap.style.display = 'none';
        showToast('Bio updated');
      } catch (err) {
        console.error(err);
        showToast('Could not save bio.');
      } finally {
        els.bioSave.disabled = false;
      }
    });

    els.logoutBtn.addEventListener('click', () => logout());

    els.avatarFile.addEventListener('change', async () => {
      const file = els.avatarFile.files[0];
      if (!file || !auth.currentUser) return;

      if (file.size > 5 * 1024 * 1024) {
        showToast('Please choose an image under 5MB.');
        return;
      }

      els.avatar.classList.add('pf-avatar-uploading');
      try {
        const url = await uploadToCloudinary(file, 'gaivex/avatars', 30000);
        await updateDoc(doc(db, 'users', auth.currentUser.uid), { photoURL: url });
        await updateProfile(auth.currentUser, { photoURL: url });
        setAvatar(url, els.name.textContent);
        showToast('Profile picture updated ✦');
      } catch (err) {
        console.error(err);
        showToast(err?.message || 'Could not upload photo. Please try again.');
      } finally {
        els.avatar.classList.remove('pf-avatar-uploading');
        els.avatarFile.value = '';
      }
    });

    (async () => {
      const currentUser = await requireAuth();
      if (!currentUser) return;

      const isOwn = !viewedUid || viewedUid === currentUser.uid;
      const targetUid = isOwn ? currentUser.uid : viewedUid;

      els.back.classList.toggle('show', !isOwn);
      els.logoutBtn.style.display = isOwn ? 'block' : 'none';
      els.settingsLink.style.display = isOwn ? 'inline' : 'none';
      els.bioSave.dataset.uid = targetUid;
      updateStat();

      try {
        const snap = await getDoc(doc(db, 'users', targetUid));
        const profile = snap.exists() ? snap.data() : {};
        const displayName = isOwn
          ? (currentUser.displayName || currentUser.email.split('@')[0])
          : (profile.username || 'GAIVEX user');

        els.avatar.classList.toggle('own', isOwn);
        setAvatar(profile.photoURL || (isOwn ? currentUser.photoURL : ''), displayName);
        els.name.textContent = displayName;
        els.handle.textContent = isOwn ? currentUser.email : (profile.email || '');
        els.bio.textContent = profile.bio || (isOwn ? 'Add a short bio to tell people about yourself.' : '');
        els.statFriends.textContent = Array.isArray(profile.friends) ? profile.friends.length : 0;
        els.statFollowers.textContent = Array.isArray(profile.followers) ? profile.followers.length : 0;

        if (isOwn) renderOwnActions();
        else renderOtherActions(currentUser, targetUid, profile);

        const friends = Array.isArray(profile.friends) ? profile.friends : [];
        const isFriend = friends.includes(currentUser.uid);
        const isLocked = !isOwn && !!profile.settings?.isPrivate && !isFriend;

        if (isLocked) {
          els.content.style.display = 'none';
          els.lockedWrap.innerHTML = '<div class="pf-empty" style="padding:28px 0;">🔒 This account is private.<br>Add them as a friend to see their pulses.</div>';
        } else {
          loadPostsFor(targetUid, isOwn);
          loadVideosFor(targetUid, isOwn);
        }
      } catch (err) {
        console.error(err);
        showToast('Could not load this profile.');
        loadPostsFor(targetUid, isOwn);
        loadVideosFor(targetUid, isOwn);
      }
    })();
  </script>
</body>
</html>
