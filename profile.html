<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .pf-top { justify-content: space-between; }
    .pf-top .back { font-size: 20px; color: var(--text-secondary); visibility: hidden; }
    .pf-top .back.show { visibility: visible; }
    .pf-top button.icon-only { font-size: 13px; color: var(--text-secondary); font-weight: 600; }

    .pf-body { padding: 20px 16px; max-width: 560px; margin: 0 auto; }

    .pf-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 20px; }
    .pf-avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 800; color: #fff;
      box-shadow: var(--shadow-glow);
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .pf-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pf-avatar-edit {
      position: absolute;
      bottom: 8px; right: -2px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2px solid var(--bg-void);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .pf-avatar-edit svg { width: 14px; height: 14px; stroke: var(--cyan); }
    .pf-avatar.own .pf-avatar-edit { display: flex; }
    .pf-avatar-uploading { opacity: 0.5; pointer-events: none; }
    .pf-name { font-size: 19px; font-weight: 700; }
    .pf-handle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .pf-bio { margin-top: 10px; font-size: 13.5px; color: var(--text-secondary); max-width: 320px; line-height: 1.5; }

    .pf-stats {
      display: flex; justify-content: center; gap: 28px;
      margin: 18px 0 16px;
    }
    .pf-stat { text-align: center; }
    .pf-stat b { display: block; font-size: 16px; font-weight: 700; }
    .pf-stat span { font-size: 11.5px; color: var(--text-muted); }

    .pf-actions { display: flex; gap: 10px; width: 100%; max-width: 320px; }

    .pf-bio-edit {
      display: none;
      width: 100%;
      margin-top: 10px;
    }
    .pf-bio-edit textarea {
      width: 100%;
      min-height: 64px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13.5px;
      padding: 10px 12px;
      font-family: inherit;
      resize: vertical;
      outline: none;
    }
    .pf-bio-edit .row { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
    .pf-bio-edit .row button {
      height: 34px; padding: 0 16px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 600;
    }

    .pf-section-title {
      font-size: 13px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin: 28px 0 12px;
    }

    .pf-posts { display: flex; flex-direction: column; gap: 14px; }
    .pf-post { padding: 14px; }
    .pf-post p { font-size: 13.5px; line-height: 1.5; }
    .pf-post .pf-post-time { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }
    .pf-post img { width: 100%; border-radius: var(--radius-sm); margin-top: 10px; max-height: 220px; object-fit: cover; }

    .pf-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar pf-top">
    <a href="home.html" class="back" id="backBtn">←</a>
    <span class="brand-logo" style="font-size:16px;">Profile</span>
    <div style="display:flex; align-items:center; gap:14px;">
      <a href="settings.html" id="settingsLink" aria-label="Settings" style="color:var(--text-secondary); font-size:18px;">⚙</a>
      <button type="button" class="icon-only" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="page">
    <div class="pf-body">
      <div class="pf-head">
        <div class="pf-avatar" id="pfAvatar">
          <span id="pfAvatarText">?</span>
          <label class="pf-avatar-edit" for="avatarFile" aria-label="Change profile picture">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
          </label>
          <input type="file" id="avatarFile" accept="image/*" style="display:none;" />
        </div>
        <div class="pf-name" id="pfName">…</div>
        <div class="pf-handle" id="pfHandle"></div>
        <p class="pf-bio" id="pfBio"></p>

        <div class="pf-stats">
          <div class="pf-stat"><b id="statPosts">0</b><span>Pulses</span></div>
          <div class="pf-stat"><b id="statFriends">0</b><span>Friends</span></div>
          <div class="pf-stat"><b id="statFollowers">0</b><span>Followers</span></div>
        </div>

        <div class="pf-actions" id="pfActions"></div>

        <div class="pf-bio-edit" id="bioEditWrap">
          <textarea id="bioInput" maxlength="140" placeholder="Add a short bio…"></textarea>
          <div class="row">
            <button type="button" class="btn btn-outline" id="bioCancel">Cancel</button>
            <button type="button" class="btn btn-primary" id="bioSave">Save</button>
          </div>
        </div>
      </div>

      <div class="pf-section-title" id="postsTitle">Pulses</div>
      <div class="pf-posts" id="pfPosts"></div>
      <p class="pf-empty" id="pfEmpty" style="display:none;">No pulses shared yet.</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="explore.html" data-page="explore">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Explore
    </a>
    <a href="create-pulse.html" class="nav-fab" aria-label="Create pulse">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="spaces.html" data-page="spaces">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Spaces
    </a>
    <a href="profile.html" data-page="profile" class="active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script type="module">
    import {
      db, storage,
      doc, getDoc, updateDoc, arrayUnion,
      collection, query, where, orderBy, onSnapshot,
      storageRef, uploadBytes, getDownloadURL,
      auth, updateProfile,
    } from './js/firebase-init.js';
    import { requireAuth, setActiveNav, logout, showToast } from './js/app.js';

    setActiveNav('profile');

    const params = new URLSearchParams(window.location.search);
    const viewedUid = params.get('uid'); // null => viewing your own profile

    const els = {
      back: document.getElementById('backBtn'),
      logoutBtn: document.getElementById('logoutBtn'),
      settingsLink: document.getElementById('settingsLink'),
      avatar: document.getElementById('pfAvatar'),
      avatarText: document.getElementById('pfAvatarText'),
      avatarFile: document.getElementById('avatarFile'),
      name: document.getElementById('pfName'),
      handle: document.getElementById('pfHandle'),
      bio: document.getElementById('pfBio'),
      statPosts: document.getElementById('statPosts'),
      statFriends: document.getElementById('statFriends'),
      statFollowers: document.getElementById('statFollowers'),
      actions: document.getElementById('pfActions'),
      bioEditWrap: document.getElementById('bioEditWrap'),
      bioInput: document.getElementById('bioInput'),
      bioCancel: document.getElementById('bioCancel'),
      bioSave: document.getElementById('bioSave'),
      postsTitle: document.getElementById('postsTitle'),
      postsList: document.getElementById('pfPosts'),
      postsEmpty: document.getElementById('pfEmpty'),
    };

    function initialsOf(name) {
      return (name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function setAvatar(photoURL, name) {
      els.avatarText.textContent = initialsOf(name);
      const existingImg = els.avatar.querySelector('img');
      if (photoURL) {
        if (existingImg) {
          existingImg.src = photoURL;
        } else {
          const img = document.createElement('img');
          img.src = photoURL;
          img.alt = '';
          els.avatar.insertBefore(img, els.avatarText);
          els.avatarText.style.display = 'none';
        }
      } else if (existingImg) {
        existingImg.remove();
        els.avatarText.style.display = '';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function timeAgo(ts) {
      if (!ts || !ts.toDate) return '';
      const mins = Math.floor((Date.now() - ts.toDate().getTime()) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function renderPost(post) {
      const div = document.createElement('article');
      div.className = 'card pf-post';
      div.innerHTML = `
        ${post.text ? `<p>${escapeHtml(post.text)}</p>` : ''}
        ${post.mediaURL ? `<img src="${post.mediaURL}" alt="" />` : ''}
        <div class="pf-post-time">${timeAgo(post.createdAt)}</div>
      `;
      return div;
    }

    function loadPostsFor(uid) {
      const q = query(collection(db, 'posts'), where('uid', '==', uid), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snap) => {
        els.postsList.innerHTML = '';
        els.statPosts.textContent = snap.size;
        if (snap.empty) {
          els.postsEmpty.style.display = 'block';
          return;
        }
        els.postsEmpty.style.display = 'none';
        snap.forEach((d) => els.postsList.appendChild(renderPost(d.data())));
      }, (err) => console.warn('Could not load posts:', err));
    }

    function renderOwnActions() {
      els.actions.innerHTML = `
        <button type="button" class="btn btn-outline btn-block" id="editBioBtn">Edit Bio</button>
      `;
      document.getElementById('editBioBtn').addEventListener('click', () => {
        els.bioEditWrap.style.display = 'block';
        els.bioInput.value = els.bio.textContent.trim();
        els.bioInput.focus();
      });
    }

    async function renderOtherActions(currentUser, targetUid, targetProfile) {
      const myFriends = Array.isArray(targetProfile.friends) ? targetProfile.friends : [];
      const pendingOnTarget = Array.isArray(targetProfile.friendRequests) ? targetProfile.friendRequests : [];

      let state = 'none';
      if (myFriends.includes(currentUser.uid)) state = 'friends';
      else if (pendingOnTarget.includes(currentUser.uid)) state = 'pending';

      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-block';
      btn.id = 'friendBtn';

      if (state === 'friends') {
        btn.textContent = 'Friends ✓';
        btn.classList.replace('btn-primary', 'btn-outline');
        btn.disabled = true;
      } else if (state === 'pending') {
        btn.textContent = 'Request Sent';
        btn.classList.replace('btn-primary', 'btn-outline');
        btn.disabled = true;
      } else {
        btn.textContent = 'Add Friend';
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Sending…';
          try {
            await updateDoc(doc(db, 'users', targetUid), {
              friendRequests: arrayUnion(currentUser.uid),
            });
            btn.textContent = 'Request Sent';
            btn.classList.replace('btn-primary', 'btn-outline');
            showToast('Friend request sent ✦');
          } catch (err) {
            console.error(err);
            btn.disabled = false;
            btn.textContent = 'Add Friend';
            showToast('Could not send request. Try again.');
          }
        });
      }

      els.actions.innerHTML = '';
      els.actions.appendChild(btn);

      if (state === 'friends') {
        const msgBtn = document.createElement('a');
        msgBtn.href = 'messages.html';
        msgBtn.className = 'btn btn-primary btn-block';
        msgBtn.textContent = 'Message';
        els.actions.appendChild(msgBtn);
      }
    }

    els.bioCancel.addEventListener('click', () => {
      els.bioEditWrap.style.display = 'none';
    });

    els.bioSave.addEventListener('click', async () => {
      const uid = viewedUid || els.bioSave.dataset.uid;
      const newBio = els.bioInput.value.trim();
      els.bioSave.disabled = true;
      try {
        await updateDoc(doc(db, 'users', els.bioSave.dataset.uid), { bio: newBio });
        els.bio.textContent = newBio;
        els.bioEditWrap.style.display = 'none';
        showToast('Bio updated');
      } catch (err) {
        console.error(err);
        showToast('Could not save bio.');
      } finally {
        els.bioSave.disabled = false;
      }
    });

    els.logoutBtn.addEventListener('click', () => logout());

    els.avatarFile.addEventListener('change', async () => {
      const file = els.avatarFile.files[0];
      if (!file || !auth.currentUser) return;

      if (file.size > 5 * 1024 * 1024) {
        showToast('Please choose an image under 5MB.');
        return;
      }

      els.avatar.classList.add('pf-avatar-uploading');
      try {
        const path = `avatars/${auth.currentUser.uid}/profile.jpg`;
        const ref = storageRef(storage, path);
        await uploadBytes(ref, file);
        const url = await getDownloadURL(ref);

        await updateDoc(doc(db, 'users', auth.currentUser.uid), { photoURL: url });
        await updateProfile(auth.currentUser, { photoURL: url });

        setAvatar(url, els.name.textContent);
        showToast('Profile picture updated ✦');
      } catch (err) {
        console.error(err);
        showToast('Could not upload photo. Please try again.');
      } finally {
        els.avatar.classList.remove('pf-avatar-uploading');
        els.avatarFile.value = '';
      }
    });

    (async () => {
      const currentUser = await requireAuth();
      if (!currentUser) return;

      const isOwn = !viewedUid || viewedUid === currentUser.uid;
      const targetUid = isOwn ? currentUser.uid : viewedUid;

      els.back.classList.toggle('show', !isOwn);
      els.logoutBtn.style.display = isOwn ? 'block' : 'none';
      els.settingsLink.style.display = isOwn ? 'inline' : 'none';
      els.postsTitle.textContent = isOwn ? 'My Pulses' : 'Pulses';
      els.bioSave.dataset.uid = targetUid;

      try {
        const snap = await getDoc(doc(db, 'users', targetUid));
        const profile = snap.exists() ? snap.data() : {};
        const displayName = isOwn
          ? (currentUser.displayName || currentUser.email.split('@')[0])
          : (profile.username || 'GAIVEX user');

        els.avatar.classList.toggle('own', isOwn);
        setAvatar(profile.photoURL || (isOwn ? currentUser.photoURL : ''), displayName);
        els.name.textContent = displayName;
        els.handle.textContent = isOwn ? currentUser.email : (profile.email || '');
        els.bio.textContent = profile.bio || (isOwn ? 'Add a short bio to tell people about yourself.' : '');
        els.statFriends.textContent = Array.isArray(profile.friends) ? profile.friends.length : 0;
        els.statFollowers.textContent = Array.isArray(profile.followers) ? profile.followers.length : 0;

        if (isOwn) {
          renderOwnActions();
        } else {
          renderOtherActions(currentUser, targetUid, profile);
        }

        const friends = Array.isArray(profile.friends) ? profile.friends : [];
        const isFriend = friends.includes(currentUser.uid);
        const isLocked = !isOwn && !!profile.settings?.isPrivate && !isFriend;

        if (isLocked) {
          els.postsList.innerHTML = '';
          els.postsEmpty.style.display = 'none';
          const lock = document.createElement('div');
          lock.className = 'pf-empty';
          lock.innerHTML = '🔒 This account is private.<br>Add them as a friend to see their pulses.';
          els.postsList.parentElement.insertBefore(lock, els.postsList.nextSibling);
        } else {
          loadPostsFor(targetUid);
        }
      } catch (err) {
        console.error(err);
        showToast('Could not load this profile.');
        loadPostsFor(targetUid);
      }
    })();
  </script>
</body>
</html>
