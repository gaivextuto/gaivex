<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reels - GAIVEX</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }
    .reels-container {
      height: calc(100vh - 65px); /* Bottom navbar space */
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
    }
    .reels-container::-webkit-scrollbar {
      display: none; /* Chrome, Safari */
    }
    .reel-card {
      height: calc(100vh - 65px);
      width: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0f17;
    }
    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .reel-overlay {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 70px;
      color: #fff;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .reel-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .reel-user img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #3b82f6;
    }
    .reel-actions {
      position: absolute;
      right: 15px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }
    .action-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: none;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- Reels Feed Container -->
  <div class="reels-container" id="reelsFeed">
    <!-- Videos will be injected dynamically via JavaScript -->
  </div>

  <!-- Include Firebase & JS Scripts -->
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/reels.js"></script>
</body>
</html>
