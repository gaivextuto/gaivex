<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Create Pulse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .cp-top { justify-content: space-between; }
    .cp-close { font-size: 22px; color: var(--text-secondary); }
    .cp-post-btn {
      height: 36px; padding: 0 18px; border-radius: var(--radius-pill);
      background: var(--grad-brand); color: #fff; font-size: 13.5px; font-weight: 700;
    }
    .cp-post-btn[disabled] { opacity: 0.45; pointer-events: none; }

    .cp-body { padding: 16px; max-width: 560px; margin: 0 auto; }

    .cp-who {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .cp-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    .cp-name { font-size: 14px; font-weight: 600; }
    .cp-scope { font-size: 11.5px; color: var(--text-muted); }

    textarea {
      width: 100%;
      min-height: 130px;
      background: transparent;
      border: none;
      outline: none;
      resize: vertical;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--text-muted); }

    .cp-preview {
      position: relative;
      margin-top: 14px;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: none;
    }
    .cp-preview img, .cp-preview video { width: 100%; display: block; max-height: 400px; object-fit: cover; }
    .cp-preview .remove-media {
      position: absolute; top: 10px; right: 10px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.55);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .cp-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
    }
    .cp-tool {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .cp-tool svg { width: 18px; height: 18px; stroke: var(--cyan); }
    .cp-char-count { margin-left: auto; font-size: 12px; color: var(--text-muted); }

    .cp-error {
      display: none;
      margin-top: 14px;
      font-size: 12.5px;
      color: #fda4af;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
    }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar cp-top">
    <a href="home.html" class="cp-close" aria-label="Close">×</a>
    <span class="brand-logo" style="font-size:16px;">New Pulse</span>
    <button type="button" class="cp-post-btn" id="postBtn" disabled>Post Pulse</button>
  </header>

  <main class="cp-body">
    <div class="cp-who">
      <div class="cp-avatar" id="cpAvatar">?</div>
      <div>
        <div class="cp-name" id="cpName">…</div>
        <div class="cp-scope">Visible to everyone on GAIVEX</div>
      </div>
    </div>

    <textarea id="cpText" placeholder="What's happening in your universe?" maxlength="500"></textarea>

    <div class="cp-preview" id="cpPreview">
      <img id="cpPreviewImg" alt="Attached image preview" style="display:none;" />
      <video id="cpPreviewVideo" muted autoplay loop playsinline style="display:none;"></video>
      <button type="button" class="remove-media" id="removeMedia">×</button>
    </div>

    <p class="cp-error" id="cpError"></p>

    <div class="cp-toolbar">
      <label class="cp-tool" for="cpFile" aria-label="Add photo or video">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </label>
      <input type="file" id="cpFile" accept="image/*,video/*" style="display:none;" />
      <span style="font-size:11px; color:var(--text-muted);">Photos &amp; short videos</span>
      <span class="cp-char-count" id="charCount">0 / 500</span>
    </div>
  </main>

  <script type="module">
    import {
      db, storage,
      collection, addDoc, serverTimestamp,
      storageRef, uploadBytes, getDownloadURL,
    } from './js/firebase-init.js';
    import { requireAuth, showToast } from './js/app.js';

    let currentUser = null;
    let selectedFile = null;
    let selectedIsVideo = false;

    const els = {
      avatar: document.getElementById('cpAvatar'),
      name: document.getElementById('cpName'),
      text: document.getElementById('cpText'),
      postBtn: document.getElementById('postBtn'),
      file: document.getElementById('cpFile'),
      preview: document.getElementById('cpPreview'),
      previewImg: document.getElementById('cpPreviewImg'),
      previewVideo: document.getElementById('cpPreviewVideo'),
      removeMedia: document.getElementById('removeMedia'),
      charCount: document.getElementById('charCount'),
      error: document.getElementById('cpError'),
    };

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      currentUser = user;
      const initials = (user.displayName || user.email || '?')
        .trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
      els.avatar.textContent = initials || '?';
      els.name.textContent = user.displayName || user.email.split('@')[0];
    })();

    function updatePostButton() {
      const hasContent = els.text.value.trim().length > 0 || !!selectedFile;
      els.postBtn.disabled = !hasContent;
    }

    els.text.addEventListener('input', () => {
      els.charCount.textContent = `${els.text.value.length} / 500`;
      updatePostButton();
    });

    els.file.addEventListener('change', () => {
      const file = els.file.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith('video/');

      if (isVideo && file.size > 60 * 1024 * 1024) {
        showToast('That video is quite large — try one under 60MB.');
      }

      selectedFile = file;
      selectedIsVideo = isVideo;
      const url = URL.createObjectURL(file);

      if (isVideo) {
        els.previewImg.style.display = 'none';
        els.previewVideo.src = url;
        els.previewVideo.style.display = 'block';
      } else {
        els.previewVideo.style.display = 'none';
        els.previewImg.src = url;
        els.previewImg.style.display = 'block';
      }
      els.preview.style.display = 'block';
      updatePostButton();
    });

    els.removeMedia.addEventListener('click', () => {
      selectedFile = null;
      selectedIsVideo = false;
      els.file.value = '';
      els.preview.style.display = 'none';
      els.previewImg.style.display = 'none';
      els.previewVideo.style.display = 'none';
      updatePostButton();
    });

    function showError(msg) {
      els.error.textContent = msg;
      els.error.style.display = 'block';
    }

    // Storage uploads can hang (blocked CORS, storage not enabled, etc.) instead of
    // throwing quickly — race against a timeout so the button never gets stuck forever.
    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(
          () => reject(new Error(`timeout:${label}`)), ms
        )),
      ]);
    }

    function friendlyUploadError(err) {
      const msg = String(err?.message || err?.code || '');
      if (msg.startsWith('timeout:')) {
        return "Upload is taking too long — this is usually the browser opening the file directly (file:// address bar). Serve the site over http(s) — e.g. a local server, or your Cloudflare Pages URL — and try again.";
      }
      if (err?.code === 'storage/unauthorized') {
        return 'Upload blocked by Storage Rules — check the reels/pulses rules are published.';
      }
      if (err?.code === 'storage/unknown' || msg.includes('CORS') || msg.includes('Failed to fetch')) {
        return 'Upload blocked — make sure Firebase Storage is enabled for this project, and that you are viewing the site over http(s), not by opening the file directly.';
      }
      return 'Could not upload right now. Please try again.';
    }

    els.postBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      els.error.style.display = 'none';
      els.postBtn.disabled = true;
      els.postBtn.textContent = selectedIsVideo ? 'Uploading video…' : (selectedFile ? 'Uploading photo…' : 'Posting…');

      try {
        if (selectedIsVideo) {
          // Short video → goes to the "reels" collection and shows up in the Pulse tab.
          const path = `reels/${currentUser.uid}/${Date.now()}_${selectedFile.name}`;
          const ref = storageRef(storage, path);
          await withTimeout(uploadBytes(ref, selectedFile), 45000, 'video-upload');
          const videoURL = await withTimeout(getDownloadURL(ref), 15000, 'video-url');

          await addDoc(collection(db, 'reels'), {
            uid: currentUser.uid,
            authorName: currentUser.displayName || currentUser.email.split('@')[0],
            authorPhoto: currentUser.photoURL || '',
            videoURL,
            caption: els.text.value.trim(),
            likes: [],
            commentsCount: 0,
            createdAt: serverTimestamp(),
          });

          showToast('Added to Pulse ✦');
          window.location.href = 'pulse.html';
        } else {
          // Text / photo → goes to the "posts" collection and shows up in the Home feed.
          let mediaURL = '';
          if (selectedFile) {
            const path = `pulses/${currentUser.uid}/${Date.now()}_${selectedFile.name}`;
            const ref = storageRef(storage, path);
            await withTimeout(uploadBytes(ref, selectedFile), 30000, 'image-upload');
            mediaURL = await withTimeout(getDownloadURL(ref), 15000, 'image-url');
          }

          await addDoc(collection(db, 'posts'), {
            uid: currentUser.uid,
            authorName: currentUser.displayName || currentUser.email.split('@')[0],
            authorPhoto: currentUser.photoURL || '',
            text: els.text.value.trim(),
            mediaURL,
            likes: [],
            commentsCount: 0,
            createdAt: serverTimestamp(),
          });

          showToast('Pulse posted ✦');
          window.location.href = 'home.html';
        }
      } catch (err) {
        console.error(err);
        showError(friendlyUploadError(err));
        els.postBtn.disabled = false;
        els.postBtn.textContent = 'Post Pulse';
      }
    });
  </script>
</body>
</html>
