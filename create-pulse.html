<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GAIVEX — Create</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .cp-top { justify-content: space-between; }
    .cp-close { font-size: 22px; color: var(--text-secondary); width: 60px; }
    .cp-post-btn {
      height: 36px; padding: 0 18px; border-radius: var(--radius-pill);
      background: var(--grad-brand); color: #fff; font-size: 13.5px; font-weight: 700;
    }
    .cp-post-btn[disabled] { opacity: 0.45; pointer-events: none; }
    .cp-spacer { width: 60px; display: flex; justify-content: flex-end; }

    .cp-body { padding: 16px; max-width: 560px; margin: 0 auto; }

    /* ---------- Create menu (chooser) ---------- */
    .cm-title { font: 700 18px Sora, sans-serif; margin: 6px 0 4px; }
    .cm-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
    .cm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cm-item {
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
      padding: 18px 16px; text-decoration: none; color: var(--text-primary);
      text-align: left; width: 100%;
    }
    .cm-item:active { transform: scale(0.97); }
    .cm-ic {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      background: var(--grad-brand);
    }
    .cm-item[data-kind="live"] .cm-ic { background: linear-gradient(135deg, #ff3b5c, #ff7a59); }
    .cm-item[data-kind="video"] .cm-ic { background: var(--grad-brand); }
    .cm-item[data-kind="post"] .cm-ic { background: linear-gradient(135deg, #22d3ee, #6366f1); }
    .cm-item[data-kind="event"] .cm-ic { background: linear-gradient(135deg, #ffc857, #ff7a59); }
    .cm-label { font: 700 15px Sora, sans-serif; }
    .cm-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

    /* ---------- Composer ---------- */
    .cp-who { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .cp-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--grad-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    .cp-name { font-size: 14px; font-weight: 600; }
    .cp-scope { font-size: 11.5px; color: var(--text-muted); }

    textarea {
      width: 100%;
      min-height: 130px;
      background: transparent;
      border: none;
      outline: none;
      resize: vertical;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--text-muted); }

    .cp-preview {
      position: relative;
      margin-top: 14px;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: none;
    }
    .cp-preview img, .cp-preview video { width: 100%; display: block; max-height: 400px; object-fit: cover; }
    .cp-preview .remove-media {
      position: absolute; top: 10px; right: 10px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.55);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .cp-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
    }
    .cp-tool {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .cp-tool svg { width: 18px; height: 18px; stroke: var(--cyan); }
    .cp-char-count { margin-left: auto; font-size: 12px; color: var(--text-muted); }

    .cp-error {
      display: none;
      margin-top: 14px;
      font-size: 12.5px;
      color: #fda4af;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="bg-cosmic"></div>

  <header class="top-bar cp-top">
    <a href="home.html" class="cp-close" id="cpClose" aria-label="Close">×</a>
    <span class="brand-logo" id="cpTitle" style="font-size:16px;">Create</span>
    <div class="cp-spacer">
      <button type="button" class="cp-post-btn hidden" id="postBtn" disabled>Post</button>
    </div>
  </header>

  <main class="cp-body">

    <!-- ===== Create menu ===== -->
    <section id="chooser">
      <h1 class="cm-title">Create</h1>
      <p class="cm-sub">What would you like to share with your universe?</p>
      <div class="cm-grid">
        <a href="live.html" class="card cm-item" data-kind="live">
          <span class="cm-ic">🔴</span>
          <span class="cm-label">Live</span>
          <span class="cm-desc">Go live and stream in real time</span>
        </a>
        <button type="button" class="card cm-item" data-kind="video" data-mode="video">
          <span class="cm-ic">🎬</span>
          <span class="cm-label">Pulse Video</span>
          <span class="cm-desc">Share a short video in Pulse</span>
        </button>
        <button type="button" class="card cm-item" data-kind="post" data-mode="post">
          <span class="cm-ic">✍️</span>
          <span class="cm-label">Post</span>
          <span class="cm-desc">Text or photo for your feed</span>
        </button>
        <a href="events.html" class="card cm-item" data-kind="event">
          <span class="cm-ic">📅</span>
          <span class="cm-label">Event</span>
          <span class="cm-desc">Create or discover events</span>
        </a>
      </div>
    </section>

    <!-- ===== Composer (Post / Pulse Video) ===== -->
    <section id="composer" class="hidden">
      <div class="cp-who">
        <div class="cp-avatar" id="cpAvatar">?</div>
        <div>
          <div class="cp-name" id="cpName">…</div>
          <div class="cp-scope" id="cpScope">Visible to everyone on GAIVEX</div>
        </div>
      </div>

      <textarea id="cpText" placeholder="What's happening in your universe?" maxlength="500"></textarea>

      <div class="cp-preview" id="cpPreview">
        <img id="cpPreviewImg" alt="Attached image preview" style="display:none;" />
        <video id="cpPreviewVideo" muted autoplay loop playsinline style="display:none;"></video>
        <button type="button" class="remove-media" id="removeMedia">×</button>
      </div>

      <p class="cp-error" id="cpError"></p>

      <div class="cp-toolbar">
        <label class="cp-tool" for="cpFile" aria-label="Add media" id="cpToolLabel">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </label>
        <input type="file" id="cpFile" accept="image/*" style="display:none;" />
        <span style="font-size:11px; color:var(--text-muted);" id="cpHint">Add a photo</span>
        <span class="cp-char-count" id="charCount">0 / 500</span>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      db,
      collection, addDoc, serverTimestamp,
    } from './js/firebase-init.js';
    import { requireAuth, showToast, uploadToCloudinary } from './js/app.js';

    let currentUser = null;
    let selectedFile = null;
    let selectedIsVideo = false;
    let mode = null; // 'post' | 'video' | null (menu)

    const $ = (id) => document.getElementById(id);
    const els = {
      chooser: $('chooser'),
      composer: $('composer'),
      title: $('cpTitle'),
      close: $('cpClose'),
      avatar: $('cpAvatar'),
      name: $('cpName'),
      scope: $('cpScope'),
      text: $('cpText'),
      postBtn: $('postBtn'),
      file: $('cpFile'),
      hint: $('cpHint'),
      preview: $('cpPreview'),
      previewImg: $('cpPreviewImg'),
      previewVideo: $('cpPreviewVideo'),
      removeMedia: $('removeMedia'),
      charCount: $('charCount'),
      error: $('cpError'),
    };

    /* ---------- Menu <-> composer ---------- */
    function resetComposer() {
      selectedFile = null;
      selectedIsVideo = false;
      els.text.value = '';
      els.charCount.textContent = '0 / 500';
      els.file.value = '';
      els.preview.style.display = 'none';
      els.previewImg.style.display = 'none';
      els.previewVideo.style.display = 'none';
      els.previewVideo.removeAttribute('src');
      els.error.style.display = 'none';
    }

    function showMenu() {
      mode = null;
      resetComposer();
      els.composer.classList.add('hidden');
      els.postBtn.classList.add('hidden');
      els.chooser.classList.remove('hidden');
      els.title.textContent = 'Create';
      history.replaceState(null, '', location.pathname);
    }

    function openComposer(m) {
      mode = m;
      resetComposer();
      els.chooser.classList.add('hidden');
      els.composer.classList.remove('hidden');
      els.postBtn.classList.remove('hidden');

      if (m === 'video') {
        els.title.textContent = 'Pulse Video';
        els.postBtn.textContent = 'Post Video';
        els.file.accept = 'video/*';
        els.hint.textContent = 'Add a short video';
        els.text.placeholder = 'Write a caption…';
        els.scope.textContent = 'Shows up in the Pulse tab';
      } else {
        els.title.textContent = 'New Post';
        els.postBtn.textContent = 'Post';
        els.file.accept = 'image/*';
        els.hint.textContent = 'Add a photo';
        els.text.placeholder = "What's happening in your universe?";
        els.scope.textContent = 'Visible to everyone on GAIVEX';
      }
      updatePostButton();
      history.replaceState(null, '', `${location.pathname}?type=${m}`);
    }

    document.querySelectorAll('.cm-item[data-mode]').forEach((b) =>
      b.addEventListener('click', () => openComposer(b.dataset.mode)));

    // × → back to menu when inside composer, otherwise go Home
    els.close.addEventListener('click', (e) => {
      if (mode) { e.preventDefault(); showMenu(); }
    });

    /* ---------- Auth ---------- */
    (async () => {
      const user = await requireAuth();
      if (!user) return;
      currentUser = user;
      const initials = (user.displayName || user.email || '?')
        .trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
      els.avatar.textContent = initials || '?';
      els.name.textContent = user.displayName || user.email.split('@')[0];

      // Deep link: create-pulse.html?type=post | video
      const t = new URLSearchParams(location.search).get('type');
      if (t === 'post' || t === 'video') openComposer(t);
    })();

    /* ---------- Composer logic ---------- */
    function updatePostButton() {
      const hasText = els.text.value.trim().length > 0;
      // Video mode needs a video; Post mode needs text or a photo
      els.postBtn.disabled = mode === 'video' ? !selectedFile : !(hasText || selectedFile);
    }

    els.text.addEventListener('input', () => {
      els.charCount.textContent = `${els.text.value.length} / 500`;
      updatePostButton();
    });

    els.file.addEventListener('change', () => {
      const file = els.file.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith('video/');

      if (mode === 'video' && !isVideo) { showError('Please choose a video file.'); els.file.value = ''; return; }
      if (mode === 'post' && isVideo) { showError('Use "Pulse Video" to share videos.'); els.file.value = ''; return; }
      els.error.style.display = 'none';

      if (isVideo && file.size > 60 * 1024 * 1024) {
        showToast('That video is quite large — try one under 60MB.');
      }

      selectedFile = file;
      selectedIsVideo = isVideo;
      const url = URL.createObjectURL(file);

      if (isVideo) {
        els.previewImg.style.display = 'none';
        els.previewVideo.src = url;
        els.previewVideo.style.display = 'block';
      } else {
        els.previewVideo.style.display = 'none';
        els.previewImg.src = url;
        els.previewImg.style.display = 'block';
      }
      els.preview.style.display = 'block';
      updatePostButton();
    });

    els.removeMedia.addEventListener('click', () => {
      selectedFile = null;
      selectedIsVideo = false;
      els.file.value = '';
      els.preview.style.display = 'none';
      els.previewImg.style.display = 'none';
      els.previewVideo.style.display = 'none';
      updatePostButton();
    });

    function showError(msg) {
      els.error.textContent = msg;
      els.error.style.display = 'block';
    }

    function friendlyUploadError(err) {
      const msg = String(err?.message || '');
      if (msg === 'cloudinary-not-configured') {
        return 'Media upload is not configured yet (missing Cloudinary cloud name / preset).';
      }
      if (err?.name === 'AbortError') {
        return 'Upload is taking too long — check your connection and try again.';
      }
      return msg || 'Could not upload right now. Please try again.';
    }

    els.postBtn.addEventListener('click', async () => {
      if (!currentUser || !mode) return;
      els.error.style.display = 'none';
      els.postBtn.disabled = true;
      const idleLabel = mode === 'video' ? 'Post Video' : 'Post';
      els.postBtn.textContent = selectedIsVideo ? 'Uploading video…' : (selectedFile ? 'Uploading photo…' : 'Posting…');

      const author = {
        uid: currentUser.uid,
        authorName: currentUser.displayName || currentUser.email.split('@')[0],
        authorPhoto: currentUser.photoURL || '',
      };

      try {
        if (mode === 'video') {
          // Short video → "reels" collection → shows up in the Pulse tab (and Home feed).
          const videoURL = await uploadToCloudinary(selectedFile, 'gaivex/reels', 90000);

          await addDoc(collection(db, 'reels'), {
            ...author,
            videoURL,
            caption: els.text.value.trim(),
            likes: [],
            commentsCount: 0,
            createdAt: serverTimestamp(),
          });

          showToast('Added to Pulse ✦');
          window.location.href = 'pulse.html';
        } else {
          // Text / photo → "posts" collection → shows up in the Home feed.
          let mediaURL = '';
          if (selectedFile) {
            mediaURL = await uploadToCloudinary(selectedFile, 'gaivex/pulses', 45000);
          }

          await addDoc(collection(db, 'posts'), {
            ...author,
            text: els.text.value.trim(),
            mediaURL,
            likes: [],
            commentsCount: 0,
            createdAt: serverTimestamp(),
          });

          showToast('Pulse posted ✦');
          window.location.href = 'home.html';
        }
      } catch (err) {
        console.error(err);
        showError(friendlyUploadError(err));
        els.postBtn.disabled = false;
        els.postBtn.textContent = idleLabel;
      }
    });
  </script>
</body>
</html>
